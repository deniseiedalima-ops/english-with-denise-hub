<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>English with Denise</title>
<meta name="description" content="Aulas de inglês, produtos e contato — English with Denise.">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="fontLink" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--font:"Nunito",system-ui,sans-serif;--hw:800;--bg:#ffffff;--card:#fffefa;--ink:#2f2a3a;--muted:#857d8f;--line:#ece5df;--accent:#7a5fa6;--accent2:#e8821e;--soft:#f0eaf7;--shadow:0 14px 40px rgba(60,42,80,.09)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:-20vh -20vw auto auto;width:70vw;height:70vw;max-width:720px;max-height:720px;background:radial-gradient(circle,#f4eefa 0,transparent 62%);z-index:-1;pointer-events:none}
body::after{content:"";position:fixed;inset:auto auto -25vh -25vw;width:70vw;height:70vw;max-width:720px;max-height:720px;background:radial-gradient(circle,#fdf3ea 0,transparent 60%);z-index:-1;pointer-events:none}
a{color:inherit}
.wrap{max-width:980px;margin:0 auto;padding:44px 20px 70px}
.hero{text-align:center}
.avatar{width:112px;height:112px;border-radius:50%;object-fit:cover;border:4px solid #fff;box-shadow:var(--shadow);background:var(--soft);display:inline-flex;align-items:center;justify-content:center;font-family:var(--font);font-size:44px;color:var(--accent)}
.kicker{margin-top:18px;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);font-weight:700}
h1{font-family:var(--font);font-weight:var(--hw);font-size:clamp(32px,6.5vw,46px);line-height:1.1;margin:8px 0 10px;letter-spacing:-.02em}
.bio{color:var(--muted);font-size:16px;line-height:1.6;max-width:520px;margin:0 auto;white-space:pre-line}
.links{display:flex;flex-direction:column;gap:11px;margin:30px auto 0;max-width:520px}
.hero{max-width:640px;margin:0 auto}
.lbtn{display:flex;align-items:center;gap:14px;padding:16px 20px;border-radius:18px;background:var(--card);border:1px solid var(--line);text-decoration:none;font-weight:700;font-size:15px;box-shadow:0 4px 14px rgba(60,42,80,.05);transition:transform .18s,box-shadow .18s,border-color .18s}
.lbtn:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:#d9cbe6}
.lbtn .ic{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:19px;background:var(--soft);flex:0 0 auto}
.lbtn .arrow{margin-left:auto;color:#b4a9c0;font-size:18px}
.lbtn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.lbtn.primary .ic{background:#ffffff2a}.lbtn.primary .arrow{color:#ffffffb0}
section{margin-top:54px}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:16px}
h2{font-family:var(--font);font-weight:var(--hw);font-size:30px;margin:0;letter-spacing:-.01em}
.sec-sub{color:var(--muted);font-size:14px;margin-top:4px}
.navs{display:flex;gap:8px}
.navs button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:18px;color:var(--accent);transition:all .15s}
.navs button:hover{background:var(--soft)}
/* Mini slides — cards brancos com estrela cadente */
.carousel{position:relative}
.slides{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;padding:10px 20px 26px;margin:0 -20px;scrollbar-width:none}
.slides::-webkit-scrollbar{display:none}
.slide{scroll-snap-align:start;flex:0 0 calc((100% - 36px)/3);min-width:250px;background:#fff;border-radius:24px;border:1px solid #efe9f3;box-shadow:0 10px 30px rgba(60,42,80,.07);padding:22px 22px 24px;display:flex;flex-direction:column;transition:transform .25s,box-shadow .25s}
.slide:hover{transform:translateY(-4px);box-shadow:0 18px 40px rgba(60,42,80,.11)}
.star-art{height:150px;margin:-4px -6px 6px;display:block;overflow:visible}
.star-art .trail{stroke-dasharray:420;stroke-dashoffset:420;transition:stroke-dashoffset 1.4s cubic-bezier(.2,.7,.2,1)}
.slide.seen .trail{stroke-dashoffset:0}
.star-art .star{transform-box:fill-box;transform-origin:center;opacity:0;transition:opacity .4s .9s}
.slide.seen .star{opacity:1;animation:twinkle 2.6s 1.3s ease-in-out infinite}
.star-art .spark{opacity:0;transition:opacity .4s 1.1s}
.slide.seen .spark{opacity:1;animation:twinkle 2.2s 1.5s ease-in-out infinite}
@keyframes twinkle{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.18) rotate(12deg)}}
.slide .tag{align-self:flex-start;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--c);background:color-mix(in srgb,var(--c) 12%,#fff);border-radius:999px;padding:4px 10px;margin-bottom:8px}
.slide h3{font-family:var(--font);font-weight:700;font-size:25px;line-height:1.15;margin:0 0 10px;color:#221d2b;letter-spacing:-.01em}
.sdesc{color:#5d5568;font-size:15.5px;line-height:1.6;white-space:pre-line}
.more{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s ease}
.slide.open .more{grid-template-rows:1fr}
.more>div{overflow:hidden}
.more-in{padding-top:12px;color:#5d5568;font-size:14.5px;line-height:1.6;white-space:pre-line}
.more .price{display:block;margin-top:10px;font-weight:700;font-size:17px;color:#221d2b}
.more .cta{margin-top:12px}
.sfoot{margin-top:auto;padding-top:18px}
.saber{display:inline-flex;align-items:center;gap:10px;border:0;cursor:pointer;font:700 15px var(--font);color:#2b2233;background:var(--btn,#f2c94c);padding:13px 20px;border-radius:14px;box-shadow:0 6px 22px color-mix(in srgb,var(--btn,#f2c94c) 55%,transparent);transition:transform .15s,box-shadow .15s}
.saber:hover{transform:translateY(-1px);box-shadow:0 10px 28px color-mix(in srgb,var(--btn,#f2c94c) 70%,transparent)}
.saber svg{transition:transform .3s}
.slide.open .saber svg{transform:rotate(180deg)}
.cta{display:inline-flex;align-items:center;gap:6px;padding:11px 18px;border-radius:12px;background:var(--c);color:#fff;text-decoration:none;font-weight:700;font-size:14px}
.cta:hover{filter:brightness(1.07)}
.cnav{position:absolute;top:42%;transform:translateY(-50%);width:42px;height:42px;border-radius:12px;border:1px solid #ece6f0;background:#fff;box-shadow:0 6px 18px rgba(60,42,80,.1);cursor:pointer;display:flex;align-items:center;justify-content:center;color:#4a3f58;z-index:2}
.cnav:hover{background:#faf7fc}
.cnav.prev{left:-58px}.cnav.next{right:-58px}
.dots{display:flex;gap:6px;justify-content:center;margin-top:2px}
.dots i{width:7px;height:7px;border-radius:99px;background:#e3dcea;transition:all .2s}
.dots i.on{width:20px;background:var(--accent)}
@media(max-width:860px){.cnav{display:none}}
/* Depoimentos */
.videos{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:start}
.video{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 6px 20px rgba(60,42,80,.06)}
.vframe{position:relative;aspect-ratio:9/16;background:#201a28;cursor:pointer}
.vframe.wide{aspect-ratio:16/9}
.vframe img{width:100%;height:100%;object-fit:cover;opacity:.92;transition:opacity .2s}
.vframe:hover img{opacity:1}
.vframe iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:62px;height:62px;border-radius:50%;background:#fffffff0;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.play::before{content:"";border-left:18px solid var(--accent);border-top:11px solid transparent;border-bottom:11px solid transparent;margin-left:5px}
.vcap{padding:12px 14px}
.vcap b{display:block;font-size:14px}
.vcap span{color:var(--muted);font-size:13px;line-height:1.45;display:block;margin-top:3px}
/* Contato no fim + blocos personalizados */
.contact-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.cbtn{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:24px 16px;border-radius:22px;background:#fff;border:1px solid #efe9f3;box-shadow:0 8px 24px rgba(60,42,80,.06);text-decoration:none;transition:transform .2s,box-shadow .2s}
.cbtn:hover{transform:translateY(-3px);box-shadow:0 16px 34px rgba(60,42,80,.11)}
.cic{width:56px;height:56px;border-radius:18px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:26px;margin-bottom:4px}
.cbtn b{font-size:15px}
.cbtn small{color:var(--muted);font-size:13px;word-break:break-all}
.text-body{color:#4e4659;font-size:16px;line-height:1.7;white-space:pre-line}
.block-text.center{text-align:center}.block-text.center .sec-head{justify-content:center}
.msg{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:var(--mbg);border-radius:22px;padding:22px 24px;border:1px solid color-mix(in srgb,var(--mfg) 18%,transparent)}
.msg-emoji{font-size:34px}
.msg-main{flex:1;min-width:200px}
.msg h3{margin:0 0 4px;font-family:var(--font);font-weight:var(--hw);font-size:23px;color:var(--mfg)}
.msg p{margin:0;color:#4e4659;line-height:1.6;white-space:pre-line}
.msg-btn{display:inline-flex;padding:12px 18px;border-radius:12px;background:var(--mfg);color:#fff;text-decoration:none;font-weight:700;font-size:14px;white-space:nowrap}
.series{display:flex;flex-direction:column;gap:10px;margin-top:12px;align-items:flex-start}
.series .cta{margin-top:0}
.series-toggle{display:inline-flex;align-items:center;gap:8px;border:1px solid color-mix(in srgb,var(--c) 40%,#fff);background:color-mix(in srgb,var(--c) 10%,#fff);color:#2f2a3a;font:700 14px var(--font);padding:10px 14px;border-radius:12px;cursor:pointer}
.series-toggle svg{transition:transform .25s}
.series.open .series-toggle svg{transform:rotate(180deg)}
.series-list{display:none;flex-direction:column;gap:8px;width:100%}
.series.open .series-list{display:flex}
.series-item{display:flex;justify-content:space-between;gap:10px;padding:11px 14px;border-radius:12px;border:1px solid #ece5f1;background:#fff;text-decoration:none;font-weight:700;font-size:14px;color:#2f2a3a}
.series-item:hover{border-color:var(--c)}
.pop{position:fixed;inset:0;background:rgba(40,30,50,.42);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
.pop.show{display:flex;animation:popIn .2s ease}
@keyframes popIn{from{opacity:0}to{opacity:1}}
.pop-card{position:relative;background:#fff;border-radius:26px;padding:30px 26px 26px;width:min(440px,100%);max-height:88vh;overflow:auto;box-shadow:0 30px 80px rgba(40,25,60,.3);border-top:6px solid var(--c)}
.pop-card h3{font-family:var(--font);font-weight:var(--hw);font-size:24px;margin:0 30px 6px 0;color:#221d2b}
.pop-card p{color:#5d5568;margin:0 0 16px;line-height:1.55}
.pop-x{position:absolute;top:14px;right:14px;width:36px;height:36px;border-radius:50%;border:0;background:#f4f0f7;cursor:pointer;font-size:15px;color:#5d5568}
.pop-links{display:flex;flex-direction:column;gap:10px}
.pop-link{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:15px 18px;border-radius:14px;border:1px solid #ece5f1;text-decoration:none;font-weight:700;color:#2f2a3a;background:#fff;transition:transform .15s,border-color .15s}
.pop-link:hover{transform:translateY(-1px);border-color:var(--c)}
.pop-link.first{background:var(--c);color:#fff;border-color:var(--c)}
button.cta{border:0;cursor:pointer;font-family:var(--font)}
footer{text-align:center;color:#a79fb2;font-size:12px;margin-top:60px}
footer b{font-family:var(--font);font-weight:var(--hw);color:var(--accent);font-size:16px;display:block;margin-bottom:4px}
.empty{color:var(--muted);text-align:center;padding:40px 0}
@media(max-width:640px){
  .wrap{padding-top:34px}
  .videos{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:72%;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -20px;padding:4px 20px 12px;scrollbar-width:none}
  .videos::-webkit-scrollbar{display:none}
  .video{scroll-snap-align:start}
  .navs{display:none}
  .slide{flex-basis:82%}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="pop" class="pop" onclick="if(event.target===this)closePopup()"></div>
<main class="wrap" id="app"><div class="empty">Carregando…</div></main>
<script>
const ICONS={whatsapp:"💬",instagram:"📸",email:"✉️",telegram:"✈️",youtube:"▶️",site:"🌐",agenda:"📅",outro:"🔗"};
const STAR_COLORS={rosa:"#e8367f",azul:"#3ec5ee",amarelo:"#f2c230",lilas:"#9b5de5",laranja:"#f2832a",verde:"#2fb486",vinho:"#b5179e"};
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function safeUrl(u){u=String(u||"").trim(); if(!u) return ""; if(/^(https?:|mailto:|tel:)/i.test(u)) return u; if(/^[\w.+-]+@[\w-]+\.[\w.]+$/.test(u)) return "mailto:"+u; if(/^javascript:/i.test(u)) return ""; return "https://"+u;}
function ytId(u){u=String(u||"");const m=u.match(/(?:youtu\.be\/|v=|\/shorts\/|\/embed\/|\/live\/)([\w-]{11})/);return m?m[1]:(/^[\w-]{11}$/.test(u.trim())?u.trim():"");}
function isShort(u){return /\/shorts\//.test(String(u||""));}

const FONTS={
  nunito:{family:"Nunito",q:"Nunito:wght@400;600;700;800",hw:800},
  quicksand:{family:"Quicksand",q:"Quicksand:wght@400;500;600;700",hw:700},
  fredoka:{family:"Fredoka",q:"Fredoka:wght@400;500;600",hw:600},
  varela:{family:"Varela Round",q:"Varela+Round",hw:400},
  mplus:{family:"M PLUS Rounded 1c",q:"M+PLUS+Rounded+1c:wght@400;500;700;800",hw:800}
};
function applyFont(key){
  const f=FONTS[key]||FONTS.nunito, link=document.getElementById("fontLink");
  const href=`https://fonts.googleapis.com/css2?family=${f.q}&display=swap`;
  if(link && link.getAttribute("href")!==href) link.setAttribute("href",href);
  document.documentElement.style.setProperty("--font",`"${f.family}",system-ui,sans-serif`);
  document.documentElement.style.setProperty("--hw",f.hw);
}
const DEFAULT_SECTIONS=[{id:"sec_products",kind:"products"},{id:"sec_testimonials",kind:"testimonials"},{id:"sec_contact",kind:"contact",title:"Fale comigo",sub:"Me chama em qualquer um desses canais 💜"}];
const TONES={lilas:["#f3edfa","#7a5fa6"],laranja:["#fdf0e4","#c4661a"],verde:["#e9f6ef","#2f8a5f"],amarelo:["#fdf6dc","#9a7a10"],rosa:["#fcebf2","#b8326b"],azul:["#e8f5fc","#2a7fa8"]};
function linkBtn(l,primary){return `<a class="lbtn ${primary?"primary":""}" href="${esc(safeUrl(l.url))}" target="_blank" rel="noopener"><span class="ic">${ICONS[l.type]||"🔗"}</span><span>${esc(l.label||l.type)}</span><span class="arrow">→</span></a>`;}
function secHead(t,sub){return t||sub?`<div class="sec-head"><div>${t?`<h2>${esc(t)}</h2>`:""}${sub?`<div class="sec-sub">${esc(sub)}</div>`:""}</div></div>`:"";}
function render(site){
  const app=document.getElementById("app");
  if(!site){ app.innerHTML=`<div class="empty">Página em construção ✨</div>`; return; }
  document.documentElement.style.setProperty("--accent",site.accent||"#7a5fa6");
  document.documentElement.style.setProperty("--btn",site.buttonColor||"#f2c94c");
  applyFont(site.font);
  __pk=0; POPUPS={};
  document.title=site.pageTitle||site.name||"English with Denise";
  const links=(site.links||[]).filter(l=>l.visible!==false && safeUrl(l.url));
  const products=(site.products||[]).filter(p=>p.visible!==false && p.title);
  const vids=(site.testimonials||[]).filter(t=>ytId(t.url));
  const initials=(site.name||"D").trim().charAt(0).toUpperCase();
  const sections=(Array.isArray(site.sections)&&site.sections.length?site.sections:DEFAULT_SECTIONS).filter(x=>x.visible!==false);
  const R={
    products:()=>products.length?`<section id="produtos">
      ${secHead(site.productsTitle||"Meus produtos",site.productsSub)}
      <div class="carousel">
        ${products.length>3?`<button class="cnav prev" aria-label="Anterior" onclick="slideBy(-1)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button><button class="cnav next" aria-label="Próximo" onclick="slideBy(1)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>`:""}
        <div class="slides" id="slides" onscroll="updDots()">${products.map(productHTML).join("")}</div>
      </div>
      ${products.length>1?`<div class="dots" id="dots">${products.map((_,k)=>`<i class="${k?"":"on"}"></i>`).join("")}</div>`:""}
    </section>`:"",
    testimonials:()=>vids.length?`<section id="depoimentos">
      ${secHead(site.testimonialsTitle||"O que meus alunos dizem",site.testimonialsSub)}
      <div class="videos">${vids.map(t=>{const id=ytId(t.url),short=isShort(t.url)||t.vertical;return `<article class="video"><div class="vframe ${short?"":"wide"}" onclick="playVid(this,'${id}')" role="button" aria-label="Assistir depoimento"><img loading="lazy" src="https://i.ytimg.com/vi/${id}/${short?"oar2":"hqdefault"}.jpg" onerror="this.onerror=null;this.src='https://i.ytimg.com/vi/${id}/hqdefault.jpg'" alt=""><span class="play"></span></div>${t.name||t.quote?`<div class="vcap">${t.name?`<b>${esc(t.name)}</b>`:""}${t.quote?`<span>${esc(t.quote)}</span>`:""}</div>`:""}</article>`}).join("")}</div>
    </section>`:"",
    contact:(x)=>links.length?`<section id="contato" class="contact">
      ${secHead(x.title,x.sub)}
      <div class="contact-grid">${links.map(l=>`<a class="cbtn" href="${esc(safeUrl(l.url))}" target="_blank" rel="noopener"><span class="cic">${ICONS[l.type]||"🔗"}</span><b>${esc(l.label||l.type)}</b>${l.display?`<small>${esc(l.display)}</small>`:""}</a>`).join("")}</div>
    </section>`:"",
    text:(x)=>(x.title||x.body)?`<section class="block-text ${x.align==="center"?"center":""}">${secHead(x.title,x.sub)}${x.body?`<div class="text-body">${esc(x.body)}</div>`:""}</section>`:"",
    links:(x)=>{const it=(x.items||[]).filter(i=>i.label&&safeUrl(i.url)); return it.length?`<section class="block-links">${secHead(x.title,x.sub)}<div class="links" style="margin-top:0;max-width:none">${it.map(i=>linkBtn({...i,type:"outro"},false)).join("")}</div></section>`:"";},
    message:(x)=>{if(!x.title&&!x.body) return ""; const t=TONES[x.tone]||TONES.lilas; return `<section><div class="msg" style="--mbg:${t[0]};--mfg:${t[1]}">${x.emoji?`<div class="msg-emoji">${esc(x.emoji)}</div>`:""}<div class="msg-main">${x.title?`<h3>${esc(x.title)}</h3>`:""}${x.body?`<p>${esc(x.body)}</p>`:""}</div>${x.btnLabel&&safeUrl(x.btnUrl)?`<a class="msg-btn" href="${esc(safeUrl(x.btnUrl))}" target="_blank" rel="noopener">${esc(x.btnLabel)} →</a>`:""}</div></section>`;}
  };
  app.innerHTML=`
    <header class="hero">
      ${site.photo?`<img class="avatar" src="${esc(site.photo)}" alt="${esc(site.name)}">`:`<div class="avatar">${esc(initials)}</div>`}
      ${site.kicker?`<div class="kicker">${esc(site.kicker)}</div>`:""}
      <h1>${esc(site.name||"English with Denise")}</h1>
      ${site.bio?`<p class="bio">${esc(site.bio)}</p>`:""}
      ${site.contactTop&&links.length?`<nav class="links">${links.map((l,k)=>linkBtn(l,k===0&&site.highlightFirst!==false)).join("")}</nav>`:""}
    </header>
    ${sections.map(x=>(R[x.kind]||(()=>""))(x)).join("")}
    <footer><b>${esc(site.footer||"English with Denise")}</b>© ${new Date().getFullYear()}</footer>`;
  watchSlides();
}
function starSVG(color,k){
  const g="g"+k;
  return `<svg class="star-art" viewBox="0 0 320 150" aria-hidden="true">
    <defs>
      <linearGradient id="${g}" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="${color}" stop-opacity="0"/><stop offset=".45" stop-color="${color}" stop-opacity=".45"/><stop offset="1" stop-color="${color}"/></linearGradient>
      <filter id="${g}f" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>
    <path class="trail" d="M18 118 H62 L86 138 L130 92 H182 L252 30" fill="none" stroke="url(#${g})" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path class="trail" d="M60 104 H90 L132 70" fill="none" stroke="url(#${g})" stroke-width="2.5" stroke-linecap="round" opacity=".5"/>
    <g filter="url(#${g}f)"><polygon class="star" fill="${color}" points="262,6 268.5,20.5 284,22 272.5,32.5 276,48 262,40 248,48 251.5,32.5 240,22 255.5,20.5"/></g>
    <path class="spark" d="M286 52 l2.5 6 6 2.5 -6 2.5 -2.5 6 -2.5 -6 -6 -2.5 6 -2.5z" fill="${color}" opacity=".75"/>
    <circle class="spark" cx="232" cy="14" r="2.6" fill="${color}" opacity=".6"/>
    <circle class="spark" cx="290" cy="16" r="1.8" fill="${color}" opacity=".5"/>
  </svg>`;
}
let __pk=0; let POPUPS={};
function productHTML(p){
  const c=STAR_COLORS[p.color]||STAR_COLORS.lilas, k=__pk++;
  const pops=(p.mode==="popup"?(p.popupLinks||[]):[]).filter(x=>x.label&&safeUrl(x.url));
  const href=pops.length?"#":safeUrl(p.url);
  const hasMore=p.details||p.price||href;
  if(pops.length) POPUPS[k]={title:p.popupTitle||p.title,text:p.popupText||"",links:pops,color:c};
  return `<article class="slide" style="--c:${c}">
    ${starSVG(c,k)}
    ${p.tag?`<span class="tag">${esc(p.tag)}</span>`:""}
    <h3>${esc(p.title)}</h3>
    ${p.desc?`<div class="sdesc">${esc(p.desc)}</div>`:""}
    ${hasMore?`<div class="more"><div><div class="more-in">${p.details?esc(p.details):""}${p.price?`<span class="price">${esc(p.price)}</span>`:""}${pops.length?seriesHTML(pops,p):(href?`<div><a class="cta" href="${esc(href)}" target="_blank" rel="noopener">${esc(p.cta||"Quero participar")} →</a></div>`:"")}</div></div></div>
    <div class="sfoot"><button class="saber" onclick="this.closest('.slide').classList.toggle('open')">Saber mais <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button></div>`:""}
  </article>`;
}
function seriesHTML(pops,p){
  const first=pops[0], rest=pops.slice(1);
  return `<div class="series">
    <a class="cta" href="${esc(safeUrl(first.url))}" target="_blank" rel="noopener">${esc(first.label)} →</a>
    ${rest.length?`<button class="series-toggle" onclick="this.closest('.series').classList.toggle('open')">📺 ${esc(p.listLabel||"Ver as séries disponíveis")} (${rest.length}) <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
    <div class="series-list">${rest.map(x=>`<a class="series-item" href="${esc(safeUrl(x.url))}" target="_blank" rel="noopener"><span>${esc(x.label)}</span><span>→</span></a>`).join("")}</div>`:""}
  </div>`;
}
function openPopup(k){
  const d=POPUPS[k]; if(!d) return;
  const box=document.getElementById("pop");
  box.innerHTML=`<div class="pop-card" role="dialog" aria-modal="true" style="--c:${d.color}">
    <button class="pop-x" aria-label="Fechar" onclick="closePopup()">✕</button>
    <h3>${esc(d.title)}</h3>${d.text?`<p>${esc(d.text)}</p>`:""}
    <div class="pop-links">${d.links.map((x,i)=>`<a class="pop-link ${i===0?"first":""}" href="${esc(safeUrl(x.url))}" target="_blank" rel="noopener"><span>${esc(x.label)}</span><span>→</span></a>`).join("")}</div>
  </div>`;
  box.classList.add("show"); document.body.style.overflow="hidden";
}
function closePopup(){ const b=document.getElementById("pop"); b.classList.remove("show"); document.body.style.overflow=""; }
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closePopup(); });
function watchSlides(){
  const els=document.querySelectorAll(".slide");
  if(!("IntersectionObserver" in window)){ els.forEach(e=>e.classList.add("seen")); return; }
  const io=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add("seen"); io.unobserve(e.target); } }),{threshold:.35});
  els.forEach(e=>io.observe(e));
}
function slideBy(d){const s=document.getElementById("slides");if(!s)return;const w=s.querySelector(".slide")?.offsetWidth||270;s.scrollBy({left:d*(w+18),behavior:"smooth"});}
function updDots(){const s=document.getElementById("slides"),d=document.getElementById("dots");if(!s||!d)return;const w=(s.querySelector(".slide")?.offsetWidth||270)+18;const k=Math.round(s.scrollLeft/w);[...d.children].forEach((x,i)=>x.classList.toggle("on",i===Math.min(k,d.children.length-1)));}
function playVid(el,id){el.onclick=null;el.innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0&playsinline=1" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen title="Depoimento"></iframe>`;}

// Prévia no Studio: recebe o rascunho via postMessage. Página pública: busca o conteúdo publicado.
const isPreview=new URLSearchParams(location.search).has("preview");
window.addEventListener("message",e=>{ if(e.source!==window.parent) return; if(e.data&&e.data.type==="ewd-site") render(e.data.site); });
if(isPreview){ try{ window.parent.postMessage({type:"ewd-site-ready"},"*"); }catch(e){} }
else{
  fetch("/api/site").then(r=>r.ok?r.json():null).then(d=>render(d&&d.site)).catch(()=>render(null));
}
</script>
