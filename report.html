<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Relatório da aula · English with Denise</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#E8821E">
<style>body{margin:0;font-family:system-ui,sans-serif;background:#FBF7F2;color:#3A2E26;display:grid;place-items:center;min-height:100vh;text-align:center}.msg{padding:30px}.dot{width:42px;height:42px;border-radius:50%;border:4px solid #F6E3CF;border-top-color:#E8821E;animation:s 1s linear infinite;margin:0 auto 14px}@keyframes s{to{transform:rotate(360deg)}}</style>
</head><body><div class="msg"><div class="dot"></div>Carregando seu relatório…</div>
<script src="/report-render.js"></script>
<script>
(async()=>{
  const q=new URLSearchParams(location.search);
  try{
    const r=await fetch(`/api/report?id=${encodeURIComponent(q.get("id")||"")}&k=${encodeURIComponent(q.get("k")||"")}`);
    const d=await r.json();
    if(!r.ok||!d.report) throw new Error(d.error||"Relatório não encontrado.");
    document.open(); document.write(EWDReport.render(d.report)); document.close();
  }catch(e){ document.querySelector(".msg").textContent=e.message||"Relatório não encontrado."; }
})();
</script>
</body></html>
