<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EWD Studio — Class Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700&family=Quicksand:wght@700&family=Fredoka:wght@600&family=Varela+Round&family=M+PLUS+Rounded+1c:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f6f8; --panel:#ffffff; --ink:#1f2937; --muted:#6b7280; --line:#e5e7eb;
  --accent:#5b4b8a; --accent2:#ede9fe; --ok:#e8f5e9; --warn:#fff7e6; --bad:#fdecec; --blue:#eaf2ff;
}
*{box-sizing:border-box} body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
aside{background:#171923;color:#fff;padding:22px 16px;position:sticky;top:0;height:100vh}
.brand{font-weight:800;font-size:20px;margin:0 0 4px}.sub{font-size:12px;color:#aeb4c0;margin-bottom:22px}
nav button{width:100%;text-align:left;background:transparent;border:0;color:#d7dbe3;padding:11px 12px;border-radius:10px;margin:3px 0;cursor:pointer}
nav button.active,nav button:hover{background:#2a2f3a;color:#fff}
main{padding:26px;max-width:1500px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:12px}
h1{font-size:28px;margin:0} h2{font-size:20px;margin:0 0 14px} h3{font-size:16px;margin:0 0 8px}
.muted{color:var(--muted)} .small{font-size:12px}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.span12{grid-column:span 12}.span8{grid-column:span 8}.span6{grid-column:span 6}.span4{grid-column:span 4}.span3{grid-column:span 3}
.kpi{font-size:30px;font-weight:800;margin-top:4px}
.list{display:flex;flex-direction:column;gap:9px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px;border:1px solid var(--line);border-radius:12px;background:#fff}
.row .main{min-width:0}.row .title{font-weight:700}.row .meta{font-size:12px;color:var(--muted);margin-top:3px}
.badge{display:inline-flex;align-items:center;padding:4px 8px;border-radius:999px;font-size:12px;font-weight:700;background:#eef2f7}
.badge.a1{background:#fff2cc}.badge.a2{background:#e6f4ff}.badge.b1{background:#ede9fe}.badge.conv{background:#e8f5e9}
.btn{border:1px solid var(--line);background:#fff;padding:9px 12px;border-radius:10px;cursor:pointer}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)} .btn.danger{background:#fff;color:#b91c1c}
.btn.small{padding:6px 8px;font-size:12px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff}
textarea{min-height:82px;resize:vertical}
label{display:block;font-size:12px;font-weight:700;margin-bottom:5px;color:#4b5563}
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.formgrid .full{grid-column:1/-1}
.statuses{display:flex;gap:8px;flex-wrap:wrap}
.status{padding:9px 11px;border:1px solid var(--line);background:#fff;border-radius:10px;cursor:pointer}
.status.selected{outline:2px solid var(--accent);background:var(--accent2)}
.progress{display:flex;gap:8px;flex-wrap:wrap}.progress button{flex:1;min-width:70px}
.section{display:none}.section.active{display:block}
.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;vertical-align:top}
.table th{font-size:12px;color:#6b7280}
.lesson-detail{background:#fafafa;border:1px dashed var(--line);border-radius:12px;padding:12px;margin-top:10px}
.notice{padding:11px 12px;border-radius:10px;background:var(--warn);font-size:13px}
.ok{background:var(--ok)} .dangerbox{background:var(--bad)} .blue{background:var(--blue)}
.searchbar{display:flex;gap:8px;margin-bottom:12px}.searchbar input{flex:1}
.modalback{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
.modalback.show{display:flex}.modal{background:#fff;width:min(760px,100%);max-height:90vh;overflow:auto;border-radius:18px;padding:18px}
.modalhead{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:14px}
.hr{height:1px;background:var(--line);margin:14px 0}
.warm-suggestion{border-left:4px solid var(--accent);padding-left:10px}
@media(max-width:900px){.app{grid-template-columns:1fr}aside{position:relative;height:auto}nav{display:flex;overflow:auto}nav button{min-width:max-content}main{padding:16px}.span8,.span6,.span4,.span3{grid-column:span 12}.formgrid{grid-template-columns:1fr}}
.history-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:800px){.history-summary{grid-template-columns:repeat(2,1fr)}}

.planning-day{margin-bottom:18px;overflow:hidden}
.planning-day-title{padding:16px 18px;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between}
.planning-day-title h3{margin:0 0 3px}
.time-cell{white-space:nowrap;width:100px}

.member-fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.member-field{background:#f7f8fb;border:1px solid #e4e7ec;border-radius:10px;padding:10px}
.member-field label{margin-bottom:6px}
@media(max-width:760px){.member-fields{grid-template-columns:1fr}}

.student-edit-btn{white-space:nowrap}

.homework-line{margin-top:8px}
.homework-check{display:inline-flex;align-items:center;gap:6px;margin-right:12px;font-size:12px;cursor:pointer}
.homework-check input{width:16px;height:16px;cursor:pointer}
.homework-check input:checked + span{font-weight:700}
.homework-group{display:flex;flex-wrap:wrap;gap:4px 8px}

.today-title-line{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.today-homework-inline{margin-left:auto;display:inline-flex;align-items:center}
.homework-check{white-space:nowrap}
</style>
<style>
.member-attendance{display:flex;flex-direction:column;gap:10px}
.member-attendance-row{border:1px solid var(--border,#ddd);border-radius:14px;padding:12px;background:#fff}
.member-statuses{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}
.member-statuses .status{font-size:14px;padding:8px 10px}
@media(max-width:800px){.member-statuses .status{flex:1 1 140px}}

.curriculum-note{padding:10px 12px;border:1px dashed var(--accent);border-radius:10px;background:var(--accent2);color:var(--ink);font-size:12px;margin:10px 0}
@media(max-width:850px){.app{grid-template-columns:1fr}aside{position:relative;height:auto;padding:14px}nav{display:flex;overflow-x:auto;gap:5px}nav button{white-space:nowrap;width:auto;flex:0 0 auto}main{padding:16px}}
</style>

<style id="ewd-aesthetic-refresh">
:root{
  --bg:#f7f5f2;--panel:#fffefa;--ink:#343044;--muted:#898494;--line:#ebe6e1;
  --accent:#8068a8;--accent2:#f0eaf7;--ok:#eaf4ed;--warn:#fbf2df;--bad:#faeaea;--blue:#edf3f8;
  --lavender:#e9e0f2;--rose:#f5e6e8;--sage:#e8eee6;--cream:#fffefa;
  --shadow:0 12px 35px rgba(57,43,72,.065);
}
body{background:var(--bg);color:var(--ink);font-family:Inter,"Aptos",system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:-.01em}
.app{grid-template-columns:252px minmax(0,1fr);gap:0}
aside{
  background:linear-gradient(180deg,#eee7f4 0%,#f3edf3 48%,#f2eee8 100%);
  color:#443b51;padding:28px 18px;box-shadow:inset -1px 0 #e7dfea;
}
.brand{font-family:Georgia,serif;font-size:27px;letter-spacing:-.06em;color:#5e4d76;margin:4px 8px 3px}
.sub{color:#898094;font-size:11px;line-height:1.55;margin:0 8px 28px}
nav{display:flex;flex-direction:column;gap:6px}
nav button{
  display:flex;align-items:center;gap:10px;text-align:left;width:100%;border:1px solid transparent;
  color:#70677b;padding:12px 13px;border-radius:13px;margin:0;background:transparent;
  font-size:13px;font-weight:650;transition:all .2s ease
}
nav button:hover{background:#ffffffa8;color:#5b4b70;transform:translateX(2px)}
nav button.active{background:#fffefa;color:#5e4b78;border-color:#e8dfed;box-shadow:0 5px 16px #6a547a12}
main{padding:34px clamp(20px,3vw,48px) 60px;max-width:1700px;width:100%}
.topbar{padding:0 0 22px;margin-bottom:24px;border-bottom:1px solid #e9e3df}
h1{font-family:Georgia,"Times New Roman",serif;font-weight:500;font-size:34px;letter-spacing:-.045em;color:#373044}
h2{font-family:Georgia,serif;font-weight:500;font-size:23px;letter-spacing:-.025em;color:#41364f;margin-bottom:16px}
h3{font-size:15px;font-weight:750;color:#453c50}
.muted{color:var(--muted)}
.card{background:var(--panel);border:1px solid #ece6e2;border-radius:19px;padding:21px;box-shadow:var(--shadow);transition:transform .2s ease,box-shadow .2s ease}
.card:hover{box-shadow:0 15px 38px rgba(57,43,72,.09)}
.kpi{font-family:Georgia,serif;font-size:35px;font-weight:500;color:#5f4b79;margin-top:5px}
.badge{border-radius:999px;padding:5px 10px;font-size:10px;letter-spacing:.04em}
.badge.a1{background:#f8efd9;color:#90723b}.badge.a2{background:#e8f0f3;color:#557483}
.badge.b1{background:#eee7f5;color:#70588d}.badge.conv{background:#e8eee6;color:#62795f}
.btn{border:1px solid #e6dfeb;background:#fffefa;color:#655879;padding:9px 14px;border-radius:999px;font-size:12px;font-weight:700;transition:all .18s ease}
.btn:hover{border-color:#cbbbdc;background:#f8f4fb;transform:translateY(-1px)}
.btn.primary{background:#796294;color:#fff;border-color:#796294;box-shadow:0 5px 14px #79629425}
.btn.primary:hover{background:#66517f;box-shadow:0 8px 18px #79629435}
.btn.danger{color:#b65e67;background:#fff8f7;border-color:#f0dada}
.row{background:#fffefa;border:1px solid #eee8e4;border-radius:15px;padding:14px 15px;transition:border-color .18s,transform .18s}
.row:hover{border-color:#d8cbe3;transform:translateY(-1px)}
.row .title{font-size:13px;color:#433a4d}
.row .meta{font-size:11px;color:#96909b}
input,select,textarea{border:1px solid #e7e0e9;border-radius:11px;background:#fffefa;color:#393346;padding:11px 12px;outline:none;transition:border-color .18s,box-shadow .18s}
input:focus,select:focus,textarea:focus{border-color:#ad98c4;box-shadow:0 0 0 3px #eee7f5}
label{color:#70677b;font-size:11px;letter-spacing:.015em}
textarea{min-height:100px}
.status{border:1px solid #e8e1eb;border-radius:999px;background:#fffefa;color:#776e80;padding:9px 13px;font-size:11px;font-weight:650}
.status.selected{outline:0;border-color:#9d85b7;background:#f0eaf7;color:#634d7e;box-shadow:inset 0 0 0 1px #cbbbdc}
.notice{border-radius:13px;padding:13px 15px;border:1px solid #efe5d1;background:#fbf5e8;color:#736344}
.notice.blue{background:#eff4f7;border-color:#e1e9ed;color:#5f707a}
.notice.ok{background:#edf4ed;border-color:#dfeade;color:#5d745d}
.lesson-detail{background:#f8f5fa;border:1px solid #ebe3f0;border-radius:13px;padding:14px;color:#71667d}
.tablewrap{border:1px solid #ece6e2;border-radius:16px;background:#fffefa}
.table{border-collapse:separate;border-spacing:0}
.table th{background:#f7f3f8;color:#776c83;font-size:10px;text-transform:uppercase;letter-spacing:.07em}
.table td{color:#50485a;border-bottom:1px solid #f0ebe7}
.modalback{background:rgba(48,39,57,.38);backdrop-filter:blur(7px);padding:24px}
.modal{background:#fffefa;border:1px solid #eee7e1;border-radius:23px;padding:26px;box-shadow:0 25px 90px #30243b30}
.modalhead{padding-bottom:15px;border-bottom:1px solid #eee8e3}
.modalhead h2{margin:0 0 4px;font-size:25px}
.hr{background:#eee8e3;margin:18px 0}
.formgrid{gap:15px}
.formgrid>div{min-width:0}
.formgrid .full{grid-column:1/-1}
.statuses,.progress{gap:7px}
.progress button{min-width:65px}
.homework-check{color:#82788c;font-size:11px}
.homework-check input{accent-color:#8068a8}
.member-attendance-row{background:#fbf9fc;border-color:#eee7f1;border-radius:13px}
.member-field{background:#f8f5f8;border-color:#eee6ef}
.searchbar{align-items:center}
.searchbar input{border-radius:999px;padding:12px 17px}
.history-summary{gap:13px}
.planning-day{border:1px solid #ece6e2;border-radius:19px;background:#fffefa}
.planning-day-title{background:#faf7fa;border-color:#eee7ef;padding:18px 20px}
.section{animation:ewdFade .28s ease}
@keyframes ewdFade{from{opacity:.3;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
/* Today view: clear schedule cards and quick actions */
#today .grid>.card.span3{background:linear-gradient(145deg,#fffefa,#f7f2f8);min-height:112px}
#today .grid>.card.span3:nth-child(2){background:linear-gradient(145deg,#fffefa,#f8f0ee)}
#today .grid>.card.span3:nth-child(3){background:linear-gradient(145deg,#fffefa,#f0f4ed)}
#today .grid>.card.span3:nth-child(4){background:linear-gradient(145deg,#fffefa,#f1f4f7)}
#today .card.span12>.list{gap:10px}
#today .row{align-items:center;gap:16px}
#today .row .main{flex:1}
#today .row .btn{flex:0 0 auto}
#today .today-title-line{gap:8px}
#today .today-homework-inline{margin-left:8px}
#today .homework-check{background:#f7f3f8;padding:6px 9px;border-radius:999px}
#today .card.span12{margin-top:2px}
/* Make registration modal feel like a focused workspace */
#modal .formgrid>div{background:#fcfafb;border:1px solid #f0eaf0;border-radius:13px;padding:12px}
#modal .formgrid>div.full{background:#fcfafb}
#modal .formgrid label{display:block;margin-bottom:7px}
#modal .formgrid input,#modal .formgrid select,#modal .formgrid textarea{background:#fff}
#modal #rLesson{min-height:150px;border-radius:12px}
#modal .member-attendance-row{margin-bottom:8px}
#modal .toolbar{justify-content:flex-end;padding-top:14px;border-top:1px solid #eee8e3}
#modal .toolbar .btn.primary{padding:12px 22px;font-size:13px}
@media(max-width:900px){
 .app{grid-template-columns:1fr}
 aside{position:relative;height:auto;padding:16px 18px}
 .brand{font-size:24px}
 .sub{margin-bottom:12px}
 nav{display:flex;flex-direction:row;overflow-x:auto;gap:5px;padding-bottom:3px}
 nav button{white-space:nowrap;width:auto;flex:0 0 auto;padding:10px 12px}
 main{padding:22px 16px 45px}
}
@media(max-width:600px){
 h1{font-size:29px}
 .topbar{align-items:flex-start;flex-direction:column}
 .toolbar{width:100%}
 .toolbar .btn{flex:1}
 .card{padding:16px;border-radius:16px}
 #today .row{align-items:flex-start;flex-direction:column}
 #today .row>.btn{width:100%}
 #today .today-title-line{align-items:flex-start;flex-direction:column}
 #today .today-homework-inline{margin-left:0}
 .modalback{padding:8px}
 .modal{padding:17px;border-radius:17px;max-height:95vh}
 .formgrid{grid-template-columns:1fr}
 .formgrid .full{grid-column:1}
 .member-statuses .status{flex:1 1 130px}
}
@media(prefers-reduced-motion:reduce){.section{animation:none}*{transition:none!important}}
</style>


<style id="ewd-inactive-students">
.admin-section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.admin-section-head h2{margin:0 0 4px}
.pill-count{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:30px;padding:0 10px;border-radius:99px;background:#f0eaf7;color:#6b5684;font-size:12px;font-weight:800}
.admin-student-list{display:grid;gap:9px}
.admin-student-row{display:flex;align-items:center;justify-content:space-between;gap:14px}
.admin-student-main{min-width:0;flex:1}
.admin-student-main b{font-size:13px;color:#453c50}
.admin-student-row .btn{white-space:nowrap}
@media(max-width:600px){.admin-student-row{align-items:flex-start}.admin-student-row .btn{padding:8px 10px}}
</style>

<style id="ewd-manual-makeups">
#today .card .toolbar h2{font-family:Georgia,serif}
#makeups .tablewrap{overflow-x:auto}
#makeups table{min-width:760px;width:100%}
#makeups .toolbar{gap:12px;flex-wrap:wrap}
</style>
<style id="ewd-cloud-recorder">
.cloud-chip{white-space:nowrap}
.cloud-chip.ok{background:#edf4ed;border-color:#cfe3cf;color:#4f6d4f}
.cloud-chip.busy{background:#f0eaf7;border-color:#d9cbe8;color:#634d7e}
.cloud-chip.err{background:#fff3f2;border-color:#f0cfcf;color:#a2525b}

.rec-live{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:12px 0}

a.btn{text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.meet-btn{background:#e9f4ee!important;border-color:#cfe6d8!important;color:#3f7356!important}

.note-card summary{cursor:pointer;font-size:12px;color:#796294;font-weight:700}
.note-card .transcript{white-space:pre-wrap;font-size:12px;color:#5d5368;max-height:320px;overflow:auto;background:#faf7fb;border-radius:10px;padding:10px;margin-top:6px}
.today-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.stack{display:flex;flex-direction:column;gap:12px}

.subtabs{display:flex;gap:8px;flex-wrap:wrap;padding:6px;background:#f3eef6;border-radius:999px;width:max-content;max-width:100%}

.kanban{display:grid;grid-template-columns:repeat(5,minmax(210px,1fr));gap:14px;overflow-x:auto;padding-bottom:6px}

.kcard:hover{transform:translateY(-2px);box-shadow:0 8px 20px #3a2b481c}
.ktitle{font-weight:750;font-size:14px;color:#3b3347;margin-bottom:8px;line-height:1.3}
.kmeta{display:flex;gap:7px;align-items:center;flex-wrap:wrap;font-size:12px;color:#7c7388}
.kproj{margin-top:8px;font-size:11px;color:#6b5684;background:#f3eef8;border-radius:8px;padding:4px 7px;display:inline-block}
.kadd{display:block;width:100%;border:0;background:transparent;color:#8d83a0;font-size:14px;padding:10px;cursor:pointer;border-radius:12px}
.kadd:hover{background:#ffffff80}
.fmt{display:inline-flex;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;background:#eee7f5;color:#6b5684}
.fmt-Story{background:#e8eee6;color:#58705a}.fmt-Carrossel{background:#e8f0f3;color:#557483}.fmt-Foto{background:#f4efe6;color:#7f6a45}
.fmt-Live{background:#f8e7e8;color:#9a4e57}.fmt-TikTok{background:#ececef;color:#4d4d58}.fmt-YouTube{background:#fbeadf;color:#9a5a31}
.cal-wrap{display:flex;gap:14px;align-items:flex-start}
.cal-side{width:270px;flex:0 0 270px;display:flex;flex-direction:column;gap:14px}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cwd{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#8d83a0;font-weight:700;text-align:center;padding:4px 0}
.cday{min-height:104px;background:#fcfafb;border:1px solid #f0eaf0;border-radius:12px;padding:6px;cursor:pointer;overflow:hidden}
.cday:hover{border-color:#d8cbe3}
.cday.empty{background:transparent;border:0;cursor:default}
.cday.today{border-color:#9d85b7;box-shadow:inset 0 0 0 1px #cbbbdc}
.cday.over{outline:2px dashed #a58cbd}
.dnum{display:block;font-size:12px;font-weight:700;color:#7c7388;margin-bottom:4px}
.cchip{font-size:11px;line-height:1.3;padding:4px 7px;border-radius:8px;margin-bottom:4px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid #b9a5cf;background:#f1edf7;color:#4a3f58}
.cchip.st-Roteiro{background:#f6eef0;border-color:#d7a7b2}.cchip.st-Gravado{background:#f6f2ea;border-color:#d6bf8f}
.cchip.st-Editado{background:#edf2f6;border-color:#93b2c6}.cchip.st-Postado{background:#edf3ee;border-color:#8fba98}
.cal-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:11px;color:#7c7388}
.cal-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:#b9a5cf}
.cal-legend i.st-Roteiro{background:#d7a7b2}.cal-legend i.st-Gravado{background:#d6bf8f}.cal-legend i.st-Editado{background:#93b2c6}.cal-legend i.st-Postado{background:#8fba98}
.bal{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #f0ebe7;font-size:13px}
.metrics-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.proj-card{cursor:pointer}
.tag{display:inline-flex;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:700;background:#eee7f5;color:#634d7e}
.tag.soft{background:#f4f1ec;color:#7a6d5d}
.ring{--p:0;width:54px;height:54px;border-radius:50%;flex:0 0 54px;background:conic-gradient(#8068a8 calc(var(--p)*1%),#eee7f5 0);display:flex;align-items:center;justify-content:center}
.ring span{width:42px;height:42px;border-radius:50%;background:#fffefa;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#5f4b79}
.proj-foot{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;padding-top:10px;border-top:1px solid #f0ebe7;font-size:12px;color:#7c7388}
.modalhead>div:first-child{flex:1;min-width:0}
.title-input{width:100%;font-family:Georgia,serif;font-size:24px;border:0!important;background:transparent!important;padding:2px 0!important;box-shadow:none!important;color:#3b3347}
.step{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed #eee8e3}
.guest{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:10px;padding:8px;background:#faf7fb;border-radius:12px}
.guest>button{justify-self:end;align-self:center}
.guest input,.guest select{padding:8px 10px;font-size:13px}

.site-url{font-family:Georgia,serif;font-size:20px;color:#5f4b79;word-break:break-all}
.site-layout{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:18px;align-items:start}
.site-editor{display:flex;flex-direction:column;gap:14px}

const DAYMAP = ["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"];
const STORAGE_KEY = "ewd_diario_v1";

function deepClone(x){return JSON.parse(JSON.stringify(x))}
function groupMembers(s){
  if(Array.isArray(s.members) && s.members.length) return s.members;
  return String(s.name||"").split("+").map(x=>x.trim()).filter(Boolean);
}
function ensureGroupData(data){
  data.students = Array.isArray(data.students) ? data.students : [];
  data.students.forEach(s=>{
    const members = groupMembers(s);
    s.members = members.length ? members : [s.name];
  });
  data.records = Array.isArray(data.records) ? data.records : [];
  data.records.forEach(r=>{
    if(!Array.isArray(r.attendance)){
      const members = String(r.student||"").split("+").map(x=>x.trim()).filter(Boolean);
      const names = members.length ? members : [r.student];
      r.attendance = names.map(name=>({name,status:r.status}));
      // Preserve the explicit existing note that Geovanna missed this class.
      if((r.note||"").toLowerCase().includes("geovanna") && (r.note||"").toLowerCase().includes("faltou")){
        const g=r.attendance.find(a=>a.name.toLowerCase().includes("geovanna"));
        if(g) g.status="❌ Falta";
      }
    }
  });
  data.customLessons = Array.isArray(data.customLessons) ? data.customLessons : [];
  data.warmupUsage = Array.isArray(data.warmupUsage) ? data.warmupUsage : [];
  return data;
}
const CURRICULUM_VERSION = "2026-11-02-v1";
function applyCurriculum(data){
  if(data.curriculumVersion !== CURRICULUM_VERSION){
    const fresh = INITIAL.lessons.filter(l=>["A1","A2","B1"].includes(l.level));
    data.lessons = [...(data.lessons||[]).filter(l=>!["A1","A2","B1"].includes(l.level)), ...fresh];
    data.curriculumVersion = CURRICULUM_VERSION;
  }
  // Atualização pontual do nível da dupla; a versão impede sobrescrever futuras edições manuais.
  if(data.studentLevelVersion !== "2026-11-06-pedro-isabella-a2"){
    const dupla = (data.students||[]).find(s=>s.name === "Pedro Henrique + Isabella Rissi" && s.day === "Sexta" && s.time === "14:00–15:00");
    if(dupla) dupla.level = "A2";
    data.studentLevelVersion = "2026-11-06-pedro-isabella-a2";
  }
  return data;
}
function load(){
  const saved = localStorage.getItem(STORAGE_KEY);
  if(saved){
    try{
      const data = applyCurriculum(ensureGroupData(JSON.parse(saved)));
      save(data,{touch:false});
      return data;
    }catch(e){}
  }
  const data = applyCurriculum(ensureGroupData(deepClone(INITIAL)));
  data.updatedAt = 0; data._fromInitial = true; // base inicial: o Notion sempre tem prioridade sobre ela
  save(data,{touch:false}); return data;
}
let DB = load();
if(!DB.weeklyPlanning) DB.weeklyPlanning = {};
if(!DB.meetingNotes) DB.meetingNotes = [];
if(!DB.ideas) DB.ideas = [];
function save(data=DB,opts={}){
  ensureGroupData(data);
  const touch = opts.touch!==false;
  if(touch){ data.updatedAt = Date.now(); delete data._fromInitial; }
  try{ localStorage.setItem(STORAGE_KEY,JSON.stringify(data)); }
  catch(e){
    // Navegador sem espaço: encurta transcrições antigas que já estão salvas no Notion.
    (data.meetingNotes||[]).forEach(n=>{ if(n.notionUrl && (n.transcript||"").length>1500) n.transcript=n.transcript.slice(0,1500)+"\n… (transcrição completa no Notion)"; });
    try{ localStorage.setItem(STORAGE_KEY,JSON.stringify(data)); }catch(e2){ console.warn("localStorage cheio",e2); }
  }
  if(touch && typeof Cloud!=="undefined") Cloud.schedulePush();
}
function esc(s=""){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}

function studentKey(s){return `${s.name}|${s.day}|${s.time}`}
function canonicalName(name){return name}
function studentHistory(name){
  return (DB.records||[]).filter(r=>{
    if(r.student===name) return true;
    return Array.isArray(r.attendance) && r.attendance.some(a=>a.name===name);
  }).sort((a,b)=>b.date.localeCompare(a.date));
}
function individualHistory(name){
  return (DB.records||[]).filter(r=>{
    if(r.student===name && !Array.isArray(r.attendance)) return true;
    return Array.isArray(r.attendance) && r.attendance.some(a=>a.name===name);
  }).sort((a,b)=>b.date.localeCompare(a.date));
}
function memberStatus(record,name){
  const a=Array.isArray(record.attendance)?record.attendance.find(x=>x.name===name):null;
  return a?.status || record.status || "";
}
function warmHistory(name){return (DB.warmupUsage||[]).filter(r=>r.student===name).sort((a,b)=>b.date.localeCompare(a.date))}

function homeworkKey(name){
  return `${todayISO()}|${name}`;
}
function isHomeworkSent(name){
  return !!(DB.homeworkSent && DB.homeworkSent[homeworkKey(name)]);
}
function toggleHomeworkSent(name, checked){
  if(!DB.homeworkSent) DB.homeworkSent={};
  const key=homeworkKey(name);
  if(checked) DB.homeworkSent[key]=true;
  else delete DB.homeworkSent[key];
  save();
  renderToday();
}
function homeworkCheck(name){
  const checked=isHomeworkSent(name);
  return `<label class="homework-check" title="Marque somente depois de enviar o homework no aplicativo">
    <input type="checkbox" ${checked?"checked":""} onchange='toggleHomeworkSent(${JSON.stringify(name)},this.checked)'>
    <span>Homework</span>
  </label>`;
}

function renderToday(){
  const day=currentDay();
  const sched=DB.students.filter(s=>s.day===day);
  // Continuidade mostra somente alunos do dia selecionado que ainda não concluíram a última aula.
  const partials=DB.students.filter(s=>{
    if(s.day!==day) return false;
    const h=studentHistory(s.name)[0];
    const progress=h ? Number(h.progress) : Number(s.progress||0);
    return progress>0 && progress<100;
  });
  const pending=(DB.records||[]).filter(r=>r.status==="🔄 Rep. Pendente");
  // Recupera o Planning Class preenchido para cada aluno/turma no dia de hoje.
  const planningWeek=getMondayISO();
  const todaysPlannings=sched.map(s=>{
    const p=DB.weeklyPlanning?.[planningKey(planningWeek,s)]||{};
    return {...s, plannedLesson:(p.lesson||"").trim(), plannedNotes:(p.notes||"").trim()};
  }).filter(s=>s.plannedLesson||s.plannedNotes);
  const rows=sched.map(s=>{
    const hist=studentHistory(s.name);
    const last=hist[0];
    const shown = last ? `${last.lesson||"Aula sem título"} · ${last.progress||0}%` : (s.last ? `${s.last} · ${s.progress||0}%` : "Sem registro");
    const members=groupMembers(s);
    const hw = members.length>1
      ? `<div class="homework-group">${members.map(n=>`${homeworkCheck(n)}`).join("")}</div>`
      : homeworkCheck(members[0]||s.name);
    return `<div class="row">
      <div class="main">
        <div class="title today-title-line">
          <span>${esc(s.time)} · ${esc(s.name)} ${badge(s.level)}</span>
          <span class="today-homework-inline">${hw}</span>
        </div>
        <div class="meta">Último: <b>${esc(shown)}</b></div>
      </div>
      <div class="today-actions">
        ${s.meet?`<a class="btn small meet-btn" href="${esc(s.meet)}" target="_blank" rel="noopener">🎥 Abrir Meet</a>`:`<button class="btn small" onclick='openEditStudent(${DB.students.indexOf(s)})' title="Adicionar link do Meet">＋ Link Meet</button>`}
        <button class="btn small" onclick='startClassRecording(${JSON.stringify(studentKey(s))})'>🎙️ Gravar & transcrever</button>
        <button class="btn primary small" onclick='openRegister(${JSON.stringify(studentKey(s))})'>Registrar aula</button>
      </div>
    </div>`
  }).join("") || `<div class="muted">Nenhuma aula cadastrada para ${day}.</div>`;

  today.innerHTML=`
  <div class="grid">
    <div class="card span3"><div class="muted small">Aulas hoje</div><div class="kpi">${sched.length}</div></div>
    <div class="card span3"><div class="muted small">Reposições pendentes</div><div class="kpi">${pending.length}</div></div>
    <div class="card span3"><div class="muted small">Aulas parciais</div><div class="kpi">${partials.length}</div></div>
    <div class="card span3"><div class="muted small">Registros totais</div><div class="kpi">${(DB.records||[]).length}</div></div>
    <div class="card span12"><h2>Agenda de ${day}</h2>
      <div class="notice blue small" style="margin-bottom:12px">☑️ Marque <b>Homework</b> somente depois que você enviar a tarefa no aplicativo. O check fica salvo no diário para a data de hoje.</div>
      <div class="list">${rows}</div>
    </div>
    <div class="card span12">
      <div class="toolbar" style="justify-content:space-between;align-items:center">
        <div><h2 style="margin:0">Planning Lessons · ${day}</h2>
        <div class="muted small">Aulas planejadas na aba Planning Class para os alunos de hoje.</div></div>
        <button class="btn small" onclick="go('planning')">Editar Planning Class</button>
      </div>
      ${todaysPlannings.length?todaysPlannings.map(s=>`
        <div class="row" style="margin-top:9px;align-items:flex-start">
          <div class="main">
            <div class="title"><b>${esc(s.time)} · ${esc(s.name)}</b> ${badge(s.level)}</div>
            ${s.plannedLesson?`<div style="margin-top:5px"><b>Aula planejada:</b> ${esc(s.plannedLesson)}</div>`:""}
            ${s.plannedNotes?`<div class="meta" style="margin-top:4px"><b>Observações:</b> ${esc(s.plannedNotes)}</div>`:""}
          </div>
        </div>`).join(""):`<div class="muted" style="margin-top:12px">Nenhuma Planning Lesson preenchida para os alunos de hoje. Adicione as aulas na aba Planning Class para que apareçam aqui.</div>`}
    </div>
    <div class="card span12"><h2>Continuidade · ${day}</h2>
      <div class="muted small" style="margin:-8px 0 12px">Alunos deste dia que precisam continuar uma aula iniciada anteriormente.</div>
      ${partials.length?partials.map(s=>{
        const h=studentHistory(s.name)[0];
        const lesson=h?.lesson || s.last || "Aula em andamento";
        const progress=Number(h?.progress ?? s.progress ?? 0);
        return `<div class="notice" style="margin-bottom:8px"><b>${esc(s.name)}</b><br>${esc(lesson)} · ${progress}% concluído</div>`;
      }).join(""):`<div class="muted">Nenhuma aula parcial para ${day}.</div>`}
    </div>
    <div class="card span12"><div class="toolbar" style="justify-content:space-between"><div><h2 style="margin:0">Reposições de ${day}</h2><div class="muted small">Reposições agendadas manualmente para hoje.</div></div><button class="btn primary" onclick="openAddMakeup()">+ Adicionar reposição</button></div>
      ${(DB.records||[]).filter(r=>r.manualMakeup && (r.makeupDate||r.date)===todayISO()).map(r=>`<div class="row" style="margin-top:9px"><div class="main"><div class="title"><b>${esc(r.student)}</b> · ${esc(r.lesson||"Aula não informada")}</div><div class="meta">${esc(r.note||"Reposição agendada")} · ${esc(r.status)}</div></div>${r.status==="🔄 Rep. Pendente"?`<button class="btn small" onclick="completeMakeup(${r.id})">Marcar feita</button>`:""}</div>`).join("") || `<div class="muted" style="margin-top:12px">Nenhuma reposição agendada para hoje.</div>`}
    </div>
  </div>`;
}

function getMondayISO(d=new Date()){
  const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  const day=x.getDay();
  x.setDate(x.getDate()+(day===0?-6:1-day));
  return x.toISOString().slice(0,10);
}
function addDaysISO(iso,days){
  const d=new Date(iso+"T12:00:00");
  d.setDate(d.getDate()+days);
  return d.toISOString().slice(0,10);
}
function planningKey(week,s){
  return `${week}|${s.name}|${s.day}|${s.time}`;
}
function savePlanningValue(key,field,value){
  if(!DB.weeklyPlanning) DB.weeklyPlanning={};
  if(!DB.weeklyPlanning[key]) DB.weeklyPlanning[key]={lesson:"",notes:""};
  DB.weeklyPlanning[key][field]=value;
  save();
}
function carryPlanningForward(){
  const week=document.getElementById("planningWeek")?.value || getMondayISO();
  const prev=addDaysISO(week,-7);
  DB.students.forEach(s=>{
    const oldKey=planningKey(prev,s), newKey=planningKey(week,s);
    if(DB.weeklyPlanning?.[oldKey] && !DB.weeklyPlanning?.[newKey]){
      DB.weeklyPlanning[newKey]=JSON.parse(JSON.stringify(DB.weeklyPlanning[oldKey]));
    }
  });
  save(); renderPlanning();
}
function clearPlanningWeek(){
  const week=document.getElementById("planningWeek")?.value || getMondayISO();
  if(!confirm("Limpar todas as sugestões desta semana?")) return;
  Object.keys(DB.weeklyPlanning||{}).forEach(k=>{if(k.startsWith(week+"|")) delete DB.weeklyPlanning[k]});
  save(); renderPlanning();
}
function renderPlanning(){
  if(typeof planning==="undefined") return;
  const week=document.getElementById("planningWeek")?.value || getMondayISO();
  const order=["Segunda","Terça","Quarta","Quinta","Sexta","Sábado","Domingo"];
  const list=[...DB.students].sort((a,b)=>{
    const da=order.indexOf(a.day), db=order.indexOf(b.day);
    return da!==db ? da-db : (a.time||"").localeCompare(b.time||"");
  });

  const daySections=order.map(day=>{
    const dayStudents=list.filter(s=>s.day===day);
    if(!dayStudents.length) return "";

    const rows=dayStudents.map(s=>{
      const key=planningKey(week,s);
      const p=DB.weeklyPlanning?.[key]||{lesson:"",notes:""};
      const hist=studentHistory(s.name), last=hist[0];
      const lastLesson=last?.lesson || s.last || "Sem registro";
      const lastProgress=last?.progress ?? s.progress ?? 0;

      return `<tr>
        <td class="time-cell"><b>${esc(s.time)}</b></td>
        <td><b>${esc(s.name)}</b><br>${badge(s.level)} <span class="muted small">${esc(s.group||"")}</span></td>
        <td>${esc(lastLesson)}${lastProgress?` <span class="muted">· ${lastProgress}%</span>`:""}</td>
        <td style="min-width:320px"><input value="${esc(p.lesson||"")}" placeholder="Ex.: 3A — Talk about routines / aula personalizada" oninput='savePlanningValue(${JSON.stringify(key)},"lesson",this.value)'></td>
        <td style="min-width:240px"><input value="${esc(p.notes||"")}" placeholder="Warm-up, material, observação..." oninput='savePlanningValue(${JSON.stringify(key)},"notes",this.value)'></td>
      </tr>`;
    }).join("");

    return `
      <div class="planning-day card">
        <div class="planning-day-title">
          <div>
            <h3>📅 ${esc(day)}</h3>
            <span class="muted small">${dayStudents.length} aluno(s)/turma(s)</span>
          </div>
        </div>
        <div class="tablewrap">
          <table class="table">
            <thead>
              <tr>
                <th>Horário</th>
                <th>Aluno(s)</th>
                <th>Última aula</th>
                <th>Planning Class — aula pensada</th>
                <th>Observações</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      </div>`;
  }).join("");

  planning.innerHTML=`
    <div class="card" style="margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-end;flex-wrap:wrap">
        <div>
          <h2>Sugestão de Aulas da Semana</h2>
          <div class="muted">Seu Planning Class semanal, separado por dia. As anotações são salvas automaticamente neste computador.</div>
        </div>
        <div class="toolbar">
          <div><label>Semana iniciando em</label><input id="planningWeek" type="date" value="${week}" onchange="renderPlanning()" style="min-width:170px"></div>
          <button class="btn" onclick="carryPlanningForward()">↪️ Copiar semana anterior</button>
          <button class="btn danger" onclick="clearPlanningWeek()">Limpar semana</button>
        </div>
      </div>
    </div>
    ${daySections}`;
}


let assessmentDraft={student:"",level:"A1",assessmentTitle:"Avaliação de Nível",date:new Date().toISOString().slice(0,10),aScore:"",aMax:"50",aFeedback:"",bScore:"",bMax:"20",bFeedback:"",cScore:"",cMax:"20",cFeedback:"",attention:"",direction:"",general:"",practiceTitle:"",practiceBefore:"",practiceQuestions:"",homeworkAttention:"",homeworkInstructions:""};

function calcAssessmentTotal(){let x=[["aScore","aMax"],["bScore","bMax"],["cScore","cMax"]].map(([s,m])=>({s:parseFloat(assessmentDraft[s]),m:parseFloat(assessmentDraft[m])})).filter(x=>!isNaN(x.s)&&!isNaN(x.m)&&x.m>0);return{x:x,total:x.reduce((a,y)=>a+y.s,0),max:x.reduce((a,y)=>a+y.m,0)}}
function setAssessmentField(f,v){assessmentDraft[f]=v;let t=calcAssessmentTotal(),e=document.getElementById("assessmentTotalPreview");if(e)e.textContent=t.max?`${t.total}/${t.max} pontos`:""}

 const d=assessmentDraft,t=calcAssessmentTotal(),attention=d.attention?d.attention.split("\n").filter(Boolean).map(x=>`<li>${esc(x)}</li>`).join(""):"",questions=d.practiceQuestions?d.practiceQuestions.split("\n").filter(Boolean).map((x,i)=>`<p><b>${i+1}</b> ${esc(x)}</p>`).join(""):"";
 return`<!doctype html><html><head><meta charset="utf-8"><title>${esc(d.assessmentTitle)} — ${esc(d.student)}</title><style>@page{size:A4;margin:18mm 17mm}body{font-family:Arial,sans-serif;color:#283548;line-height:1.45;font-size:11.5pt}.doc{max-width:780px;margin:auto}.brand{text-align:center;color:#8e76c6;font-weight:800;letter-spacing:.8px;margin-bottom:15px}h1{text-align:center;color:#273449;font-size:22pt;margin:0}.sub{text-align:center;color:#697386;margin-bottom:22px}h2{font-size:14pt;color:#8e76c6;border-bottom:1px solid #bcaee0;padding:7px 0 5px;margin:22px 0 9px}.result{background:#f2edfb;border-left:5px solid #8e76c6;padding:13px 16px;margin:18px 0}.attention{background:#fff9f0;border-left:5px solid #e2872f;padding:12px 16px;margin:16px 0}.practice{background:#f5f0fb;border:1px solid #cfc2e9;padding:14px 16px}.footer{text-align:center;color:#8e76c6;font-weight:700;margin-top:28px}</style>

/* ================= Meeting Notes + gravação/transcrição de aulas do Google Meet ================= */
const SEG_MS = 90*1000; // cada trecho de áudio enviado para transcrição (~90 s, bem abaixo do limite da Vercel)
var REC = {key:"",title:"",week:"",date:"",transcript:"",summary:"",teacher:"",recording:false,startedAt:0,elapsed:0,
  segments:0,queue:[],failed:[],busy:false,status:"",mime:"",ctx:null,dest:null,recorder:null,streams:[],segTimer:null,tick:null,durationMin:0,summarizing:false,saving:false};

function normalizeMeet(v){
  v=String(v||"").trim();
  if(!v) return "";
  if(/^[a-z]{3}-[a-z]{4}-[a-z]{3}$/i.test(v)) return "https://meet.google.com/"+v.toLowerCase();
  if(!/^https?:\/\//i.test(v)) v="https://"+v;
  try{ const u=new URL(v); return u.protocol.startsWith("http")?u.href:null; }catch(e){ return null; }
}
function recStudent(){ return DB.students.find(s=>studentKey(s)===REC.key) || null; }
function mmss(sec){ sec=Math.max(0,Math.round(sec)); const h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=sec%60; return (h?h+":":"")+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0"); }
function recElapsed(){ return REC.recording ? REC.elapsed + (Date.now()-REC.startedAt)/1000 : REC.elapsed; }
function recSet(field,value){ REC[field]=value; }
function recDefaults(){
  if(!REC.week) REC.week=getMondayISO();
  if(!REC.date) REC.date=todayISO();
}
function startClassRecording(key){
  if(REC.recording && REC.key!==key){ alert("Já existe uma gravação em andamento. Encerre-a antes de iniciar outra."); go("meeting"); return; }
  if(!REC.recording && REC.key!==key && (REC.transcript||REC.summary||REC.teacher)){
    if(!confirm("Há um rascunho de transcrição não salvo. Descartar e começar outra aula?")){ go("meeting"); return; }
    recReset();
  }
  REC.key=key;
  const s=recStudent();
  if(s && !REC.title){
    const plan=DB.weeklyPlanning?.[planningKey(getMondayISO(),s)]?.lesson;
    REC.title=(plan||"").trim() || `Aula — ${s.name}`;
  }
  go("meeting");
  setTimeout(()=>document.getElementById("recPanel")?.scrollIntoView({behavior:"smooth",block:"start"}),60);
}
function recReset(){
  Object.assign(REC,{title:"",week:"",date:"",transcript:"",summary:"",teacher:"",elapsed:0,segments:0,queue:[],failed:[],status:"",durationMin:0});
}

async function recStart(){
  if(REC.recording) return;
  if(!Cloud.enabled()){ alert("Conecte o painel ao Notion primeiro (botão ☁️ no topo). A transcrição usa as funções seguras da Vercel."); openCloudSettings(); return; }
  if(!navigator.mediaDevices?.getDisplayMedia || typeof MediaRecorder==="undefined"){
    alert("A gravação funciona no Google Chrome (ou Edge) no computador. Abra o painel por lá."); return;
  }
  let display;
  try{
    display = await navigator.mediaDevices.getDisplayMedia({
      video:true,
      audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false},
      systemAudio:"include", selfBrowserSurface:"exclude", surfaceSwitching:"include", preferCurrentTab:false
    });
  }catch(e){ REC.status="Compartilhamento cancelado."; recUpdateLive(); return; }
  const tabAudio = display.getAudioTracks();
  if(!tabAudio.length){
    if(!confirm("Nenhum áudio da guia foi compartilhado — a voz dos alunos não será captada.\n\nPara corrigir: clique em Cancelar, inicie de novo, escolha a guia do Google Meet e deixe marcado “Compartilhar áudio da guia”.\n\nContinuar só com o seu microfone?")){
      display.getTracks().forEach(t=>t.stop()); return;
    }
  }
  let mic=null;
  try{ mic = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}}); }
  catch(e){ if(!tabAudio.length){ display.getTracks().forEach(t=>t.stop()); alert("Sem microfone e sem áudio da guia — não há o que gravar."); return; } }

  const ctx = new (window.AudioContext||window.webkitAudioContext)();
  const dest = ctx.createMediaStreamDestination();
  if(tabAudio.length) ctx.createMediaStreamSource(new MediaStream(tabAudio)).connect(dest);
  if(mic) ctx.createMediaStreamSource(mic).connect(dest);
  REC.ctx=ctx; REC.dest=dest; REC.streams=[display,mic].filter(Boolean);
  display.getVideoTracks().forEach(t=>t.addEventListener("ended",()=>{ if(REC.recording) recStop(); }));
  tabAudio.forEach(t=>t.addEventListener("ended",()=>{ if(REC.recording) recStop(); }));

  REC.mime = ["audio/webm;codecs=opus","audio/webm","audio/mp4","audio/ogg;codecs=opus"].find(m=>MediaRecorder.isTypeSupported(m)) || "";
  recDefaults();
  REC.recording=true; REC.startedAt=Date.now(); REC.status=tabAudio.length?"Gravando a guia do Meet + seu microfone.":"Gravando só o seu microfone.";
  recStartSegment();
  REC.segTimer=setInterval(()=>{ if(REC.recorder && REC.recorder.state==="recording") REC.recorder.stop(); }, SEG_MS);
  REC.tick=setInterval(recUpdateLive,1000);
  window.onbeforeunload=()=> "A aula ainda está sendo gravada.";
  renderMeetingNotes();
}
function recStartSegment(){
  const opts = REC.mime ? {mimeType:REC.mime,audioBitsPerSecond:32000} : {audioBitsPerSecond:32000};
  const r = new MediaRecorder(REC.dest.stream, opts);
  const chunks=[]; const offset=recElapsed();
  r.ondataavailable=e=>{ if(e.data && e.data.size) chunks.push(e.data); };
  r.onstop=()=>{
    if(chunks.length) recEnqueue({blob:new Blob(chunks,{type:r.mimeType||REC.mime||"audio/webm"}),offset});
    if(REC.recording) recStartSegment();
  };
  r.start();
  REC.recorder=r;
}
function recStop(){
  if(!REC.recording) return;
  REC.elapsed=recElapsed(); REC.recording=false;
  REC.durationMin=Math.max(1,Math.round(REC.elapsed/60));
  clearInterval(REC.segTimer); clearInterval(REC.tick);
  try{ if(REC.recorder && REC.recorder.state!=="inactive") REC.recorder.stop(); }catch(e){}
  REC.streams.forEach(s=>s.getTracks().forEach(t=>t.stop()));
  setTimeout(()=>{ try{REC.ctx && REC.ctx.close()}catch(e){} },1500);
  window.onbeforeunload=null;
  REC.status="Gravação encerrada. Aguarde a transcrição dos últimos trechos.";
  renderMeetingNotes();
}
function recEnqueue(item){ REC.queue.push(item); recPump(); }
async function recPump(){
  if(REC.busy) return;
  REC.busy=true; recUpdateLive();
  while(REC.queue.length){
    const item=REC.queue.shift();
    try{
      const text=await Cloud.transcribe(item.blob);
      REC.segments++;
      if(text) recAppend(`[${mmss(item.offset)}] ${text}`);
      if(!REC.recording) REC.status="Transcrição pronta. Revise, gere o resumo e salve no Notion.";
    }catch(e){
      REC.failed.push(item);
      REC.status="Falha ao transcrever um trecho: "+e.message;
    }
    recUpdateLive();
  }
  REC.busy=false; recUpdateLive();
}
function recRetry(){ REC.queue.push(...REC.failed.splice(0)); REC.queue.sort((a,b)=>a.offset-b.offset); recPump(); }
function recAppend(line){
  REC.transcript = (REC.transcript ? REC.transcript.replace(/\s+$/,"")+"\n" : "") + line;
  const ta=document.getElementById("recTranscript");
  if(ta){ const atEnd = ta.scrollTop+ta.clientHeight >= ta.scrollHeight-30; ta.value=REC.transcript; if(atEnd) ta.scrollTop=ta.scrollHeight; }
}
function recUpdateLive(){
  const t=document.getElementById("recTimer"); if(t) t.textContent=mmss(recElapsed());
  const d=document.getElementById("recDot"); if(d) d.classList.toggle("on",REC.recording);
  const st=document.getElementById("recStatus");
  if(st){
    const pend=REC.queue.length+(REC.busy?1:0);
    st.innerHTML=`${esc(REC.status||"Pronto para gravar.")}<br><span class="muted small">${REC.segments} trecho(s) transcrito(s)${pend?` · ${pend} na fila`:""}${REC.failed.length?` · <b>${REC.failed.length} com erro</b> <button class="btn small" onclick="recRetry()">Tentar de novo</button>`:""}</span>`;
  }
}
async function recSummarize(){
  const transcript=(document.getElementById("recTranscript")?.value||REC.transcript||"").trim();
  if(transcript.length<40){ alert("A transcrição ainda está curta demais para resumir."); return; }
  if(!Cloud.enabled()){ openCloudSettings(); return; }
  const s=recStudent();
  REC.summarizing=true; renderMeetingNotes();
  try{
    const r=await Cloud.call("summarize",{transcript,student:s?.name||"",level:s?.level||"",lesson:REC.title});
    REC.summary=r.summary||"";
  }catch(e){ alert("Não foi possível gerar o resumo: "+e.message); }
  REC.summarizing=false; renderMeetingNotes();
}
function recSave(){
  if(REC.recording){ alert("Encerre a gravação antes de salvar."); return; }
  const pend=REC.queue.length+(REC.busy?1:0);
  if(pend && !confirm(`Ainda há ${pend} trecho(s) sendo transcrito(s). Salvar mesmo assim (sem eles)?`)) return;
  if(REC.failed.length && !confirm(`${REC.failed.length} trecho(s) falharam na transcrição e ficarão de fora. Salvar mesmo assim?`)) return;
  const transcript=(REC.transcript||"").trim(), summary=(REC.summary||"").trim(), teacher=(REC.teacher||"").trim();
  if(!transcript && !summary && !teacher){ alert("Grave a aula ou cole uma transcrição/anotação antes de salvar."); return; }
  recDefaults();
  const s=recStudent();
  const note={
    id:Date.now(), week:REC.week, date:REC.date, createdAt:todayISO(),
    student:s?.name||"", studentKey:s?studentKey(s):"",
    title:(REC.title||"").trim() || (s?`Aula — ${s.name}`:"Meeting"),
    transcript, summary, teacherNotes:teacher,
    durationMin:REC.durationMin||null, meetLink:s?.meet||"",
    source:REC.segments>0?"recorded":"manual"
  };
  DB.meetingNotes=DB.meetingNotes||[];
  DB.meetingNotes.push(note);
  save();
  Cloud.enqueue("saveMeeting",{meeting:note});
  recReset(); REC.key=s?studentKey(s):"";
  renderMeetingNotes();
  if(!Cloud.enabled()) alert("Meeting Note salva neste navegador. Conecte o Notion (☁️ no topo) para enviá-la ao Notion.");
}
function recDiscard(){
  if(REC.recording){ alert("Encerre a gravação primeiro."); return; }
  if((REC.transcript||REC.summary||REC.teacher) && !confirm("Descartar este rascunho?")) return;
  recReset(); renderMeetingNotes();
}

function renderMeetingNotes(){
  if(!document.getElementById("meeting")) return;
  recDefaults();
  const notes=[...(DB.meetingNotes||[])].sort((a,b)=>(b.date||b.week||"").localeCompare(a.date||a.week||"") || (b.id-a.id));
  const s=recStudent();
  const options=DB.students.map(x=>`<option value="${esc(studentKey(x))}" ${studentKey(x)===REC.key?"selected":""}>${esc(x.day)} ${esc(x.time)} · ${esc(x.name)}</option>`).join("");
  const pend=REC.queue.length+(REC.busy?1:0);
  meeting.innerHTML=`
  <div class="stack">

/* ================= Sincronização com o Notion (via funções seguras da Vercel) ================= */
var Cloud = {
  pw: localStorage.getItem("ewd_cloud_pw")||"",
  state:"off", msg:"", lastPing:null,
  queue: (()=>{ try{return JSON.parse(localStorage.getItem("ewd_cloud_queue")||"[]")}catch(e){return []} })(),
  dropped: [],
  pushTimer:null, pushing:false, pushAgain:false, processing:false,
  enabled(){ return !!this.pw; },
  async call(path, body){
    let r;
    try{
      r = await fetch("/api/"+path,{method:"POST",headers:{"Content-Type":"application/json","x-ewd-password":this.pw},body:JSON.stringify(body)});
    }catch(e){ throw new Error("Sem conexão com a internet."); }
    let data=null; try{ data=await r.json(); }catch(e){}
    if(!data){
      if(r.status===404) throw new Error("Funções da Vercel não encontradas. Publique a pasta “api” junto com o index.html.");
      if(r.status===413) throw new Error("Arquivo grande demais para a Vercel.");
      throw new Error("Resposta inválida do servidor ("+r.status+").");
    }
    if(!r.ok) throw new Error(data.error||("Erro "+r.status));
    return data;
  },
  notion(action,payload={}){ return this.call("notion",{action,...payload}); },
  async transcribe(blob){
    const b64 = await new Promise((ok,fail)=>{ const fr=new FileReader(); fr.onload=()=>ok(String(fr.result).split(",")[1]||""); fr.onerror=fail; fr.readAsDataURL(blob); });
    const r = await this.call("transcribe",{audio:b64,mimeType:blob.type});
    return r.text||"";
  },
  setState(state,msg){
    this.state=state; this.msg=msg||"";
    const c=document.getElementById("cloudChip"); if(!c) return;
    c.classList.remove("ok","busy","err");
    if(state!=="off") c.classList.add(state);
    const label = state==="ok"?"☁️ Notion ✓":state==="busy"?"☁️ Salvando…":state==="err"?"⚠️ Notion: erro":"☁️ Notion: configurar";
    c.textContent=label; c.title=this.msg;
  },
  snapshot(){
    const d=deepClone(DB);
    (d.meetingNotes||[]).forEach(n=>{ if(n.notionUrl && n.transcript){ n.transcript=""; n.transcriptInNotion=true; } });
    if(DB.site) d.sitePublic=sitePublicData(); // versão pronta (links do WhatsApp/Instagram montados) para a página pública
    return d;
  },
  schedulePush(){
    if(!this.enabled()) return;
    clearTimeout(this.pushTimer);
    this.setState("busy","Alterações pendentes…");
    this.pushTimer=setTimeout(()=>this.push(),2500);
  },
  async push(){
    if(!this.enabled()) return;
    if(this.pushing){ this.pushAgain=true; return; }
    this.pushing=true; this.setState("busy","Salvando no Notion…");
    try{
      await this.notion("save",{data:this.snapshot()});
      this.setState(this.queue.length?"busy":"ok","Salvo no Notion às "+new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}));
    }catch(e){ this.setState("err",e.message); }
    this.pushing=false;
    if(this.pushAgain){ this.pushAgain=false; this.push(); }
  },
  async pull(force){
    const r=await this.notion("load");
    if(!r.data) return "empty";
    const remoteTs=Number(r.data.updatedAt||0), localTs=Number(DB.updatedAt||0);
    if(!force && remoteTs<=localTs) return remoteTs<localTs?"local-newer":"same";
    const localNotes=new Map((DB.meetingNotes||[]).map(n=>[n.id,n]));
    (r.data.meetingNotes||[]).forEach(n=>{ const l=localNotes.get(n.id); if(l && !n.transcript && l.transcript) n.transcript=l.transcript; });
    const data=applyCurriculum(ensureGroupData(r.data));
    data.weeklyPlanning=data.weeklyPlanning||{}; data.meetingNotes=data.meetingNotes||[]; data.ideas=data.ideas||[];
    data.updatedAt=remoteTs;
    DB=data; save(DB,{touch:false}); renderAll();
    return "pulled";
  },
  async init(){
    if(!this.enabled()){ this.setState("off","Clique para conectar ao Notion"); return; }
    this.setState("busy","Conectando ao Notion…");
    try{
      const res=await this.pull(false);
      if(res==="empty" && DB._fromInitial){ this.setState("err","O Notion ainda está vazio e este navegador só tem a base inicial. Importe seu backup JSON (⬆️ Importar)."); this.processQueue(); return; }
      if(res==="empty"||res==="local-newer") await this.push();
      else this.setState("ok", res==="pulled"?"Dados atualizados a partir do Notion":"Sincronizado com o Notion");
      this.processQueue();
    }catch(e){ this.setState("err",e.message); }
  },
  enqueue(action,payload){
    if(!this.enabled()) return;
    this.queue.push({action,payload:deepClone(payload),tries:0});
    this.persistQueue(); this.processQueue();
  },
  persistQueue(){ try{ localStorage.setItem("ewd_cloud_queue",JSON.stringify(this.queue)); }catch(e){} },
  async processQueue(){
    if(this.processing||!this.enabled()||!this.queue.length) return;
    this.processing=true;
    while(this.queue.length){
      const item=this.queue[0];
      this.setState("busy",`Enviando ao Notion (${this.queue.length} pendente(s))…`);
      try{
        const out=await this.notion(item.action,item.payload);
        this.queue.shift(); this.persistQueue();
        this.afterAction(item,out);
      }catch(e){
        item.tries=(item.tries||0)+1;
        if(item.tries>=5 || /desconhecida|sem ID|sem dados/i.test(e.message)){ this.dropped.push({...item,error:e.message}); this.queue.shift(); }
        this.persistQueue(); this.setState("err","Fila do Notion: "+e.message);
        break;
      }
    }
    this.processing=false;
    if(!this.queue.length && this.state!=="err" && !this.pushing) this.setState("ok","Tudo salvo no Notion");
  },
  afterAction(item,out){
    if(item.action==="saveMeeting" && out?.url){
      const n=(DB.meetingNotes||[]).find(x=>x.id===item.payload.meeting.id);
      if(n){ n.notionUrl=out.url; save(); if(document.getElementById("meeting")?.classList.contains("active")) renderMeetingNotes(); }
    }
  },
  syncAll(){
    if(!this.enabled()){ openCloudSettings(); return; }
    DB.students.forEach(s=>this.queue.push({action:"upsertStudent",payload:deepClone({student:s,key:studentKey(s)}),tries:0}));
    (DB.inactiveStudents||[]).forEach(s=>this.queue.push({action:"upsertStudent",payload:deepClone({student:s,key:s.day?studentKey(s):`${s.name}||`,active:false}),tries:0}));
    (DB.records||[]).forEach(r=>this.queue.push({action:"upsertRecord",payload:deepClone({record:r}),tries:0}));
    (DB.meetingNotes||[]).filter(n=>!n.notionUrl).forEach(n=>this.queue.push({action:"saveMeeting",payload:deepClone({meeting:n}),tries:0}));
    (DB.projects||[]).forEach(p=>this.queue.push({action:"upsertProject",payload:deepClone({project:p}),tries:0}));
    (DB.ideas||[]).forEach(i=>this.queue.push({action:"upsertPost",payload:deepClone({post:i}),tries:0}));
    this.persistQueue(); this.push(); this.processQueue();
    alert(`${this.queue.length} item(ns) na fila para o Notion. Pode continuar usando o painel enquanto envia.`);
  }
};
setInterval(()=>Cloud.processQueue(),60*1000);

      ${Cloud.queue.length?`<br><span class="small">${Cloud.queue.length} item(ns) aguardando envio.</span>`:""}
      ${Cloud.dropped.length?`<br><span class="small">${Cloud.dropped.length} item(ns) não puderam ser enviados: ${esc(Cloud.dropped[Cloud.dropped.length-1].error)}</span>`:""}</div>

async function cloudConnect(){
  const pw=document.getElementById("cloudPw").value.trim();
  const out=document.getElementById("cloudTest");
  if(!pw){ out.textContent="Digite a senha."; return; }
  Cloud.pw=pw; out.textContent="Testando…";
  try{
    const r=await Cloud.notion("ping");
    localStorage.setItem("ewd_cloud_pw",pw);
    out.innerHTML=`✅ Conectado ao Notion. ${r.transcription?"Transcrição de aulas ativa.":"⚠️ Falta a variável OPENAI_API_KEY na Vercel para transcrever."}`;
    await Cloud.init();
  }catch(e){
    out.innerHTML="❌ "+esc(e.message);
    Cloud.pw=localStorage.getItem("ewd_cloud_pw")||"";
  }
}
async function cloudPullNow(){
  if(!confirm("Substituir os dados deste navegador pela cópia salva no Notion?")) return;
  try{ const r=await Cloud.pull(true); alert(r==="empty"?"Ainda não há cópia no Notion.":"Dados carregados do Notion."); Cloud.setState("ok","Dados carregados do Notion"); closeModal(); }
  catch(e){ alert("Erro: "+e.message); }
}
function cloudDisconnect(){
  if(!confirm("Desconectar este navegador do Notion? Os dados continuam salvos no Notion.")) return;
  localStorage.removeItem("ewd_cloud_pw"); Cloud.pw=""; Cloud.setState("off"); closeModal();
}

function reactivateStudent(index){
  const s=(DB.inactiveStudents||[])[index]; if(!s)return;
  const oldKey=s.day?studentKey(s):`${s.name}||`;
  const day=document.getElementById("raDay")?.value||s.day, time=(document.getElementById("raTime")?.value||s.time||"").trim();
  if(!time){alert("Informe o horário.");return;}

  const restored={...s,day,time,level:document.getElementById("raLevel")?.value||s.level,group:s.group||"Individual",progress:s.progress||0,

  restored.members=groupMembers(restored);
  delete restored.active;delete restored.inactivatedAt;delete restored.reason;
  DB.students.push(restored);
  DB.inactiveStudents.splice(index,1);

}

              </div>
            </div>`).join("")}
          </div>
          <input type="hidden" id="statusGroup" value="group">
        ` : `
          <div class="statuses" id="statusGroup">
            ${["✅ Presente","❌ Falta","🔄 Rep. Pendente","✔️ Rep. Feita","⚠️ Rep. c/ Falta"].map((x,i)=>`<button class="status ${i===0?'selected':''}" data-status="${x}" onclick="selectStatus(this)">${x}</button>`).join("")}
          </div>
        `}
      </div>
      <div class="full"><label>Progresso</label><div class="progress" id="progGroup">
        ${[25,50,75,100].map(p=>`<button class="status ${p===100?'selected':''}" data-prog="${p}" onclick="selectProg(this)">${p}%</button>`).join("")}

function selectStatus(el){document.querySelectorAll("#statusGroup .status").forEach(x=>x.classList.remove("selected"));el.classList.add("selected")}
function selectMemberStatus(el){

}
function selectProg(el){document.querySelectorAll("#progGroup .status").forEach(x=>x.classList.remove("selected"));el.classList.add("selected")}
function fillLessonOptions(level){
  const q=(rLessonSearch.value||"").toLowerCase();
  const arr=allLessons().filter(l=>(l.level===level||l.level==="CONV") && JSON.stringify(l).toLowerCase().includes(q));
  rLesson.innerHTML=arr.map(l=>`<option value="${esc(l.level+"||"+l.code)}">${esc(l.level+" · "+l.code+" — "+l.title)}</option>`).join("");

function updateLessonPreview(){
  const [level,code]=(rLesson.value||"||").split("||");
  const l=allLessons().find(x=>x.level===level&&x.code===code);
  rPreview.innerHTML=l?`<b>${esc(l.code)} — ${esc(l.title)}</b><br><b>Grammar:</b> ${esc(l.grammar||"—")}<br><b>Vocabulary:</b> ${esc(l.vocab||"—")}<br><b>Homework:</b> ${esc(l.homework||"—")}`:"Selecione uma lição.";

function saveRecord(key){
  const s=DB.students.find(x=>studentKey(x)===key); if(!s)return;
  const prog=Number(document.querySelector("#progGroup .selected")?.dataset.prog||100);
  let lesson="";
  const custom=(rCustom.value||"").trim();
  if(custom) lesson=custom;
  else {
    const [level,code]=(rLesson.value||"||").split("||");
    const l=allLessons().find(x=>x.level===level&&x.code===code);
    lesson=l?`${l.code} — ${l.title}`:"";
  }
  const [selectedLevel,selectedCode]=(rLesson.value||"||").split("||");
  const members=groupMembers(s);
  let attendance=[];
  if(members.length>1){
    attendance=members.map(name=>{
      const box=[...document.querySelectorAll(".member-statuses")].find(x=>x.dataset.member===name);
      return {name,status:box?.querySelector(".selected")?.dataset.status||"✅ Presente"};
    });
  }else{
    const st=document.querySelector("#statusGroup .selected")?.dataset.status||"✅ Presente";
    attendance=[{name:members[0]||s.name,status:st}];
  }
  const st=attendance.every(a=>a.status===attendance[0].status) ? attendance[0].status : "👥 Presenças individuais";
  const rec={id:Date.now(),date:rDate.value,student:s.name,schedule:key,status:st,attendance,warmup:rWarm.value,lesson,lessonCode:selectedCode||"",lessonLevel:selectedLevel||"",progress:prog,stoppedAt:rStop.value,homeworkDone:rHwDone.value,note:rNote.value};
  DB.records.push(rec);
  if(rWarm.value) DB.warmupUsage.push({date:rDate.value,student:s.name,warmup:rWarm.value,recordId:rec.id});
  s.last=lesson||s.last; s.progress=prog;
  save(); closeModal(); renderAll();
  Cloud.enqueue("upsertRecord",{record:rec});
  Cloud.enqueue("upsertStudent",{student:s,key:studentKey(s)});
}
function suggestWarmups(name){
  const hist=warmHistory(name);
  const lastMap={}; hist.forEach((x,i)=>{if(lastMap[x.warmup]===undefined)lastMap[x.warmup]=x.date});
  return [...DB.warmups].sort((a,b)=>{
    const ad=lastMap[a],bd=lastMap[b];
    if(!ad&&!bd)return a.localeCompare(b);
    if(!ad)return -1;if(!bd)return 1;
    return ad.localeCompare(bd);
  });
}

  </div>`:""}
  <div class="card tablewrap"><table class="table"><thead><tr>
    <th>Data</th><th>Status</th><th>Presenças individuais</th><th>Warm-up</th><th>Lição</th><th>Progresso</th><th>Onde parou</th><th>Homework / Obs.</th>

  </tbody></table></div>
  <div class="toolbar" style="margin-top:14px">
    <button class="btn primary" onclick='closeModal();openRegister(${JSON.stringify(studentKey(s))})'>Registrar nova aula</button>
  </div>`);

  let count=type==="Individual"?1:type==="Dupla"?2:type==="Trio"?3:4;

  box.innerHTML=Array.from({length:count},(_,i)=>`

      <label>${type==="Individual"?"Nome do aluno":`Aluna ${i+1}`}</label>

}

function addStudent(){
  const type=document.getElementById("aGroup").value;
  const members=[...document.querySelectorAll(".aMember")].map(x=>x.value.trim()).filter(Boolean);
  const required=type==="Individual"?1:type==="Dupla"?2:type==="Trio"?3:2;
  if(members.length<required){
    alert(`Adicione ${required} nome(s) para cadastrar esta ${type.toLowerCase()}.`);
    return;
  }
  const name=members.join(" + ");
  const exists=DB.students.some(s=>s.name===name && s.day===aDay.value && s.time===aTime.value.trim());
  if(exists){alert("Essa turma já está cadastrada nesse dia e horário.");return;}
  const meet=normalizeMeet(document.getElementById("aMeet").value);
  if(meet===null){alert("O link do Meet parece inválido. Use o formato https://meet.google.com/abc-defg-hij");return;}
  const ns={
    name,
    members,
    level:aLevel.value,
    day:aDay.value,
    time:aTime.value.trim(),
    group:type,
    last:aLast.value.trim(),
    progress:0,
    notes:aNotes.value.trim(),
    meet
  };
  DB.students.push(ns);
  save();closeModal();renderAll();
  Cloud.enqueue("upsertStudent",{student:ns,key:studentKey(ns)});
}

/* ================= Posts & Ideias: Banco de ideias · Instagram · Calendário (mesmos dados) ================= */
const POST_STAGES=["Ideia","Roteiro","Gravado","Editado","Postado"];
const POST_FORMATS=["Reels","Carrossel","Foto","Story","Live","TikTok","YouTube"];
const POST_PILLARS=["📚 Inglês & aprendizagem","🌍 Cultura & curiosidades","🗣️ Conversation","🎓 Método & aulas","👩‍🎓 Alunos & resultados","💼 Negócio"];
const POST_OBJECTIVES=["Atrair","Engajar","Converter","Fidelizar"];
const STAGE_COLORS={Ideia:"#f1edf7",Roteiro:"#f6eef0",Gravado:"#f6f2ea",Editado:"#edf2f6",Postado:"#edf3ee"};
const MONTHS_PT=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
var IDEAS_UI={view:(()=>{try{return localStorage.getItem("ewd_ideas_view")||"instagram"}catch(e){return "instagram"}})(),format:"",month:todayISO().slice(0,7),objective:""};

function normalizePost(i){
  const stageMap={"Produção":"Gravado","Agendado":"Editado"};
  const fmtMap={"Stories":"Story","Post":"Foto"};
  i.stage=stageMap[i.stage]||i.stage||"Ideia"; if(!POST_STAGES.includes(i.stage)) i.stage="Ideia";
  i.format=fmtMap[i.format]||i.format||"Reels";
  i.metrics=i.metrics||{};
  return i;
}
function postEngagement(i){
  const m=i.metrics||{}, reach=Number(m.reach)||0;
  if(!reach) return null;
  const inter=["likes","comments","saves","shares"].reduce((a,k)=>a+(Number(m[k])||0),0);
  return inter/reach*100;
}
function fmtDateShort(iso){ if(!iso) return ""; const d=new Date(iso+"T12:00:00"); return d.toLocaleDateString("pt-BR",{day:"numeric",month:"short"}).replace(".",""); }
function projectById(id){ return (DB.projects||[]).find(p=>p.id===id); }
function setIdeasView(v){ IDEAS_UI.view=v; try{localStorage.setItem("ewd_ideas_view",v)}catch(e){} renderIdeas(); }
function syncPost(i){ Cloud.enqueue("upsertPost",{post:i}); }

function renderIdeas(){
  const box=document.getElementById("ideas"); if(!box) return;
  DB.ideas=(DB.ideas||[]).map(normalizePost);
  const tabs=[["ideias","💡 Banco de ideias"],["instagram","📸 Instagram"],["calendario","🗓️ Calendário"]];
  let body="";
  if(IDEAS_UI.view==="ideias") body=ideasBankHTML();
  else if(IDEAS_UI.view==="calendario") body=ideasCalendarHTML();
  else body=ideasInstagramHTML();
  box.innerHTML=`
    <div class="toolbar" style="justify-content:space-between;align-items:flex-end;margin-bottom:16px">
      <div><div class="muted">Do insight ao post publicado — tudo conectado: o que muda no Instagram aparece no Calendário e no Banco de ideias.</div></div>
      <button class="btn primary" onclick="openIdeaModal()">+ Novo post / ideia</button>
    </div>
    <div class="subtabs">${tabs.map(([k,l])=>`<button class="pill ${IDEAS_UI.view===k?"on":""}" onclick="setIdeasView('${k}')">${l}</button>`).join("")}</div>
    ${body}`;
  if(IDEAS_UI.view==="ideias") filterIdeaList();
}

        ${top.map(i=>{const m=i.metrics,e=postEngagement(i);return `<tr style="cursor:pointer" onclick="openIdeaModal('${i.id}')"><td><b>${esc(i.title)}</b> <span class="fmt fmt-${esc(i.format)}">${esc(i.format)}</span></td><td>${fmtDateShort(i.date)}</td><td style="text-align:right">${esc(m.reach||0)}</td><td style="text-align:right">${esc(m.likes||0)}</td><td style="text-align:right">${esc(m.comments||0)}</td><td style="text-align:right">${esc(m.saves||0)}</td><td style="text-align:right">${esc(m.shares||0)}</td><td style="text-align:right">${e===null?"—":e.toFixed(1)+"%"}</td></tr>`}).join("")}

function postCardHTML(i){

          ${POST_OBJECTIVES.map(o=>`<div class="bal"><span>${o}</span><b>${byObj[o]}</b></div>`).join("")}

function saveIdea(id){
  const val=x=>document.getElementById(x).value;
  const prev=id?DB.ideas.find(x=>x.id===id):null;
  const metrics={}; ["reach","likes","comments","saves","shares"].forEach(k=>{const v=val("m_"+k); if(v!=="") metrics[k]=Number(v);});
  const item={...(prev||{}),id:id||('idea_'+Date.now()),title:val("ideaTitle").trim(),stage:val("ideaStage"),format:val("ideaFormat"),date:val("ideaDate"),time:val("ideaTime"),pillar:val("ideaPillar"),objective:val("ideaObjective"),level:val("ideaLevel"),projectId:val("ideaProject"),notes:val("ideaNotes").trim(),metrics};
  if(!item.title){alert('Digite um título para a ideia.');return}
  if(prev) Object.assign(prev,item); else DB.ideas.unshift(item);
  save(); closeModal(); renderIdeas(); renderProjects(); syncPost(prev||item);
}

function deleteIdea(id){

}

function siteLinkUrl(l){
  const v=String(l.url||"").trim();
  if(l.type==="whatsapp" && /^[\d\s()+-]{8,}$/.test(v)){ let n=v.replace(/\D/g,""); if(n.length<=11) n="55"+n; return "https://wa.me/"+n+(l.message?"?text="+encodeURIComponent(l.message):""); }
  if(l.type==="instagram" && /^@?[\w.]+$/.test(v) && !v.includes(".com")) return "https://instagram.com/"+v.replace(/^@/,"");
  if(l.type==="email" && /^[\w.+-]+@[\w-]+\.[\w.]+$/.test(v)) return "mailto:"+v;
  if(l.type==="telegram" && /^@?[\w]+$/.test(v)) return "https://t.me/"+v.replace(/^@/,"");
  return v;
}
function sitePublicData(){
  const s=deepClone(DB.site);
  s.links=s.links.map(l=>({...l,url:siteLinkUrl(l),display:(l.type==="instagram"&&l.url&&!/^https?:/.test(l.url))?"@"+String(l.url).replace(/^@/,""):((["whatsapp","email","telegram"].includes(l.type)&&!/^https?:/.test(l.url||""))?l.url:"")}));
  const fixWa=u=>String(u||"").replace(/(wa\.me\/)(\d{10,11})(?=\D|$)/,(m,a,n)=>a+"55"+n);
  s.links.forEach(l=>l.url=fixWa(l.url));
  s.products.forEach(p=>{ p.url=fixWa(p.url); (p.popupLinks||[]).forEach(x=>x.url=fixWa(x.url)); });
  const w=DB.site.links.find(l=>l.type==="whatsapp"&&l.url&&l.visible!==false);
  if(w){ const base=siteLinkUrl({...w,message:""}).split("?")[0];
    s.products.forEach(p=>{ if(!p.url) p.url=base+"?text="+encodeURIComponent(`Oi Denise! Quero saber mais sobre: ${p.title}`); }); }
  return s;
}

// Imagens: reduz no navegador para não pesar (capa 600px, foto 320px).
function siteImage(input,target,id,maxW){
  const file=input.files&&input.files[0]; if(!file) return;
  const fr=new FileReader();
  fr.onload=()=>{ const img=new Image(); img.onload=()=>{
      const scale=Math.min(1,maxW/img.width), c=document.createElement("canvas");
      c.width=Math.round(img.width*scale); c.height=Math.round(img.height*scale);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      const data=c.toDataURL("image/jpeg",.78);
      if(target==="photo") siteSet("photo",data); else siteListSet("products",id,"image",data);
      if(target==="photo") renderSite(); else openSiteProduct(id);
    }; img.src=fr.result; };
  fr.readAsDataURL(file);
}
