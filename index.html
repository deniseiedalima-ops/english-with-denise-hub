function openAviso(id){
  const a=id?DB.avisos.find(x=>x.id===id):{title:"",kind:"📣 Geral",date:todayISO(),until:"",text:"",pinned:false};
  showModal(`<div class="modalhead"><h2>${id?"Editar aviso":"Novo aviso"}</h2><button class="btn" onclick="closeModal()">Fechar</button></div>
  <div class="formgrid">
    <div class="full"><label>Aviso</label><input id="avT" value="${esc(a.title)}" placeholder="Ex.: Feriado dia 15 — sem aulas"></div>
    <div><label>Tipo</label><select id="avK">${AV_KINDS.map(k=>`<option ${a.kind===k?"selected":""}>${k}</option>`).join("")}</select></div>
    <div><label>Fixar no topo</label><select id="avP"><option value="">Não</option><option value="1" ${a.pinned?"selected":""}>📌 Sim</option></select></div>
    <div><label>Data</label><input type="date" id="avD" value="${esc(a.date||"")}"></div>
    <div><label>Mostrar até (opcional)</label><input type="date" id="avU" value="${esc(a.until||"")}"></div>
    <div class="full"><label>Detalhes (opcional)</label><textarea id="avX" rows="3">${esc(a.text||"")}</textarea></div>
  </div>
  <div class="toolbar" style="justify-content:space-between;margin-top:12px">${id?`<button class="btn danger" onclick="delAviso(${id});closeModal()">Excluir</button>`:"<span></span>"}<button class="btn primary" onclick="saveAviso(${id||0})">Salvar</button></div>`);
  setTimeout(()=>document.getElementById("avT")?.focus(),50);
}
function saveAviso(id){
  const t=avT.value.trim(); if(!t){ alert("Escreva o aviso."); return; }
  const o={title:t,kind:avK.value,pinned:!!avP.value,date:avD.value,until:avU.value,text:avX.value.trim()};
  if(id){ Object.assign(DB.avisos.find(x=>x.id===id),o); } else DB.avisos.push({id:Date.now(),done:false,...o});
  save(); closeModal(); renderAvisos(); renderToday();
}
function addAviso(){ openAviso(); }
function toggleAviso(id){ const a=DB.avisos.find(x=>x.id===id); if(a){a.done=!a.done; save(); renderAvisos(); renderToday();} }
function delAviso(id){ if(!confirm("Excluir este aviso?")) return; DB.avisos=DB.avisos.filter(x=>x.id!==id); save(); renderAvisos(); renderToday(); }


/* ---------- Cadastros incompletos (sem mensalidade / sem aniversário) ---------- */
function incompleteRegs(){
  const out=[];
  DB.students.forEach(st=>groupMembers(st).filter(n=>!/^a adicionar$/i.test(n)).forEach(n=>{
    const noFee=memberFee(st,n)===null, noBday=!memberField(st,n,"birthday","");
    if(noFee||noBday) out.push({name:n,turma:st.name,key:studentKey(st),noFee,noBday});
  }));
  const seen=new Set(); return out.filter(x=>{ const k=x.name+"|"+x.noFee+x.noBday; if(seen.has(x.name)) return false; seen.add(x.name); return true; }).sort((a,b)=>a.name.localeCompare(b.name));
}
function openIncomplete(){
  const L=incompleteRegs(), f=L.filter(x=>x.noFee).length, b=L.filter(x=>x.noBday).length;
  showModal(`<div class="modalhead"><div><h2>🧾 Cadastros incompletos</h2><div class="muted small">${f} sem valor de mensalidade · ${b} sem data de aniversário</div></div><button class="btn" onclick="closeModal()">Fechar</button></div>
  ${L.length?`<div class="tablewrap"><table class="table"><thead><tr><th>Aluno</th><th>Turma</th><th>Mensalidade</th><th>Aniversário</th><th></th></tr></thead><tbody>
  ${L.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td class="muted small">${esc(x.turma)}</td><td>${x.noFee?'<span class="chip warn">falta</span>':'<span class="chip ok">ok</span>'}</td><td>${x.noBday?'<span class="chip warn">falta</span>':'<span class="chip ok">ok</span>'}</td><td><button class="btn small primary" onclick='closeModal();openFicha(${JSON.stringify(x.key)},"cadastro")'>Preencher</button></td></tr>`).join("")}
  </tbody></table></div>`:`<div class="empty-state">${STAR_SVG}<div>Todos os alunos ativos têm mensalidade e aniversário cadastrados ✨</div></div>`}`);
}

/* ---------- Pendências ---------- */
const PEND_PRI=["🔴 Alta","🟠 Média","⚪ Baixa"];
var PEND_UI={view:"abertas"};
function autoPendencias(){
  const out=[];
  const rep=(DB.records||[]).filter(r=>r.status==="🔄 Rep. Pendente").length;
  if(rep) out.push({ic:"🔄",t:`${rep} reposição(ões) pendente(s)`,go:"makeups"});
  const late=lateCount(); if(late) out.push({ic:"💰",t:`${late} mensalidade(s) atrasada(s)`,go:"finance",hot:true});
  const ld=leadsDueToday().length; if(ld) out.push({ic:"🎯",t:`${ld} lead(s) com ação para hoje`,go:"leads"});
  const y="2027", st=contractStats(y), started=(DB.contracts||[]).some(c=>c.year===y);
  if(st.sent) out.push({ic:"📑",t:`${st.sent} contrato(s) ${y} aguardando assinatura`,go:"contratos"});
  else if(started&&st.pend) out.push({ic:"📑",t:`${st.pend} contrato(s) ${y} a renovar`,go:"contratos"});
  const wr=(DB.wrappeds||[]).filter(w=>!w.sent).length; if(wr) out.push({ic:"🎁",t:`${wr} Wrapped(s) ainda não enviado(s)`,go:"wrapped"});
  let rp=0; (DB.meetingNotes||[]).forEach(n=>Object.values(n.reports||{}).forEach(r=>{ if(!r.sentAt) rp++; })); if(rp) out.push({ic:"📊",t:`${rp} relatório(s) de aula não enviado(s)`,go:"meeting"});
  const inc=incompleteRegs(); if(inc.length){ const f=inc.filter(x=>x.noFee).length, b=inc.filter(x=>x.noBday).length; out.push({ic:"🧾",t:`Cadastros incompletos: ${f} sem mensalidade · ${b} sem aniversário`,go:"__incomplete"}); }
  const posts=(DB.ideas||[]).filter(i=>i.date===todayISO()&&i.stage!=="Postado").length; if(posts) out.push({ic:"📱",t:`${posts} post(s) agendado(s) para hoje`,go:"ideas"});
  return out;
}
function pendOpen(){ return (DB.pendencias||[]).filter(p=>!p.done).sort((a,b)=>(a.due||"9999").localeCompare(b.due||"9999")||PEND_PRI.indexOf(a.pri)-PEND_PRI.indexOf(b.pri)); }
function pendRow(p,compact){
  const over=!p.done&&p.due&&p.due<todayISO(), isToday=p.due===todayISO();
  return `<div class="pd-item ${p.done?"done":""}">
    <label class="pd-check"><input type="checkbox" ${p.done?"checked":""} onchange="togglePend(${p.id})"><span></span></label>
    <div class="main"><div class="pd-t">${esc(p.title)}</div>
      <div class="small muted">${p.pri?`${esc(p.pri.split(" ")[0])} `:""}${p.due?`<span class="${over?"late":isToday?"today-tag":""}">${over?"atrasada · ":isToday?"hoje · ":""}${dateBR(p.due)}</span>`:"sem prazo"}${p.who?` · ${esc(p.who)}`:""}${p.done&&p.doneAt?` · feita ${dateBR(p.doneAt)}`:""}</div></div>
    ${compact?"":`<button class="btn small" onclick="openPend(${p.id})">✏️</button>`}
  </div>`;
}
function renderPendencias(){
  const box=document.getElementById("pendencias"); if(!box||!box.classList.contains("active")) return;
  hubExtraInit();
  const open=pendOpen(), done=(DB.pendencias||[]).filter(p=>p.done).sort((a,b)=>(b.doneAt||"").localeCompare(a.doneAt||""));
  const over=open.filter(p=>p.due&&p.due<todayISO()).length, tod=open.filter(p=>p.due===todayISO()).length;
  const auto=autoPendencias();
  const list=PEND_UI.view==="feitas"?done:open;
  box.innerHTML=`
  <div class="kpis">
    <div class="kpic hl"><div class="k">Abertas</div><div class="v">${open.length}</div><div class="d">suas pendências</div></div>
    <div class="kpic"><div class="k">Atrasadas</div><div class="v" style="color:${over?"#B4472F":"inherit"}">${over}</div><div class="d">passaram do prazo</div></div>
    <div class="kpic"><div class="k">Para hoje</div><div class="v">${tod}</div><div class="d">${dateBR(todayISO())}</div></div>
    <div class="kpic"><div class="k">Automáticas</div><div class="v">${auto.length}</div><div class="d">geradas pelo Studio</div></div>
  </div>
  <div class="grid">
    <div class="card span8">
      <div class="quick-add"><input id="pdQuick" placeholder="+ Nova pendência… (Enter para salvar)" onkeydown="if(event.key==='Enter')quickPend('pdQuick','pdQuickDue')"><input id="pdQuickDue" type="date"><button class="btn primary" onclick="quickPend('pdQuick','pdQuickDue')">Adicionar</button><button class="btn" onclick="openPend()">Detalhes…</button></div>
      <div class="pills" style="margin:12px 0 6px"><button class="pill ${PEND_UI.view!=="feitas"?"on":""}" onclick="PEND_UI.view='abertas';renderPendencias()">Abertas (${open.length})</button><button class="pill ${PEND_UI.view==="feitas"?"on":""}" onclick="PEND_UI.view='feitas';renderPendencias()">Concluídas (${done.length})</button></div>
      ${list.map(p=>pendRow(p)).join("")||`<div class="empty-state">${STAR_SVG}<div>${PEND_UI.view==="feitas"?"Nada concluído ainda.":"Nenhuma pendência aberta. ✨"}</div></div>`}
    </div>
    <div class="card span4"><h3>⚡ Pendências automáticas</h3><div class="muted small" style="margin:-4px 0 10px">O Studio encontra sozinho o que está faltando.</div>
      ${auto.map(x=>`<div class="auto-item ${x.hot?"hot":""}" onclick="${x.go==='__incomplete'?'openIncomplete()':`go('${x.go}')`}"><span>${x.ic}</span><b>${esc(x.t)}</b><span class="go">→</span></div>`).join("")||`<div class="muted small">Tudo em dia ✨</div>`}
    </div>
  </div>`;
}
function quickPend(inputId,dueId){
  const i=document.getElementById(inputId), t=(i?.value||"").trim(); if(!t) return;
  DB.pendencias=DB.pendencias||[]; DB.pendencias.push({id:Date.now(),title:t,due:document.getElementById(dueId)?.value||"",pri:"🟠 Média",who:"",done:false,createdAt:todayISO()});

  setTimeout(()=>document.getElementById("pdT")?.focus(),50);

function savePend(id){
  const t=pdT.value.trim(); if(!t){ alert("Escreva a pendência."); return; }
  const o={title:t,due:pdD.value,pri:pdP.value,who:pdW.value.trim(),note:pdN.value.trim()};
  if(id) Object.assign(DB.pendencias.find(x=>x.id===id),o); else DB.pendencias.push({id:Date.now(),done:false,createdAt:todayISO(),...o});

function togglePend(id){ const p=DB.pendencias.find(x=>x.id===id); if(!p) return; p.done=!p.done; p.doneAt=p.done?todayISO():""; save(); setTimeout(()=>{renderPendencias(); renderToday();},250); }
function delPend(id){ if(!confirm("Excluir esta pendência?")) return; DB.pendencias=DB.pendencias.filter(x=>x.id!==id); save(); closeModal(); renderPendencias(); renderToday(); }

/* ---------- Contratos ---------- */
const CT_STATUS=["⏳ A renovar","📤 Enviado","✍️ Assinado","🚫 Não renova"];
var CT_UI={year:"2027",q:""};
function contractRows(year){
  const recs=(DB.contracts||[]).filter(c=>c.year===year);
  const rows=recs.map(c=>({...c,_rec:true}));
  if(year==="2027"||year===String(new Date().getFullYear()+1)) allMemberNames().filter(x=>x.active).forEach(x=>{ if(!rows.some(r=>r.name===x.n)) rows.push({id:0,year,name:x.n,status:"⏳ A renovar",url:"",_rec:false}); });
  return rows.sort((a,b)=>a.name.localeCompare(b.name));
}
function contractStats(year){
  const rows=contractRows(year), active=rows.filter(r=>r.status!=="🚫 Não renova");
  const signed=active.filter(r=>r.status==="✍️ Assinado").length;
  return {total:active.length,signed,sent:active.filter(r=>r.status==="📤 Enviado").length,pend:active.length-signed,out:rows.length-active.length,pct:active.length?Math.round(signed/active.length*100):0};
}
function ctGet(year,name){ DB.contracts=DB.contracts||[]; let c=DB.contracts.find(x=>x.year===year&&x.name===name); if(!c){ c={id:Date.now()+Math.floor(Math.random()*999),year,name,status:"⏳ A renovar",url:"",sentAt:"",signedAt:"",note:""}; DB.contracts.push(c); } return c; }
function ctSet(year,name,field,value){
  const c=ctGet(year,name); c[field]=value;
  if(field==="url"&&value&&!/^https?:\/\//.test(value)) c.url="https://"+value;
  if(field==="status"){ if(value==="✍️ Assinado"&&!c.signedAt) c.signedAt=todayISO(); if(value==="📤 Enviado"&&!c.sentAt) c.sentAt=todayISO(); }
  save(); renderContratos(); renderToday();
}
function ctRing(p,size=110){ const r=size*0.4, c=2*Math.PI*r; return `<svg class="ct-ring" viewBox="0 0 ${size} ${size}" width="${size}" height="${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#F6E3CF" stroke-width="${size*0.11}"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#E8821E" stroke-width="${size*0.11}" stroke-linecap="round" stroke-dasharray="${c*p/100} ${c}" transform="rotate(-90 ${size/2} ${size/2})"/><text x="50%" y="54%" text-anchor="middle" dominant-baseline="middle" font-size="${size*0.22}" font-weight="800" fill="#C96A12">${p}%</text></svg>`; }
function ctSend(year,name){
  const c=ctGet(year,name); const first=name.split(" ")[0];
  const msg=`Oi, ${first}! 💛 Segue o seu contrato de acompanhamento ${year} do English with Denise. É só assinar pela assinatura eletrônica do gov.br e me devolver por aqui 😊${c.url?`\n${c.url}`:""}`;
  window.open(waLink(memberPhone(name),msg),"_blank");
  if(c.status==="⏳ A renovar"){ c.status="📤 Enviado"; c.sentAt=todayISO(); }
  save(); renderContratos();
}
function renderContratos(){
  const box=document.getElementById("contratos"); if(!box||!box.classList.contains("active")) return;
  hubExtraInit();
  const years=[...new Set(["2027",...(DB.contracts||[]).map(c=>c.year)])].sort().reverse();
  const y=CT_UI.year, st=contractStats(y);
  const q=normName(CT_UI.q);
  const rows=contractRows(y).filter(r=>!q||normName(r.name+" "+(r.fullName||"")).includes(q));
  box.innerHTML=`
  <div class="ct-top card">
    <div class="ct-ringbox">${ctRing(st.pct)}<div><div class="eyebrow">Contratos ${esc(y)}</div><div class="ct-big">${st.signed} de ${st.total} assinados</div>
      <div class="muted small">📤 ${st.sent} enviados · ⏳ ${st.pend-st.sent} a renovar${st.out?` · 🚫 ${st.out} não renovam`:""}</div></div></div>
    <div class="ct-folder"><label>📁 Pasta dos contratos no Google Drive</label>
      <div class="toolbar" style="flex-wrap:nowrap"><input id="ctFolder" value="${esc(DB.contractsFolder||"")}" placeholder="Cole o link da pasta do Drive" onchange="DB.contractsFolder=this.value.trim();save();renderContratos()">${DB.contractsFolder?`<a class="btn primary" style="text-decoration:none;white-space:nowrap" href="${esc(DB.contractsFolder)}" target="_blank" rel="noopener">Abrir pasta ↗</a>`:""}</div>
      <div class="muted small" style="margin-top:4px">Dica: crie a subpasta <b>2027</b> no Drive e cole o link dela aqui.</div></div>
  </div>
  <div class="toolbar" style="justify-content:space-between;margin:14px 0 8px">
    <div class="pills">${years.map(x=>`<button class="pill ${x===y?"on":""}" onclick="CT_UI.year='${esc(x)}';renderContratos()">${esc(x)}</button>`).join("")}<button class="pill" onclick="newContractYear()">+ período</button></div>
    <div class="toolbar"><input placeholder="Buscar aluno…" value="${esc(CT_UI.q)}" oninput="CT_UI.q=this.value;clearTimeout(window.__ctq);window.__ctq=setTimeout(()=>{renderContratos();const i=document.querySelector('#contratos .toolbar input[placeholder^=Buscar]');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}},250)" style="max-width:220px"><button class="btn" onclick="openAddContract()">+ Contrato de outro aluno</button></div>
  </div>
  <div class="card tablewrap"><table class="table ct-table"><thead><tr><th style="width:60px">Assinado</th><th>Aluno</th><th>Status</th><th>Contrato no Drive</th><th></th></tr></thead><tbody>
    ${rows.map(r=>{ const n=JSON.stringify(r.name), yy=JSON.stringify(y); const signed=r.status==="✍️ Assinado";
      return `<tr class="${signed?"ct-ok":""}">
      <td style="text-align:center"><input type="checkbox" class="bigcheck" ${signed?"checked":""} onchange='ctSet(${yy},${n},"status",this.checked?"✍️ Assinado":"📤 Enviado")'></td>

const LIB_STATUS=["✅ Pronta","🛠️ Em construção","💡 Ideia","🗄️ Arquivada"];
const LIB_LEVELS=["A1","A2","B1","B2","CONV","Personalizada"];

var CRONO={tab:"biblioteca",q:"",level:"",status:"",who:"",sq:""};

function libStatus(l){ return l.status||(l.link||l.docUrl?"✅ Pronta":"🛠️ Em construção"); }
function libSorted(){
  const order=LIB_LEVELS;
  return [...allLessons()].sort((a,b)=>order.indexOf(a.level)-order.indexOf(b.level)||(parseFloat(a.code.replace(/^[A-Z]+/,""))||0)-(parseFloat(b.code.replace(/^[A-Z]+/,""))||0)||String(a.code).localeCompare(String(b.code)));

    <select onchange="CRONO.level=this.value;renderCronogramas()" style="max-width:160px"><option value="">Todos os níveis</option>${LIB_LEVELS.map(l=>`<option ${CRONO.level===l?"selected":""}>${l}</option>`).join("")}</select>
    <select onchange="CRONO.status=this.value;renderCronogramas()" style="max-width:190px"><option value="">Todos os status</option>${LIB_STATUS.map(l=>`<option ${CRONO.status===l?"selected":""}>${l}</option>`).join("")}</select>

  </div>
  <div class="card tablewrap"><table class="table lib-table"><thead><tr><th>Nível</th><th>Nº</th><th>Aula</th><th>Foco</th><th>Status</th><th>Material</th><th></th></tr></thead><tbody>
  ${rows.map(l=>{ const id=JSON.stringify(lid(l)), st=libStatus(l); return `<tr>
    <td>${badge(l.level)}</td><td class="muted">${esc(l.code)}</td>
    <td><b class="lib-title" onclick='openLibLesson(${id})'>${esc(l.title)}</b>${used.has(lid(l))?` <span class="chip" title="Já usada em aulas registradas">usada</span>`:""}${(l.skills||[]).length?`<div class="lib-skills">${l.skills.map(k=>`<span>${esc(k)}</span>`).join("")}</div>`:""}</td>
    <td class="small">${esc(l.goal||"")}${l.grammar?`<div class="muted">📐 ${esc(l.grammar)}</div>`:""}</td>
    <td><select class="lib-st s${LIB_STATUS.indexOf(st)}" onchange='libSet(${id},"status",this.value)'>${LIB_STATUS.map(s=>`<option ${st===s?"selected":""}>${s}</option>`).join("")}</select></td>
    <td style="white-space:nowrap">${libLinks(l)||`<button class="btn small" onclick='openLibLesson(${id})'>+ link</button>`}</td>
    <td><button class="btn small" onclick='openLibLesson(${id})'>✏️</button></td></tr>`; }).join("")||`<tr><td colspan="7" class="muted">Nenhuma aula encontrada.</td></tr>`}
  </tbody></table></div>`;
}
function libLinks(l){
  const L=[[l.link||l.docUrl,"📄","Aula (Docs)"],[l.activityUrl,"📝","Atividade"],[l.extraUrl,"➕","Extra studies"],[l.audioUrl,"🎧","Listening"],[l.folderUrl,"📁","Pasta"]].filter(x=>x[0]);

}
function libSet(id,field,value){ const l=libFind(id); if(!l) return; l[field]=value; save(); renderCronogramas(); }

    <div><label>Status</label><select id="lb_status">${LIB_STATUS.map(x=>`<option ${libStatus(l)===x?"selected":""}>${x}</option>`).join("")}</select></div>
    <div><label>Habilidades em foco</label><div class="skill-pick" id="lb_skills">${LIB_SKILLS.map(k=>`<span class="skillchip ${(l.skills||[]).includes(k)?"on":""}" onclick="this.classList.toggle('on')">${k}</span>`).join("")}</div></div>

    ${f("audioUrl","🎧 Link do listening","",false)}${f("folderUrl","📁 Link da pasta no Drive","",false)}
    ${f("homework","🏠 Homework","",false)}${f("tags","🏷️ Tags","Ex.: viagem, trabalho, entrevista",false)}
    ${f("content","🔎 Texto do material (opcional)","Cole aqui o texto do Docs para a busca encontrar qualquer palavra dentro da aula",true,true)}
    ${f("notes","📝 Observações","Ex.: funciona melhor com adultos; dá para dividir em 2 aulas",true,true)}
  </div>
  <div class="toolbar" style="justify-content:space-between;margin-top:12px">${id&&(DB.customLessons||[]).some(x=>lid(x)===id)?`<button class="btn danger" onclick='delLibLesson(${JSON.stringify(id)})'>Excluir</button>`:"<span></span>"}<button class="btn primary" onclick='saveLibLesson(${JSON.stringify(id||"")})'>Salvar aula</button></div>`);
}
function saveLibLesson(id){
  const g=k=>(document.getElementById("lb_"+k)?.value||"").trim();
  if(!g("title")){ alert("Dê um título para a aula."); return; }
  let l=id?libFind(id):null;
  if(!l){ DB.customLessons=DB.customLessons||[]; l={}; DB.customLessons.push(l); }
  ["level","code","title","status","goal","grammar","vocab","expressions","link","activityUrl","extraUrl","audioUrl","folderUrl","homework","tags","content","notes"].forEach(k=>l[k]=g(k));
  if(!l.code) l.code=String(Date.now()).slice(-4);
  l.skills=[...document.querySelectorAll("#lb_skills .skillchip.on")].map(x=>x.textContent);
  save(); closeModal(); renderCronogramas();
}
function delLibLesson(id){ if(!confirm("Excluir esta aula da biblioteca?")) return; DB.customLessons=(DB.customLessons||[]).filter(x=>lid(x)!==id); save(); closeModal(); renderCronogramas(); }

/* ---------- 2. Cronograma por aluno ---------- */
const PLAN_ST=["📌 Planejada","✅ Feita","⏭️ Pulada"];
function planOf(s){ DB.schedules=DB.schedules||{}; return DB.schedules[s.name]=DB.schedules[s.name]||{items:[],level:s.level}; }
function planDoneMap(s){
  const recs=studentHistory(s.name).filter(r=>!/Falta/.test(r.status||"")), map={};
  recs.forEach(r=>{ const k=r.lessonCode?`${r.lessonLevel}|${r.lessonCode}`:""; if(k&&!map[k]) map[k]=r.date;
    const t=normName(r.lesson||""); allLessons().forEach(l=>{ if(t&&normName(l.title).length>4&&t.includes(normName(l.title))&&!map[lid(l)]) map[lid(l)]=r.date; }); });
  return map;
}
function planItems(s){
  const p=planOf(s), done=planDoneMap(s);
  return p.items.map(it=>{ const l=it.ref?libFind(it.ref):null; const auto=it.ref&&done[it.ref]; return {...it,l,title:it.title||l?.title||"Aula",st:it.status||(auto?"✅ Feita":"📌 Planejada"),doneAt:it.doneAt||auto||""}; });
}
function cronoEditor(s,inFicha){
  const p=planOf(s), items=planItems(s), lv=s.level;
  const doneN=items.filter(i=>i.st==="✅ Feita").length, pct=items.length?Math.round(doneN/items.length*100):0;
  const next=items.find(i=>i.st==="📌 Planejada");
  const inPlan=new Set(p.items.map(i=>i.ref).filter(Boolean));
  const avail=libSorted().filter(l=>!inPlan.has(lid(l))&&libStatus(l)!=="🗄️ Arquivada");
  const key=JSON.stringify(s.name);
  return `
  <div class="grid">
    <div class="card span8">
      <div class="toolbar" style="justify-content:space-between;align-items:center">
        <div><h3 style="margin:0">🧭 Cronograma de ${esc(s.name)}</h3><div class="muted small">${items.length} aula(s) · ${doneN} feita(s)${next?` · próxima: <b>${esc(next.title)}</b>`:""}</div></div>
        <div class="toolbar"><label class="small" style="margin:0">Nível</label><select onchange='setStudentLevel(${key},this.value)' style="width:auto">${["A1","A2","B1","B2","C1","CONV"].map(x=>`<option ${lv===x?"selected":""}>${x}</option>`).join("")}</select></div>
      </div>
      <div class="bar" style="margin:10px 0 14px"><i style="width:${pct}%"></i></div>
      ${items.length?`<div class="plan-list">${items.map((it,i)=>`<div class="plan-item ${it.st==="✅ Feita"?"done":it.st==="⏭️ Pulada"?"skip":""}">
        <div class="plan-n">${i+1}</div>
        <div class="main"><b>${esc(it.title)}</b> ${it.l?`<span class="muted small">${esc(it.l.level)} · ${esc(it.l.code)}</span>`:`<span class="chip">personalizada</span>`}
          <div class="small muted">${it.l?.goal?esc(it.l.goal):""}${it.note?` · 📝 ${esc(it.note)}`:""}${it.doneAt&&it.st==="✅ Feita"?` · feita ${dateBR(it.doneAt)}`:""}</div></div>
        <div class="plan-act">${it.l?libLinks(it.l):""}
          <select class="plan-st" onchange='planSet(${key},"${it.id}","status",this.value)'>${PLAN_ST.map(x=>`<option ${it.st===x?"selected":""}>${x}</option>`).join("")}</select>
          <button class="btn small" title="Subir" onclick='planMove(${key},"${it.id}",-1)'>↑</button><button class="btn small" title="Descer" onclick='planMove(${key},"${it.id}",1)'>↓</button>
          <button class="btn small" title="Observação" onclick='planNote(${key},"${it.id}")'>📝</button><button class="btn small danger" title="Remover" onclick='planDel(${key},"${it.id}")'>✕</button></div>
      </div>`).join("")}</div>`
      :`<div class="empty-state">${STAR_SVG}<div>Cronograma vazio. Comece pela sequência padrão do nível ${esc(lv)} e ajuste para ${esc(s.name.split(" ")[0])}.</div><button class="btn primary" onclick='planFromLevel(${key})'>Usar sequência do ${esc(lv)} como base</button></div>`}
    </div>
    <div class="card span4"><h3>+ Adicionar aulas</h3>
      <input placeholder="Buscar na biblioteca…" oninput="planFilter(this.value)" style="margin-bottom:8px">
      <div class="plan-avail" id="planAvail">${avail.map(l=>`<div class="pa-item" data-q="${esc(normName(l.level+" "+l.code+" "+l.title+" "+(l.goal||"")+" "+(l.grammar||"")))}" data-lv="${esc(l.level)}" style="${l.level===lv?"":"display:none"}"><div class="main"><b class="small">${esc(l.title)}</b><div class="muted small">${esc(l.level)} · ${esc(l.code)} · ${esc(libStatus(l).split(" ")[0])}</div></div><button class="btn small" onclick='planAdd(${key},${JSON.stringify(lid(l))})'>+</button></div>`).join("")}</div>
      <div class="muted small" style="margin-top:6px">Mostrando o nível ${esc(lv)}. Busque para ver aulas de outros níveis.</div>
      <div class="hr"></div>
      <label>Aula personalizada (fora da biblioteca)</label>
      <div class="toolbar" style="flex-wrap:nowrap"><input id="planCustom" placeholder="Ex.: Aula sobre a viagem para Londres"><button class="btn" onclick='planAddCustom(${key})'>+</button></div>
      ${items.length?`<div class="hr"></div><button class="btn small" onclick='planFromLevel(${key},true)'>+ Acrescentar aulas do ${esc(lv)} que faltam</button>`:""}
    </div>
  </div>`;
}
function planFilter(q){ q=normName(q); const lv=(document.querySelector("#planAvail")?.dataset.lv)||""; document.querySelectorAll("#planAvail .pa-item").forEach(el=>{ el.style.display=q?(el.dataset.q.includes(q)?"":"none"):(el.dataset.lv===planCurLevel()?"":"none"); }); }
function planCurLevel(){ const s=cronoStudent(); return s?.level||""; }
function cronoStudent(){ const name=CRONO.inFicha?fichaStudent()?.name:CRONO.who; return DB.students.find(s=>s.name===name)||null; }
function planRerender(){ if(document.getElementById("ficha")?.classList.contains("active")) renderFicha(); else renderCronogramas(); }
function setStudentLevel(name,lv){ const s=DB.students.find(x=>x.name===name); if(!s) return; s.level=lv; planOf(s).level=lv; save(); if(Cloud.enabled()) Cloud.enqueue("upsertStudent",{student:s,key:studentKey(s),active:true}); planRerender(); }
function planFromLevel(name,onlyMissing){
  const s=DB.students.find(x=>x.name===name); if(!s) return; const p=planOf(s); const have=new Set(p.items.map(i=>i.ref));
  libSorted().filter(l=>l.level===s.level&&libStatus(l)!=="🗄️ Arquivada"&&!have.has(lid(l))).forEach((l,i)=>p.items.push({id:"p"+Date.now()+i,ref:lid(l)}));
  save(); planRerender();
}
function planAdd(name,ref){ const s=DB.students.find(x=>x.name===name); if(!s) return; planOf(s).items.push({id:"p"+Date.now(),ref}); save(); planRerender(); }
function planAddCustom(name){ const v=(document.getElementById("planCustom")?.value||"").trim(); if(!v) return; const s=DB.students.find(x=>x.name===name); planOf(s).items.push({id:"p"+Date.now(),ref:"",title:v}); save(); planRerender(); }
function planFind(name,id){ const s=DB.students.find(x=>x.name===name); const p=planOf(s); return {p,i:p.items.findIndex(x=>x.id===id)}; }
function planSet(name,id,f,v){ const {p,i}=planFind(name,id); if(i<0) return; p.items[i][f]=v; if(f==="status") p.items[i].doneAt=v==="✅ Feita"?(p.items[i].doneAt||todayISO()):""; save(); planRerender(); }
function planMove(name,id,d){ const {p,i}=planFind(name,id); const j=i+d; if(i<0||j<0||j>=p.items.length) return; [p.items[i],p.items[j]]=[p.items[j],p.items[i]]; save(); planRerender(); }
function planNote(name,id){ const {p,i}=planFind(name,id); if(i<0) return; const v=prompt("Observação para esta aula no cronograma:",p.items[i].note||""); if(v===null) return; p.items[i].note=v.trim(); save(); planRerender(); }
function planDel(name,id){ const {p,i}=planFind(name,id); if(i<0) return; p.items.splice(i,1); save(); planRerender(); }
function nextPlanned(s){ return planItems(s).find(i=>i.st==="📌 Planejada")||null; }
function cronoAlunos(){
  CRONO.inFicha=false;
  if(!CRONO.who||!DB.students.some(s=>s.name===CRONO.who)) CRONO.who=DB.students[0]?.name||"";
  const s=DB.students.find(x=>x.name===CRONO.who);
  const order=["Segunda","Terça","Quarta","Quinta","Sexta","Sábado","Domingo"];
  const list=[...DB.students].sort((a,b)=>a.name.localeCompare(b.name));
  return `<div class="crono-students">${list.map(x=>{ const it=planItems(x), d=it.filter(i=>i.st==="✅ Feita").length; return `<button class="cs-item ${x.name===CRONO.who?"on":""}" onclick='CRONO.who=${JSON.stringify(x.name)};renderCronogramas()'><b>${esc(x.name)}</b><span>${esc(x.level)} · ${it.length?`${d}/${it.length}`:"sem cronograma"}</span></button>`; }).join("")}</div>

function hl(text,q){ const t=String(text||""); if(!q) return esc(t); const i=normName(t).indexOf(normName(q)); if(i<0) return esc(t); return esc(t.slice(0,i))+"<mark>"+esc(t.slice(i,i+q.length))+"</mark>"+esc(t.slice(i+q.length)); }
function snippet(text,q){ const t=String(text||""), i=normName(t).indexOf(normName(q)); if(i<0) return ""; const a=Math.max(0,i-70), b=Math.min(t.length,i+q.length+90); return (a?"…":"")+hl(t.slice(a,b),q)+(b<t.length?"…":""); }

/* ---------- Exportar CSV (abre no Excel / Google Sheets) ---------- */
function downloadCSV(name,header,rows){
  const cell=v=>{ v=v===null||v===undefined?"":String(v); return /[";\n]/.test(v)?`"${v.replace(/"/g,'""')}"`:v; };
  const num=v=>v===null||v===undefined||v===""?"":String(v).replace(".",",");
  const csv="\ufeff"+[header,...rows.map(r=>r.map((v,i)=>typeof v==="number"?num(v):v))].map(r=>r.map(cell).join(";")).join("\r\n");
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"})); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

function isBlank(v){ return v===undefined||v===null||v===""||(Array.isArray(v)&&!v.length)||(typeof v==="object"&&!Array.isArray(v)&&!Object.keys(v).length); }
function fillBlanks(cur,inc){ // mantém o que já existe; só preenche o que está vazio
  Object.keys(inc||{}).forEach(k=>{
    if(isBlank(cur[k])) cur[k]=inc[k];
    else if(cur[k]&&typeof cur[k]==="object"&&!Array.isArray(cur[k])&&inc[k]&&typeof inc[k]==="object"&&!Array.isArray(inc[k])) fillBlanks(cur[k],inc[k]);
  });
  return cur;
}
function mergeBackup(cur,inc){
  const rep={alunos:0,inativos:0,aulas:0,outros:0};
  const kOf=s=>s.day?`${s.name}|${s.day}|${s.time||""}`:s.name;
  // alunos ativos
  (inc.students||[]).forEach(st=>{
    const same=cur.students.find(x=>kOf(x)===kOf(st));
    if(same){ fillBlanks(same,st); return; }
    if((cur.inactiveStudents||[]).some(x=>x.name===st.name)) return; // está inativo hoje: respeita
    cur.students.push(st); rep.alunos++;
  });
  cur.inactiveStudents=cur.inactiveStudents||[];
  (inc.inactiveStudents||[]).forEach(st=>{
    const same=cur.inactiveStudents.find(x=>x.name===st.name);
    if(same){ fillBlanks(same,st); return; }
    if(cur.students.some(x=>x.name===st.name)) return; // voltou a ser ativo
    cur.inactiveStudents.push(st); rep.inativos++;
  });
  // registros de aula
  cur.records=cur.records||[];
  const ids=new Set(cur.records.map(r=>r.id)), slots=new Set(cur.records.map(r=>`${r.date}|${r.schedule||r.student}`));
  (inc.records||[]).forEach(r=>{ if(ids.has(r.id)||slots.has(`${r.date}|${r.schedule||r.student}`)){ const c=cur.records.find(x=>x.id===r.id); if(c) fillBlanks(c,r); return; } cur.records.push(r); rep.aulas++; });
  cur.records.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  // biblioteca de aulas (arquivo gerado a partir do Google Drive): completa as aulas sem apagar o que já foi preenchido
  rep.biblioteca=0;
  (inc.libraryUpdate||[]).forEach(u=>{
    const pool=[...(cur.lessons||[]),...(cur.customLessons=cur.customLessons||[])];
    let l=pool.find(x=>x.level===u.level&&String(x.code)===String(u.code));
    if(!l){ l={level:u.level,code:u.code,title:u.title}; cur.customLessons.push(l); }
    let changed=false;
    Object.keys(u).forEach(k=>{ if(isBlank(l[k])&&!isBlank(u[k])){ l[k]=u[k]; changed=true; } });
    if(changed) rep.biblioteca++;
  });
  // demais listas e dicionários
  Object.keys(inc).forEach(k=>{
    if(["students","inactiveStudents","records","libraryUpdate","_info"].includes(k)) return;
    const a=cur[k], b=inc[k];
    if(isBlank(a)){ if(!isBlank(b)){ cur[k]=b; rep.outros++; } return; }
    if(Array.isArray(a)&&Array.isArray(b)){
      const key=x=>x&&typeof x==="object"?(x.id!=null?"id:"+x.id:(x.level&&x.code!=null?`L:${x.level}|${x.code}`:JSON.stringify(x))):String(x);
      const have=new Set(a.map(key)); b.forEach(x=>{ if(!have.has(key(x))){ a.push(x); rep.outros++; } });
    } else if(a&&typeof a==="object"&&!Array.isArray(a)&&b&&typeof b==="object"&&!Array.isArray(b)){
      Object.keys(b).forEach(x=>{ if(isBlank(a[x])){ a[x]=b[x]; rep.outros++; } else if(typeof a[x]==="object"&&typeof b[x]==="object"&&!Array.isArray(a[x])) fillBlanks(a[x],b[x]); });
    } // valores simples: mantém o atual
  });
  return rep;
}
async function importBackup(file){
  if(!file)return;
  let obj;
  try{obj=JSON.parse(await file.text());}catch(e){alert("Não foi possível importar este arquivo.");return;}
  const merge=confirm("Como importar este backup?\n\nOK = MESCLAR (recomendado): mantém tudo o que você já cadastrou e só acrescenta o que falta (alunos, aulas, anotações).\n\nCancelar = escolher substituir tudo.");
  if(merge){
    const before=JSON.stringify(DB);
    try{ localStorage.setItem("ewd_before_merge",before); }catch(e){}
    const rep=mergeBackup(DB,ensureGroupData(obj));
    DB=applyCurriculum(ensureGroupData(DB));
  if(!DB.weeklyPlanning)DB.weeklyPlanning={};
  if(!DB.meetingNotes)DB.meetingNotes=[];
  if(!DB.ideas)DB.ideas=[];
    save();renderAll();
    alert(`Backup mesclado ✔\n\n${rep.biblioteca?`📚 ${rep.biblioteca} aula(s) da biblioteca completada(s)\n`:""}+ ${rep.aulas} registro(s) de aula\n+ ${rep.alunos} aluno(s)/turma(s)\n+ ${rep.inativos} inativo(s)\n+ ${rep.outros} outro(s) item(ns)\n\nNada do que você já tinha foi apagado ou alterado — campos vazios foram preenchidos com o backup.`);
    if(Cloud.enabled() && confirm("Enviar também as novidades para o Notion agora?")) Cloud.syncAll();
    return;
  }
  if(!confirm("SUBSTITUIR tudo pelo backup? O que você cadastrou depois desse backup será perdido.\n\n(Dica: clique em Cancelar e use “Exportar” antes, por segurança.)")) return;
  DB=applyCurriculum(ensureGroupData(obj));
  if(!DB.weeklyPlanning)DB.weeklyPlanning={};
  if(!DB.meetingNotes)DB.meetingNotes=[];
  if(!DB.ideas)DB.ideas=[];
  save();renderAll();
  if(Cloud.enabled() && confirm("Backup importado. Enviar também todos os alunos, aulas e meeting notes para as bases do Notion?")) Cloud.syncAll();
  else alert("Backup importado com sucesso.");
}
document.getElementById("importFile").addEventListener("change",e=>importBackup(e.target.files[0]));
function resetData(){
  if(!confirm("Restaurar a base inicial? Isso apaga os registros locais atuais."+(Cloud.enabled()?"\n\nAtenção: a base inicial também substituirá a cópia salva no Notion.":"")))return;
  localStorage.removeItem(STORAGE_KEY);DB=load();save();renderAll();
}
renderAll();
Cloud.init();
