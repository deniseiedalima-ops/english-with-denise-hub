    <div class="formgrid">
      <div class="full"><label>Nome</label><input value="${esc(p.title)}" oninput="siteListSet('products','${id}','title',this.value)"></div>
      <div class="full"><label>Etiqueta (opcional, pequena acima do nome)</label><input value="${esc(p.tag||"")}" placeholder="Ex.: Mentoria, E-book, Clube" oninput="siteListSet('products','${id}','tag',this.value)"></div>
      <div class="full"><label>Descrição curta (aparece no card)</label><textarea rows="2" oninput="siteListSet('products','${id}','desc',this.value)" placeholder="1 ou 2 frases: para quem é e o que a pessoa ganha.">${esc(p.desc||"")}</textarea></div>
      <div class="full"><label>Detalhes (aparecem ao clicar em “Saber mais”)</label><textarea rows="4" oninput="siteListSet('products','${id}','details',this.value)" placeholder="Como funciona, duração, o que inclui...">${esc(p.details||"")}</textarea></div>
      <div><label>Preço</label><input value="${esc(p.price||"")}" placeholder="Ex.: R$ 97 · ou deixe vazio" oninput="siteListSet('products','${id}','price',this.value)"></div>
      <div><label>Texto do botão de compra</label><input value="${esc(p.cta||"")}" oninput="siteListSet('products','${id}','cta',this.value)"></div>
      <div class="full"><label>Ao clicar no botão</label>
        <div class="pills"><button class="pill ${p.mode!=="popup"?"on":""}" onclick="siteListSet('products','${id}','mode','link');openSiteProduct('${id}')">🔗 Abrir um link</button><button class="pill ${p.mode==="popup"?"on":""}" onclick="siteProdPopup('${id}')">📺 Botão principal + lista de links</button></div></div>
      ${p.mode==="popup"?`<div class="full popup-editor">
        <label style="margin-top:8px">Texto do botão que abre a lista</label><input value="${esc(p.listLabel||"Ver as séries disponíveis")}" oninput="siteListSet('products','${id}','listLabel',this.value)">
        <label style="margin-top:10px">Links — o 1º vira o botão principal; os outros aparecem ao clicar no botão da lista (só os preenchidos)</label>
        ${(p.popupLinks||[]).map((x,k)=>`<div class="site-item-row" style="margin-top:6px"><b style="min-width:18px">${k+1}</b><input value="${esc(x.label||"")}" placeholder="${k===0?"🔎 Descobrir minha série":"Ex.: Comprar Friends"}" oninput="siteProdPopupLink('${id}',${k},'label',this.value)"><input value="${esc(x.url||"")}" placeholder="https://..." oninput="siteProdPopupLink('${id}',${k},'url',this.value)"></div>`).join("")}
      </div>`:""}
      <div class="full" ${p.mode==="popup"?'style="display:none"':""}><label>Link do botão</label><input id="prodUrl" value="${esc(p.url||"")}" placeholder="Link de pagamento, formulário ou WhatsApp" oninput="siteListSet('products','${id}','url',this.value)">
        ${whats?`<button class="btn small" style="margin-top:6px" onclick="siteProdWhats('${id}')">💬 Usar WhatsApp com mensagem sobre este produto</button>`:""}</div>
      <div class="full"><label>Cor da estrela cadente</label>
        <div class="swatches">${SITE_COLORS.map(([k,c])=>`<button class="sw ${p.color===k?"on":""}" style="background:${c}" title="${k}" onclick="siteListSet('products','${id}','color','${k}');openSiteProduct('${id}')"></button>`).join("")}</div></div>
    </div>
  </div>
  <div class="toolbar" style="justify-content:space-between;margin-top:14px"><button class="btn danger" onclick="closeModal();siteRemove('products','${id}')">Excluir produto</button><button class="btn primary" onclick="closeModal()">Concluir</button></div>`);
  window.__onModalClose=()=>renderSite();
}
function siteProdPopup(id){
  const p=DB.site.products.find(x=>x.id===id); if(!p) return;
  p.mode="popup"; p.popupTitle=p.popupTitle||p.title;
  p.popupLinks=(p.popupLinks||[]).concat(Array(6).fill(0).map(()=>({label:"",url:""}))).slice(0,6);
  if(!p.popupLinks[0].url && p.url) p.popupLinks[0]={label:p.popupLinks[0].label||p.cta||"Saiba mais",url:p.url};
  siteChanged(false); openSiteProduct(id);
}
function siteProdPopupLink(id,k,field,value){
  const p=DB.site.products.find(x=>x.id===id); if(!p||!p.popupLinks[k]) return;
  p.popupLinks[k][field]=value; siteChanged(false);
}
function siteProdWhats(id){
  const p=DB.site.products.find(x=>x.id===id), w=DB.site.links.find(l=>l.type==="whatsapp"&&l.url); if(!p||!w) return;
  const base=siteLinkUrl({...w,message:""}).split("?")[0];
  const url=base+"?text="+encodeURIComponent(`Oi Denise! Quero saber mais sobre: ${p.title}`);
  siteListSet("products",id,"url",url); const el=document.getElementById("prodUrl"); if(el) el.value=url;
}

/* ================= Projetos 2027 ================= */
const PROJ_TYPES=["🎬 Clube cultural","🎤 Palestra / convidados","📚 Curso","🛍️ Produto","📅 Evento","✨ Outro"];
const PROJ_STATUS=["💡 Ideia","🗺️ Planejando","🚧 Em andamento","🚀 Lançado","⏸️ Pausado"];
const PROJ_QUARTERS=["Sem data","Q1 2027","Q2 2027","Q3 2027","Q4 2027"];
const GUEST_STATUS=["A convidar","Convidado","Confirmado","Realizado","Não pode"];
var PROJ_UI={status:""};

function ensureProjects(){
  if(Array.isArray(DB.projects)) return;
  DB.projects=[
    {id:"proj_clube_cultural",name:"Clube Cultural",type:"🎬 Clube cultural",status:"💡 Ideia",quarter:"Sem data",targetDate:"",
     description:"Encontros culturais em inglês (filmes, jogos e conversas) para alunos e comunidade do English with Denise.",goal:"",notes:"",
     steps:["Definir formato e frequência dos encontros","Escolher os primeiros temas/filmes/jogos","Definir quem conduz os encontros (roteiro pronto da Denise)","Definir preço ou se é benefício para alunos","Planejar divulgação no Instagram"].map((t,k)=>({id:"s"+k,text:t,done:false})),guests:[]},
    {id:"proj_palestras",name:"Palestras com convidados do mundo do inglês",type:"🎤 Palestra / convidados",status:"💡 Ideia",quarter:"Sem data",targetDate:"",
     description:"Palestras com pessoas que estão no mundo do inglês e querem passar conhecimento.",goal:"",notes:"",
     steps:["Listar possíveis convidados","Definir formato (live, Meet, presencial) e duração","Escolher temas das primeiras palestras","Fazer convite padrão para os convidados","Planejar divulgação no Instagram"].map((t,k)=>({id:"s"+k,text:t,done:false})),guests:[]}
  ];
  save(DB,{touch:false});
}
function projProgress(p){ const s=p.steps||[]; return s.length?Math.round(s.filter(x=>x.done).length/s.length*100):0; }
function projPosts(p){ return (DB.ideas||[]).filter(i=>i.projectId===p.id); }

function renderProjects(){
  const box=document.getElementById("projects"); if(!box) return;
  ensureProjects();
  const all=DB.projects;
  const list=all.filter(p=>!PROJ_UI.status||p.status===PROJ_UI.status);
  const guestsOk=all.reduce((a,p)=>a+(p.guests||[]).filter(g=>g.status==="Confirmado"||g.status==="Realizado").length,0);
  const postsCount=all.reduce((a,p)=>a+projPosts(p).length,0);
  const byQ=PROJ_QUARTERS.map(q=>[q,list.filter(p=>(p.quarter||"Sem data")===q)]).filter(([,arr])=>arr.length);
  box.innerHTML=`
  <div class="toolbar" style="justify-content:space-between;align-items:flex-end;margin-bottom:16px">
    <div class="muted">Ideias e projetos para 2027 — do rascunho ao lançamento, com convidados e posts de divulgação ligados ao Instagram.</div>
    <button class="btn primary" onclick="newProject()">+ Novo projeto</button>
  </div>
  <div class="grid" style="margin-bottom:14px">
    <div class="card span3"><div class="muted small">Projetos</div><div class="kpi">${all.length}</div></div>
    <div class="card span3"><div class="muted small">Em andamento</div><div class="kpi">${all.filter(p=>p.status==="🚧 Em andamento").length}</div></div>
    <div class="card span3"><div class="muted small">Convidados confirmados</div><div class="kpi">${guestsOk}</div></div>
    <div class="card span3"><div class="muted small">Posts de divulgação</div><div class="kpi">${postsCount}</div></div>
  </div>
  <div class="pills" style="margin-bottom:14px">${["",...PROJ_STATUS].map(s=>`<button class="pill ${PROJ_UI.status===s?"on":""}" onclick="PROJ_UI.status='${s}';renderProjects()">${s||"Todos"}</button>`).join("")}</div>
  ${byQ.length?byQ.map(([q,arr])=>`<h3 style="margin:18px 0 10px">${q==="Sem data"?"📌 Sem data definida":"🗓️ "+q}</h3><div class="grid">${arr.map(projCardHTML).join("")}</div>`).join(""):`<div class="card muted">Nenhum projeto ${PROJ_UI.status?"com esse status":"ainda"}.</div>`}`;
}
function projCardHTML(p){
  const prog=projProgress(p), posts=projPosts(p), guests=p.guests||[];
  const next=(p.steps||[]).filter(s=>!s.done).slice(0,3);
  return `<div class="card span6 proj-card" onclick="openProject('${p.id}')">
    <div class="toolbar" style="justify-content:space-between;align-items:flex-start;flex-wrap:nowrap">
      <div><h3 style="margin:0 0 6px;font-size:17px">${esc(p.name)}</h3><span class="tag">${esc(p.type)}</span> <span class="tag soft">${esc(p.status)}</span></div>
      <div class="ring" style="--p:${prog}"><span>${prog}%</span></div>
    </div>
    ${p.description?`<div class="muted small" style="margin-top:10px;line-height:1.5">${esc(p.description)}</div>`:""}
    ${next.length?`<div class="small" style="margin-top:10px"><b>Próximos passos</b>${next.map(s=>`<div class="muted">☐ ${esc(s.text)}</div>`).join("")}</div>`:""}
    <div class="proj-foot"><span>🎤 ${guests.length} convidado(s)</span><span>📸 ${posts.length} post(s)</span>${p.targetDate?`<span>🎯 ${dateBR(p.targetDate)}</span>`:""}</div>
  </div>`;
}
function newProject(){
  ensureProjects();
  const p={id:"proj_"+Date.now(),name:"Novo projeto",type:"✨ Outro",status:"💡 Ideia",quarter:"Sem data",targetDate:"",description:"",goal:"",notes:"",steps:[],guests:[]};
  DB.projects.unshift(p); save(); renderProjects(); openProject(p.id,true);
}
var PROJ_OPEN=null;
function openProject(id,isNew){
  const p=projectById(id); if(!p) return;
  PROJ_OPEN=id;
  const opts=(arr,val)=>arr.map(x=>`<option ${x===val?'selected':''}>${x}</option>`).join('');
  const posts=projPosts(p);
  showModal(`<div class="modalhead"><div><input class="title-input" value="${esc(p.name)}" oninput="projSet('name',this.value)" ${isNew?"autofocus":""}><div class="muted small">${projProgress(p)}% concluído · salva automaticamente</div></div><button class="btn" onclick="closeModal()">Concluir</button></div>
  <div class="formgrid">
    <div><label>Tipo</label><select onchange="projSet('type',this.value)">${opts(PROJ_TYPES,p.type)}</select></div>
    <div><label>Status</label><select onchange="projSet('status',this.value)">${opts(PROJ_STATUS,p.status)}</select></div>
    <div><label>Quando (2027)</label><select onchange="projSet('quarter',this.value)">${opts(PROJ_QUARTERS,p.quarter||"Sem data")}</select></div>
    <div><label>Data alvo</label><input type="date" value="${esc(p.targetDate||"")}" onchange="projSet('targetDate',this.value)"></div>
    <div class="full"><label>Descrição / ideia</label><textarea rows="3" oninput="projSet('description',this.value)" placeholder="O que é, como funciona...">${esc(p.description||"")}</textarea></div>
    <div class="full"><label>Público e objetivo</label><textarea rows="2" oninput="projSet('goal',this.value)" placeholder="Para quem é? O que você quer alcançar (alunos novos, renda extra, comunidade...)?">${esc(p.goal||"")}</textarea></div>
  </div>
  <div class="hr"></div>
  <h3>✅ Próximos passos</h3>
  <div class="steps">${(p.steps||[]).map(s=>`<div class="step"><label class="homework-check" style="font-size:13px"><input type="checkbox" ${s.done?"checked":""} onchange="projStep('${s.id}','toggle')"><span style="${s.done?"text-decoration:line-through;opacity:.6":""}">${esc(s.text)}</span></label><button class="btn small" onclick="projStep('${s.id}','del')" title="Remover">✕</button></div>`).join("")||`<div class="muted small">Nenhum passo ainda.</div>`}</div>
  <div class="toolbar" style="margin-top:8px;flex-wrap:nowrap"><input id="newStep" placeholder="Novo passo... (Enter para adicionar)" onkeydown="if(event.key==='Enter')projStep(null,'add')"><button class="btn small" onclick="projStep(null,'add')">Adicionar</button></div>
  <div class="hr"></div>
  <h3>🎤 Convidados / palestrantes / parceiros</h3>
  <div class="guests">${(p.guests||[]).map(g=>`<div class="guest">
      <input value="${esc(g.name||"")}" placeholder="Nome" oninput="projGuest('${g.id}','name',this.value)">
      <input value="${esc(g.topic||"")}" placeholder="Área / tema" oninput="projGuest('${g.id}','topic',this.value)">
      <input value="${esc(g.contact||"")}" placeholder="@ / contato" oninput="projGuest('${g.id}','contact',this.value)">
      <input type="date" value="${esc(g.date||"")}" onchange="projGuest('${g.id}','date',this.value)">
      <select onchange="projGuest('${g.id}','status',this.value)">${opts(GUEST_STATUS,g.status||"A convidar")}</select>
      <button class="btn small" onclick="projGuest('${g.id}','del')">✕</button></div>`).join("")||`<div class="muted small">Adicione as pessoas do mundo do inglês que você quer convidar.</div>`}</div>
  <button class="btn small" style="margin-top:8px" onclick="projGuest(null,'add')">+ Convidado</button>
  <div class="hr"></div>
  <div class="toolbar" style="justify-content:space-between;align-items:center"><h3 style="margin:0">📸 Posts de divulgação</h3><button class="btn small primary" onclick="projNewPost('${p.id}')">+ Post de divulgação</button></div>
  <div style="margin-top:8px">${posts.map(i=>`<div class="row" style="margin-top:6px;cursor:pointer" onclick="closeModal();openIdeaModal('${i.id}')"><div class="main"><b>${esc(i.title)}</b><div class="meta">${esc(i.format)} · ${esc(i.stage)}${i.date?" · "+fmtDateShort(i.date):""}</div></div></div>`).join("")||`<div class="muted small">Nenhum post ligado. Os posts criados aqui aparecem no Instagram e no Calendário.</div>`}</div>
  <div class="hr"></div>
  <label>📝 Anotações livres</label><textarea rows="3" oninput="projSet('notes',this.value)">${esc(p.notes||"")}</textarea>
  <div class="toolbar" style="justify-content:space-between;margin-top:14px"><button class="btn danger" onclick="deleteProject('${p.id}')">Excluir projeto</button><button class="btn primary" onclick="closeModal()">Concluir</button></div>`);
  window.__onModalClose=()=>{ const pr=projectById(id); if(pr){ renderProjects(); Cloud.enqueue("upsertProject",{project:pr}); } PROJ_OPEN=null; };
}
function projSet(field,value){ const p=projectById(PROJ_OPEN); if(!p) return; p[field]=value; save(); }
function projStep(sid,action){
  const p=projectById(PROJ_OPEN); if(!p) return; p.steps=p.steps||[];
  if(action==="add"){ const v=(document.getElementById("newStep")?.value||"").trim(); if(!v) return; p.steps.push({id:"s"+Date.now(),text:v,done:false}); }
  if(action==="toggle"){ const s=p.steps.find(x=>x.id===sid); if(s) s.done=!s.done; }
  if(action==="del"){ p.steps=p.steps.filter(x=>x.id!==sid); }
  save(); reopenProject();
  if(action==="add") setTimeout(()=>document.getElementById("newStep")?.focus(),30);
}
function projGuest(gid,field,value){
  const p=projectById(PROJ_OPEN); if(!p) return; p.guests=p.guests||[];
  if(field==="add"){ p.guests.push({id:"g"+Date.now(),name:"",topic:"",contact:"",date:"",status:"A convidar"}); save(); reopenProject(); return; }
  if(field==="del"){ p.guests=p.guests.filter(g=>g.id!==gid); save(); reopenProject(); return; }
  const g=p.guests.find(x=>x.id===gid); if(g){ g[field]=value; save(); }
}
function reopenProject(){ const id=PROJ_OPEN; const sc=document.getElementById("modal")?.scrollTop||0; window.__onModalClose=null; openProject(id); const md=document.getElementById("modal"); if(md) md.scrollTop=sc; }
function projNewPost(pid){
  const p=projectById(pid); if(!p) return;
  closeModal();
  openIdeaModal(null,{projectId:pid,title:`Divulgação: ${p.name}`,objective:"Converter",pillar:"💼 Negócio",stage:"Ideia"});
}
function deleteProject(id){
  if(!confirm("Excluir este projeto? Os posts ligados continuam no Instagram, sem o vínculo.")) return;
  window.__onModalClose=null;
  DB.projects=DB.projects.filter(p=>p.id!==id);
  DB.ideas.forEach(i=>{ if(i.projectId===id){ i.projectId=""; syncPost(i); } });
  save(); closeModal(); renderProjects(); renderIdeas();
  Cloud.enqueue("deleteItem",{kind:"project",id});
}


function exportBackup(){
  const blob=new Blob([JSON.stringify(DB,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`EWD_backup_${todayISO()}.json`;a.click();URL.revokeObjectURL(a.href);
}
async function importBackup(file){
  if(!file)return;
  let obj;
  try{obj=JSON.parse(await file.text());}catch(e){alert("Não foi possível importar este arquivo.");return;}
  DB=applyCurriculum(ensureGroupData(obj));
  if(!DB.weeklyPlanning)DB.weeklyPlanning={};
  if(!DB.meetingNotes)DB.meetingNotes=[];
  if(!DB.ideas)DB.ideas=[];
  save();renderAll();
  if(Cloud.enabled() && confirm("Backup importado. Enviar também todos os alunos, aulas e meeting notes para as bases do Notion?")) Cloud.syncAll();
  else alert("Backup importado com sucesso.");
}
document.getElementById("importFile").addEventListener("change",e=>importBackup(e.target.files[0]));
function resetData(){
  if(!confirm("Restaurar a base inicial? Isso apaga os registros locais atuais."+(Cloud.enabled()?"\n\nAtenção: a base inicial também substituirá a cópia salva no Notion.":"")))return;
  localStorage.removeItem(STORAGE_KEY);DB=load();save();renderAll();
}
renderAll();
Cloud.init();
</script>
</body>
