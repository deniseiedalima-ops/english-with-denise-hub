<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EWD Studio — Class Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700&family=Quicksand:wght@700&family=Fredoka:wght@600&family=Varela+Round&family=M+PLUS+Rounded+1c:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f8f6f5; --panel:#ffffff; --ink:#38291e; --muted:#81746a; --line:#ebe8e5;
  --accent:#8d6648; --accent2:#fff2e8; --ok:#e8f5e9; --warn:#fff7e6; --bad:#fdecec; --blue:#fff3ea;
}
*{box-sizing:border-box} body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
aside{background:#241c16;color:#fff;padding:22px 16px;position:sticky;top:0;height:100vh}
.brand{font-weight:800;font-size:20px;margin:0 0 4px}.sub{font-size:12px;color:#c1b6ad;margin-bottom:22px}
nav button{width:100%;text-align:left;background:transparent;border:0;color:#e4dcd6;padding:11px 12px;border-radius:10px;margin:3px 0;cursor:pointer}
nav button.active,nav button:hover{background:#3b3129;color:#fff}
main{padding:26px;max-width:1500px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:12px}
h1{font-size:28px;margin:0} h2{font-size:20px;margin:0 0 14px} h3{font-size:16px;margin:0 0 8px}
.muted{color:var(--muted)} .small{font-size:12px}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.span12{grid-column:span 12}.span8{grid-column:span 8}.span6{grid-column:span 6}.span4{grid-column:span 4}.span3{grid-column:span 3}
.kpi{font-size:30px;font-weight:800;margin-top:4px}
.list{display:flex;flex-direction:column;gap:9px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px;border:1px solid var(--line);border-radius:12px;background:#fff}
.row .main{min-width:0}.row .title{font-weight:700}.row .meta{font-size:12px;color:var(--muted);margin-top:3px}
.badge{display:inline-flex;align-items:center;padding:4px 8px;border-radius:999px;font-size:12px;font-weight:700;background:#f7f2ee}
.badge.a1{background:#fff2cc}.badge.a2{background:#fff1e6}.badge.b1{background:#fff2e8}.badge.conv{background:#e8f5e9}
.btn{border:1px solid var(--line);background:#fff;padding:9px 12px;border-radius:10px;cursor:pointer}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)} .btn.danger{background:#fff;color:#b91c1c}
.btn.small{padding:6px 8px;font-size:12px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff}
textarea{min-height:82px;resize:vertical}
label{display:block;font-size:12px;font-weight:700;margin-bottom:5px;color:#64554a}
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.formgrid .full{grid-column:1/-1}
.statuses{display:flex;gap:8px;flex-wrap:wrap}
.status{padding:9px 11px;border:1px solid var(--line);background:#fff;border-radius:10px;cursor:pointer}
.status.selected{outline:2px solid var(--accent);background:var(--accent2)}
.progress{display:flex;gap:8px;flex-wrap:wrap}.progress button{flex:1;min-width:70px}
.section{display:none}.section.active{display:block}
.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;vertical-align:top}
.table th{font-size:12px;color:#81746a}
.lesson-detail{background:#fafafa;border:1px dashed var(--line);border-radius:12px;padding:12px;margin-top:10px}
.notice{padding:11px 12px;border-radius:10px;background:var(--warn);font-size:13px}
.ok{background:var(--ok)} .dangerbox{background:var(--bad)} .blue{background:var(--blue)}
.searchbar{display:flex;gap:8px;margin-bottom:12px}.searchbar input{flex:1}
.modalback{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
.modalback.show{display:flex}.modal{background:#fff;width:min(760px,100%);max-height:90vh;overflow:auto;border-radius:18px;padding:18px}
.modalhead{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:14px}
.hr{height:1px;background:var(--line);margin:14px 0}
.warm-suggestion{border-left:4px solid var(--accent);padding-left:10px}
@media(max-width:900px){.app{grid-template-columns:1fr}aside{position:relative;height:auto}nav{display:flex;overflow:auto}nav button{min-width:max-content}main{padding:16px}.span8,.span6,.span4,.span3{grid-column:span 12}.formgrid{grid-template-columns:1fr}}
.history-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:800px){.history-summary{grid-template-columns:repeat(2,1fr)}}

.planning-day{margin-bottom:18px;overflow:hidden}
.planning-day-title{padding:16px 18px;border-bottom:1px solid #ebe8e5;display:flex;align-items:center;justify-content:space-between}
.planning-day-title h3{margin:0 0 3px}
.time-cell{white-space:nowrap;width:100px}

.member-fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.member-field{background:#fbf9f7;border:1px solid #ece7e4;border-radius:10px;padding:10px}
.member-field label{margin-bottom:6px}
@media(max-width:760px){.member-fields{grid-template-columns:1fr}}

.student-edit-btn{white-space:nowrap}

.homework-line{margin-top:8px}
.homework-check{display:inline-flex;align-items:center;gap:6px;margin-right:12px;font-size:12px;cursor:pointer}
.homework-check input{width:16px;height:16px;cursor:pointer}
.homework-check input:checked + span{font-weight:700}
.homework-group{display:flex;flex-wrap:wrap;gap:4px 8px}

.today-title-line{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.today-homework-inline{margin-left:auto;display:inline-flex;align-items:center}
.homework-check{white-space:nowrap}
</style>
<style>
.member-attendance{display:flex;flex-direction:column;gap:10px}
.member-attendance-row{border:1px solid var(--border,#ddd);border-radius:14px;padding:12px;background:#fff}
.member-statuses{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}
.member-statuses .status{font-size:14px;padding:8px 10px}
@media(max-width:800px){.member-statuses .status{flex:1 1 140px}}

.curriculum-note{padding:10px 12px;border:1px dashed var(--accent);border-radius:10px;background:var(--accent2);color:var(--ink);font-size:12px;margin:10px 0}
@media(max-width:850px){.app{grid-template-columns:1fr}aside{position:relative;height:auto;padding:14px}nav{display:flex;overflow-x:auto;gap:5px}nav button{white-space:nowrap;width:auto;flex:0 0 auto}main{padding:16px}}
</style>

<style id="ewd-aesthetic-refresh">
:root{
  --bg:#f7f5f2;--panel:#fffefa;--ink:#45392f;--muted:#958b83;--line:#ebe6e1;
  --accent:#ab8365;--accent2:#f8f0e9;--ok:#eaf4ed;--warn:#fbf2df;--bad:#faeaea;--blue:#f9f2ec;
  --lavender:#f3e8df;--rose:#f5e6e8;--sage:#e8eee6;--cream:#fffefa;
  --shadow:0 12px 35px rgba(73,55,42,.065);
}
body{background:var(--bg);color:var(--ink);font-family:Inter,"Aptos",system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:-.01em}
.app{grid-template-columns:252px minmax(0,1fr);gap:0}
aside{
  background:linear-gradient(180deg,#f5ede6 0%,#f3f0ed 48%,#f2eee8 100%);
  color:#52443a;padding:28px 18px;box-shadow:inset -1px 0 #ebe4de;
}
.brand{font-family:Georgia,serif;font-size:27px;letter-spacing:-.06em;color:#785e4b;margin:4px 8px 3px}
.sub{color:#95897f;font-size:11px;line-height:1.55;margin:0 8px 28px}
nav{display:flex;flex-direction:column;gap:6px}
nav button{
  display:flex;align-items:center;gap:10px;text-align:left;width:100%;border:1px solid transparent;
  color:#7c7066;padding:12px 13px;border-radius:13px;margin:0;background:transparent;
  font-size:13px;font-weight:650;transition:all .2s ease
}
nav button:hover{background:#ffffffa8;color:#725b49;transform:translateX(2px)}
nav button.active{background:#fffefa;color:#7a5e49;border-color:#eee5de;box-shadow:0 5px 16px #7c645212}
main{padding:34px clamp(20px,3vw,48px) 60px;max-width:1700px;width:100%}
.topbar{padding:0 0 22px;margin-bottom:24px;border-bottom:1px solid #e9e3df}
h1{font-family:Georgia,"Times New Roman",serif;font-weight:500;font-size:34px;letter-spacing:-.045em;color:#45392f}
h2{font-family:Georgia,serif;font-weight:500;font-size:23px;letter-spacing:-.025em;color:#504135;margin-bottom:16px}
h3{font-size:15px;font-weight:750;color:#51453b}
.muted{color:var(--muted)}
.card{background:var(--panel);border:1px solid #ece6e2;border-radius:19px;padding:21px;box-shadow:var(--shadow);transition:transform .2s ease,box-shadow .2s ease}
.card:hover{box-shadow:0 15px 38px rgba(73,55,42,.09)}
.kpi{font-family:Georgia,serif;font-size:35px;font-weight:500;color:#7b5f49;margin-top:5px}
.badge{border-radius:999px;padding:5px 10px;font-size:10px;letter-spacing:.04em}
.badge.a1{background:#f8efd9;color:#90723b}.badge.a2{background:#f4ede7;color:#856953}
.badge.b1{background:#f6ede6;color:#906f55}.badge.conv{background:#e8eee6;color:#62795f}
.btn{border:1px solid #ece4de;background:#fffefa;color:#7b6656;padding:9px 14px;border-radius:999px;font-size:12px;font-weight:700;transition:all .18s ease}
.btn:hover{border-color:#dec9b9;background:#fbf7f4;transform:translateY(-1px)}
.btn.primary{background:#977760;color:#fff;border-color:#977760;box-shadow:0 5px 14px #97776025}
.btn.primary:hover{background:#81654f;box-shadow:0 8px 18px #97776035}
.btn.danger{color:#b65e67;background:#fff8f7;border-color:#f0dada}
.row{background:#fffefa;border:1px solid #eee8e4;border-radius:15px;padding:14px 15px;transition:border-color .18s,transform .18s}
.row:hover{border-color:#e4d5ca;transform:translateY(-1px)}
.row .title{font-size:13px;color:#4e4239}
.row .meta{font-size:11px;color:#96909b}
input,select,textarea{border:1px solid #e9e4e0;border-radius:11px;background:#fffefa;color:#473b32;padding:11px 12px;outline:none;transition:border-color .18s,box-shadow .18s}
input:focus,select:focus,textarea:focus{border-color:#c6ab96;box-shadow:0 0 0 3px #f6ede6}
label{color:#7c7066;font-size:11px;letter-spacing:.015em}
textarea{min-height:100px}
.status{border:1px solid #ece5e0;border-radius:999px;background:#fffefa;color:#81766d;padding:9px 13px;font-size:11px;font-weight:650}
.status.selected{outline:0;border-color:#ba9a82;background:#f8f0e9;color:#80624b;box-shadow:inset 0 0 0 1px #dec9b9}
.notice{border-radius:13px;padding:13px 15px;border:1px solid #efe5d1;background:#fbf5e8;color:#736344}
.notice.blue{background:#f7f2ef;border-color:#eee6e0;color:#7b6b5e}
.notice.ok{background:#edf4ed;border-color:#dfeade;color:#5d745d}
.lesson-detail{background:#faf7f5;border:1px solid #f1e9e2;border-radius:13px;padding:14px;color:#7e7065}
.tablewrap{border:1px solid #ece6e2;border-radius:16px;background:#fffefa}
.table{border-collapse:separate;border-spacing:0}
.table th{background:#f8f5f3;color:#84766b;font-size:10px;text-transform:uppercase;letter-spacing:.07em}
.table td{color:#5b5047;border-bottom:1px solid #f0ebe7}
.modalback{background:rgba(58,47,38,.38);backdrop-filter:blur(7px);padding:24px}
.modal{background:#fffefa;border:1px solid #eee7e1;border-radius:23px;padding:26px;box-shadow:0 25px 90px #3c2e2330}
.modalhead{padding-bottom:15px;border-bottom:1px solid #eee8e3}
.modalhead h2{margin:0 0 4px;font-size:25px}
.hr{background:#eee8e3;margin:18px 0}
.formgrid{gap:15px}
.formgrid>div{min-width:0}
.formgrid .full{grid-column:1/-1}
.statuses,.progress{gap:7px}
.progress button{min-width:65px}
.homework-check{color:#8d8177;font-size:11px}
.homework-check input{accent-color:#ab8365}
.member-attendance-row{background:#fcfaf9;border-color:#f2ebe7;border-radius:13px}
.member-field{background:#f8f6f5;border-color:#efeae6}
.searchbar{align-items:center}
.searchbar input{border-radius:999px;padding:12px 17px}
.history-summary{gap:13px}
.planning-day{border:1px solid #ece6e2;border-radius:19px;background:#fffefa}
.planning-day-title{background:#faf8f7;border-color:#efeae7;padding:18px 20px}
.section{animation:ewdFade .28s ease}
@keyframes ewdFade{from{opacity:.3;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
/* Today view: clear schedule cards and quick actions */
#today .grid>.card.span3{background:linear-gradient(145deg,#fffefa,#f8f5f2);min-height:112px}
#today .grid>.card.span3:nth-child(2){background:linear-gradient(145deg,#fffefa,#f8f0ee)}
#today .grid>.card.span3:nth-child(3){background:linear-gradient(145deg,#fffefa,#f0f4ed)}
#today .grid>.card.span3:nth-child(4){background:linear-gradient(145deg,#fffefa,#f7f4f1)}
#today .card.span12>.list{gap:10px}
#today .row{align-items:center;gap:16px}
#today .row .main{flex:1}
#today .row .btn{flex:0 0 auto}
#today .today-title-line{gap:8px}
#today .today-homework-inline{margin-left:8px}
#today .homework-check{background:#f8f5f3;padding:6px 9px;border-radius:999px}
#today .card.span12{margin-top:2px}
/* Make registration modal feel like a focused workspace */
#modal .formgrid>div{background:#fcfbfa;border:1px solid #f0edea;border-radius:13px;padding:12px}
#modal .formgrid>div.full{background:#fcfbfa}
#modal .formgrid label{display:block;margin-bottom:7px}
#modal .formgrid input,#modal .formgrid select,#modal .formgrid textarea{background:#fff}
#modal #rLesson{min-height:150px;border-radius:12px}
#modal .member-attendance-row{margin-bottom:8px}
#modal .toolbar{justify-content:flex-end;padding-top:14px;border-top:1px solid #eee8e3}
#modal .toolbar .btn.primary{padding:12px 22px;font-size:13px}
@media(max-width:900px){
 .app{grid-template-columns:1fr}
 aside{position:relative;height:auto;padding:16px 18px}
 .brand{font-size:24px}
 .sub{margin-bottom:12px}
 nav{display:flex;flex-direction:row;overflow-x:auto;gap:5px;padding-bottom:3px}
 nav button{white-space:nowrap;width:auto;flex:0 0 auto;padding:10px 12px}
 main{padding:22px 16px 45px}
}
@media(max-width:600px){
 h1{font-size:29px}
 .topbar{align-items:flex-start;flex-direction:column}
 .toolbar{width:100%}
 .toolbar .btn{flex:1}
 .card{padding:16px;border-radius:16px}
 #today .row{align-items:flex-start;flex-direction:column}
 #today .row>.btn{width:100%}
 #today .today-title-line{align-items:flex-start;flex-direction:column}
 #today .today-homework-inline{margin-left:0}
 .modalback{padding:8px}
 .modal{padding:17px;border-radius:17px;max-height:95vh}
 .formgrid{grid-template-columns:1fr}
 .formgrid .full{grid-column:1}
 .member-statuses .status{flex:1 1 130px}
}
@media(prefers-reduced-motion:reduce){.section{animation:none}*{transition:none!important}}
</style>


<style id="ewd-inactive-students">
.admin-section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.admin-section-head h2{margin:0 0 4px}
.pill-count{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:30px;padding:0 10px;border-radius:99px;background:#f8f0e9;color:#866a54;font-size:12px;font-weight:800}
.admin-student-list{display:grid;gap:9px}
.admin-student-row{display:flex;align-items:center;justify-content:space-between;gap:14px}
.admin-student-main{min-width:0;flex:1}
.admin-student-main b{font-size:13px;color:#51453b}
.admin-student-row .btn{white-space:nowrap}
@media(max-width:600px){.admin-student-row{align-items:flex-start}.admin-student-row .btn{padding:8px 10px}}
</style>

<style id="ewd-manual-makeups">
#today .card .toolbar h2{font-family:Georgia,serif}
#makeups .tablewrap{overflow-x:auto}
#makeups table{min-width:760px;width:100%}
#makeups .toolbar{gap:12px;flex-wrap:wrap}
</style>
<style id="ewd-cloud-recorder">
.cloud-chip{white-space:nowrap}
.cloud-chip.ok{background:#edf4ed;border-color:#cfe3cf;color:#4f6d4f}
.cloud-chip.busy{background:#f8f0e9;border-color:#e9d7ca;color:#80624b}
.cloud-chip.err{background:#fff3f2;border-color:#f0cfcf;color:#a2525b}

.rec-live{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:12px 0}

a.btn{text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.meet-btn{background:#e9f4ee!important;border-color:#cfe6d8!important;color:#3f7356!important}

.note-card summary{cursor:pointer;font-size:12px;color:#977760;font-weight:700}
.note-card .transcript{white-space:pre-wrap;font-size:12px;color:#695c52;max-height:320px;overflow:auto;background:#fbf9f7;border-radius:10px;padding:10px;margin-top:6px}
.today-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.stack{display:flex;flex-direction:column;gap:12px}

.kcard:hover{transform:translateY(-2px);box-shadow:0 8px 20px #49372a1c}
.ktitle{font-weight:750;font-size:14px;color:#483c32;margin-bottom:8px;line-height:1.3}
.kmeta{display:flex;gap:7px;align-items:center;flex-wrap:wrap;font-size:12px;color:#897c72}
.kproj{margin-top:8px;font-size:11px;color:#866a54;background:#f9f2ed;border-radius:8px;padding:4px 7px;display:inline-block}
.kadd{display:block;width:100%;border:0;background:transparent;color:#a18f82;font-size:14px;padding:10px;cursor:pointer;border-radius:12px}
.kadd:hover{background:#ffffff80}
.fmt{display:inline-flex;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;background:#f6ede6;color:#866a54}

  data.records.forEach(r=>{
    if(!Array.isArray(r.attendance)){
      const members = String(r.student||"").split("+").map(x=>x.trim()).filter(Boolean);
      const names = members.length ? members : [r.student];
      r.attendance = names.map(name=>({name,status:r.status}));

      if((r.note||"").toLowerCase().includes("geovanna") && (r.note||"").toLowerCase().includes("faltou")){

function getMondayISO(d=new Date()){
  const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  const day=x.getDay();
  x.setDate(x.getDate()+(day===0?-6:1-day));
  return localISO(x);
}
function addDaysISO(iso,days){
  const d=new Date(iso+"T12:00:00");
  d.setDate(d.getDate()+days);
  return localISO(d);
}
function planningKey(week,s){
  return `${week}|${s.name}|${s.day}|${s.time}`;
}
function savePlanningValue(key,field,value){
  if(!DB.weeklyPlanning) DB.weeklyPlanning={};
  if(!DB.weeklyPlanning[key]) DB.weeklyPlanning[key]={lesson:"",notes:""};
  DB.weeklyPlanning[key][field]=value;
  save();
}
function carryPlanningForward(){
  const week=document.getElementById("planningWeek")?.value || getMondayISO();
  const prev=addDaysISO(week,-7);
  DB.students.forEach(s=>{
    const oldKey=planningKey(prev,s), newKey=planningKey(week,s);
    if(DB.weeklyPlanning?.[oldKey] && !DB.weeklyPlanning?.[newKey]){
      DB.weeklyPlanning[newKey]=JSON.parse(JSON.stringify(DB.weeklyPlanning[oldKey]));
    }
  });
  save(); renderPlanning();
}
function clearPlanningWeek(){
  const week=document.getElementById("planningWeek")?.value || getMondayISO();
  if(!confirm("Limpar todas as sugestões desta semana?")) return;
  Object.keys(DB.weeklyPlanning||{}).forEach(k=>{if(k.startsWith(week+"|")) delete DB.weeklyPlanning[k]});
  save(); renderPlanning();
}
function renderPlanning(){
  if(typeof planning==="undefined") return;
  const week=document.getElementById("planningWeek")?.value || getMondayISO();
  const order=["Segunda","Terça","Quarta","Quinta","Sexta","Sábado","Domingo"];
  const list=[...DB.students].sort((a,b)=>{
    const da=order.indexOf(a.day), db=order.indexOf(b.day);
    return da!==db ? da-db : (a.time||"").localeCompare(b.time||"");
  });

  const daySections=order.map(day=>{
    const dayStudents=list.filter(s=>s.day===day);
    if(!dayStudents.length) return "";

    const rows=dayStudents.map(s=>{
      const key=planningKey(week,s);
      const p=DB.weeklyPlanning?.[key]||{lesson:"",notes:""};
      const hist=studentHistory(s.name), last=hist[0];
      const lastLesson=last?.lesson || s.last || "Sem registro";
      const lastProgress=last?.progress ?? s.progress ?? 0;

      return `<tr>
        <td class="time-cell"><b>${esc(s.time)}</b></td>
        <td><b>${esc(s.name)}</b><br>${badge(s.level)} <span class="muted small">${esc(s.group||"")}</span></td>
        <td>${esc(lastLesson)}${lastProgress?` <span class="muted">· ${lastProgress}%</span>`:""}</td>
        <td style="min-width:320px"><input value="${esc(p.lesson||"")}" placeholder="Ex.: 3A — Talk about routines / aula personalizada" oninput='savePlanningValue(${JSON.stringify(key)},"lesson",this.value)'></td>
        <td style="min-width:240px"><input value="${esc(p.notes||"")}" placeholder="Warm-up, material, observação..." oninput='savePlanningValue(${JSON.stringify(key)},"notes",this.value)'></td>
      </tr>`;
    }).join("");

    return `
      <div class="planning-day card">
        <div class="planning-day-title">
          <div>
            <h3>📅 ${esc(day)}</h3>
            <span class="muted small">${dayStudents.length} aluno(s)/turma(s)</span>
          </div>
        </div>
        <div class="tablewrap">
          <table class="table">
            <thead>
              <tr>
                <th>Horário</th>
                <th>Aluno(s)</th>
                <th>Última aula</th>
                <th>Planning Class — aula pensada</th>
                <th>Observações</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      </div>`;
  }).join("");

  planning.innerHTML=`
    <div class="card" style="margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-end;flex-wrap:wrap">
        <div>
          <h2>Sugestão de Aulas da Semana</h2>
          <div class="muted">Seu Planning Class semanal, separado por dia. As anotações são salvas automaticamente neste computador.</div>
        </div>
        <div class="toolbar">
          <div><label>Semana iniciando em</label><input id="planningWeek" type="date" value="${week}" onchange="renderPlanning()" style="min-width:170px"></div>
          <button class="btn" onclick="carryPlanningForward()">↪️ Copiar semana anterior</button>
          <button class="btn danger" onclick="clearPlanningWeek()">Limpar semana</button>
        </div>
      </div>
    </div>
    ${daySections}`;
}


let assessmentDraft={student:"",level:"A1",assessmentTitle:"Avaliação de Nível",date:localISO(),aScore:"",aMax:"50",aFeedback:"",bScore:"",bMax:"20",bFeedback:"",cScore:"",cMax:"20",cFeedback:"",attention:"",direction:"",general:"",practiceTitle:"",practiceBefore:"",practiceQuestions:"",homeworkAttention:"",homeworkInstructions:""};

function calcAssessmentTotal(){let x=[["aScore","aMax"],["bScore","bMax"],["cScore","cMax"]].map(([s,m])=>({s:parseFloat(assessmentDraft[s]),m:parseFloat(assessmentDraft[m])})).filter(x=>!isNaN(x.s)&&!isNaN(x.m)&&x.m>0);return{x:x,total:x.reduce((a,y)=>a+y.s,0),max:x.reduce((a,y)=>a+y.m,0)}}
function setAssessmentField(f,v){assessmentDraft[f]=v;let t=calcAssessmentTotal(),e=document.getElementById("assessmentTotalPreview");if(e)e.textContent=t.max?`${t.total}/${t.max} pontos`:""}

function assessmentSection(title,s,max,fb){return`<h2>${title}</h2>${s!==""?`<p><b>● Pontuação:</b> ${esc(s)}/${esc(max)} pts</p>`:""}${fb?`<p>${esc(fb).replace(/\n/g,"<br>")}</p>`:""}`}

function openAddMakeup(){
  const options=DB.students.map(s=>`<option value="${esc(s.name)}">${esc(s.name)} · ${esc(s.level)} · ${esc(s.day)} ${esc(s.time)}</option>`).join("");
  showModal(`<div class="modalhead"><div><h2>Adicionar reposição</h2><div class="muted">Agende manualmente uma reposição e a aula correspondente.</div></div><button class="btn" onclick="closeModal()">Fechar</button></div>

      <div><label>Data da reposição</label><input id="mDate" type="date" value="${todayISO()}"></div>
      <div><label>Aluno / turma</label><select id="mStudent">${options}</select></div>
      <div class="full"><label>Aula da reposição</label><input id="mLesson" placeholder="Ex.: 8C — What's Everyone Doing? / revisão de Simple Past"></div>
      <div class="full"><label>Observações</label><textarea id="mNote" placeholder="Horário combinado, motivo, conteúdo ou outras informações..."></textarea></div>

    <div class="toolbar" style="justify-content:flex-end;margin-top:16px"><button class="btn primary" onclick="saveManualMakeup()">Salvar reposição</button></div>`);

function saveManualMakeup(){
  const date=document.getElementById("mDate")?.value;
  const student=document.getElementById("mStudent")?.value;
  const lesson=document.getElementById("mLesson")?.value.trim();
  const note=document.getElementById("mNote")?.value.trim();
  if(!date||!student||!lesson){alert("Informe a data, o aluno/turma e a aula da reposição.");return;}
  const st=DB.students.find(x=>x.name===student);
  const rec={
    id:Date.now(),date,student,
    schedule:st?`${st.name}|${st.day}|${st.time}`:student,
    status:"🔄 Rep. Pendente",warmup:"",lesson,progress:100,stoppedAt:"",
    homeworkDone:"❌ Não",note,manualMakeup:true,makeupDate:date
  };
  DB.records.unshift(rec);
  save();closeModal();renderAll();
  Cloud.enqueue("upsertRecord",{record:rec});
}
function renderMakeups(){
  const rec=(DB.records||[]).filter(r=>r.status.includes("Rep."));
  makeups.innerHTML=`<div class="toolbar" style="margin-bottom:14px;justify-content:space-between"><div><h2 style="margin:0">Reposições</h2><div class="muted small">Agende reposições manualmente e registre qual aula será trabalhada.</div></div><button class="btn primary" onclick="openAddMakeup()">+ Adicionar reposição</button></div>

  </tbody></table></div>`;
}

function completeMakeup(id){
  const r=(DB.records||[]).find(x=>x.id===id);
  if(!r)return;
  r.status="✔️ Rep. Feita";
  r.makeupDate=todayISO();
  if(Array.isArray(r.attendance)) r.attendance.forEach(a=>{if(a.status==="🔄 Rep. Pendente")a.status="✔️ Rep. Feita"});
  save(); renderAll();
  Cloud.enqueue("upsertRecord",{record:r});
}

var TR = {key:"",title:"",week:"",date:"",transcript:"",summary:"",teacher:"",roles:{},lang:"auto",reports:{},editingId:null,generating:false,summarizing:false,status:""};

function normalizeMeet(v){
  v=String(v||"").trim();
  if(!v) return "";
  if(/^[a-z]{3}-[a-z]{4}-[a-z]{3}$/i.test(v)) return "https://meet.google.com/"+v.toLowerCase();
  if(!/^https?:\/\//i.test(v)) v="https://"+v;
  try{ const u=new URL(v); return u.protocol.startsWith("http")?u.href:null; }catch(e){ return null; }
}
function recStudent(){ return DB.students.find(s=>studentKey(s)===TR.key) || null; }
function recDefaults(){ if(!TR.week) TR.week=getMondayISO(); if(!TR.date) TR.date=todayISO(); }
function trReset(){ Object.assign(TR,{title:"",week:"",date:"",transcript:"",summary:"",teacher:"",roles:{},lang:"auto",reports:{},editingId:null,generating:false,summarizing:false,status:""}); }
function startClassRecording(key){ // nome mantido: botão "Registrar aula" do Início
  if(TR.key!==key && (TR.transcript||TR.teacher) && !confirm("Há um rascunho não salvo. Descartar e começar outra aula?")){ go("meeting"); return; }
  if(TR.key!==key) trReset();
  TR.key=key;
  const s=recStudent();
  if(s && !TR.title){ const plan=DB.weeklyPlanning?.[planningKey(getMondayISO(),s)]?.lesson; TR.title=(plan||"").trim() || `Aula — ${s.name}`; }
  go("meeting");
  setTimeout(()=>document.getElementById("recPanel")?.scrollIntoView({behavior:"smooth",block:"start"}),60);
}

function parseTranscript(text){

  const isStamp=l=>/^\s*(\d{1,2}:)?\d{1,2}:\d{2}([.,]\d+)?(\s*-->\s*(\d{1,2}:)?\d{1,2}:\d{2}([.,]\d+)?)?\s*$/.test(l)||/^\s*\d+\s*$/.test(l)||/^WEBVTT/i.test(l);
  for(let raw of lines){
    let l=raw.trim(); if(!l||isStamp(l)) continue;
    let m=l.match(/^<v\s+([^>]+)>(.*)$/i);
    if(m){ cur={speaker:m[1].trim(),text:m[2].replace(/<\/v>/i,"").trim()}; turns.push(cur); continue; }
    m=l.match(/^(?:\[?\d{1,2}:\d{2}(?::\d{2})?\]?\s*)?([A-Za-zÀ-ÿ][A-Za-zÀ-ÿ.'\- ]{0,40}?)\s*:\s+(.+)$/);
    if(m && m[1].trim().split(/\s+/).length<=5 && !/^(https?|obs|nota|ps)$/i.test(m[1].trim())){ cur={speaker:m[1].trim(),text:m[2].trim()}; turns.push(cur); continue; }
    if(cur) cur.text+=" "+l; else turns.push(cur={speaker:"",text:l});
  }
  const counts={}; turns.forEach(t=>{ if(t.speaker) counts[t.speaker]=(counts[t.speaker]||0)+1; });
  const speakers=Object.keys(counts).filter(s=>counts[s]>=1).sort((a,b)=>counts[b]-counts[a]);
  const labeled=speakers.length>0 && turns.filter(t=>t.speaker).length>=turns.length*0.6;
  return {turns:labeled?turns.filter(t=>t.speaker):turns.map(t=>({speaker:"",text:t.text})),speakers:labeled?speakers:[],counts,labeled};
}

function wordsOf(t){ return (String(t||"").toLowerCase().match(/[a-zà-ÿ]+(?:'[a-z]+)?/g)||[]); }
function langTag(turnWords){
  let pt=0,en=0; turnWords.forEach(w=>{ if(AMBIG.has(w)) return; if(PT_WORDS.has(w)||/[ãõçáéíóúâêôà]/.test(w)) pt++; else if(EN_WORDS.has(w)||w.includes("'")) en++; });
  const fallback=pt>en?"pt":"en";
  return turnWords.map(w=>{ if(PT_WORDS.has(w)||/[ãõçáéíóúâêôà]/.test(w)) return "pt"; if(EN_WORDS.has(w)||w.includes("'")) return "en"; return fallback; });

function computeStats(parsed,speakerNames){
  const names=new Set(speakerNames||[]);
  const exclude=new Set(); (parsed.speakers||[]).forEach(s=>wordsOf(s).forEach(w=>exclude.add(w)));
  let total=0, mine=0, pt=0, en=0, turns=0, questions=0, longest=0; const freq={}, uniq=new Set();
  parsed.turns.forEach(t=>{
    const ws=wordsOf(t.text); total+=ws.length;
    const isMine=parsed.labeled?names.has(t.speaker):true; if(!isMine) return;
    turns++; mine+=ws.length; longest=Math.max(longest,ws.length); questions+=(t.text.match(/\?/g)||[]).length;
    const tags=String(t.text).split(/[.,!?;:…"“”()]+/).flatMap(cl=>langTag(wordsOf(cl)));
    ws.forEach((w,i)=>{ if(tags[i]==="pt"){ pt++; return; } en++; if(exclude.has(w)) return; uniq.add(w); if(w.length>=3&&!EN_STOP.has(w)) freq[w]=(freq[w]||0)+1; });
  });
  const topWords=Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,14);
  return {speakersKnown:parsed.labeled, talkShare:parsed.labeled&&total?Math.round(mine/total*100):null, ptPct:pt+en?Math.round(pt/(pt+en)*100):0,
    enWords:en, uniqueWords:uniq.size, turns:parsed.labeled?turns:null, avgTurn:parsed.labeled&&turns?Math.round(mine/turns):null, questions:parsed.labeled?questions:null, longest:parsed.labeled?longest:null, topWords, totalWords:mine};
}

function guessRole(speaker,members){
  const n=normName(speaker);
  if(/\bdenise\b/.test(n)||/teacher|professora/.test(n)) return "teacher";
  const tok=n.split(/\s+/);
  let best="",bs=0; members.forEach(m=>{ const mt=normName(m).split(/\s+/); let sc=mt.filter(x=>tok.includes(x)).length*2; if(mt[0]&&tok[0]&&mt[0].slice(0,4)===tok[0].slice(0,4)) sc+=1; if(sc>bs){bs=sc;best=m;} });
  return bs>=2?best:"";
}

async function trGenerate(){
  TR.transcript=(document.getElementById("recTranscript")?.value||TR.transcript||"").trim();
  if(TR.transcript.length<80){ alert("Cole a transcrição da aula primeiro."); return; }
  if(!Cloud.enabled()){ openCloudSettings(); return; }
  const p=trAutoRoles(), list=trStudentsInReport(p);
  if(!list.length){ alert("Indique quem é cada participante (pelo menos um aluno)."); renderMeetingNotes(); return; }
  TR.generating=true; TR.status=`A IA está lendo a aula e escrevendo ${list.length>1?`os ${list.length} relatórios`:"o relatório"}… (leva de 20 a 60 segundos)`; renderMeetingNotes();
  try{
    const langs=[...new Set(list.map(x=>reportLang(x.name)))];
    for(const lang of langs){
      const grp=list.filter(x=>reportLang(x.name)===lang);
      const students=grp.map(x=>{ const prev=lastReportOf(x.name,TR.editingId); return {name:x.name,speaker:x.speakers.join(" / "),level:levelOfMember(x.name),previous:prev?JSON.stringify({date:prev.date,scores:prev.ai?.scores,errors:(prev.ai?.errors||[]).slice(0,6),headline:prev.ai?.headline}):""}; });
      const r=await Cloud.call("feedback",{transcript:TR.transcript,students,lesson:TR.title,lang});
      grp.forEach(x=>{ const kk=Object.keys(r.reports||{}).find(k=>normName(k)===normName(x.name))||(grp.length===1?Object.keys(r.reports||{})[0]:""); const ai=(kk&&r.reports[kk])||{};
        const old=TR.reports[x.name]||{};
        TR.reports[x.name]={student:x.name,level:levelOfMember(x.name),date:TR.date,lesson:TR.title,lang,stats:computeStats(p,x.speakers),ai,public:old.public||null}; });
    }
    TR.status="Pronto! Revise os relatórios abaixo e clique em Salvar.";
  }catch(e){ TR.status="Não foi possível gerar: "+e.message; }
  TR.generating=false; renderMeetingNotes();
}

function resendMeeting(id){
  const n=(DB.meetingNotes||[]).find(x=>x.id===id); if(!n) return;
  if(!n.transcript && n.transcriptInNotion){ alert("Esta nota já está no Notion."); return; }
  Cloud.enqueue("saveMeeting",{meeting:n});
}
function copyMeetingNote(id){
  const n=(DB.meetingNotes||[]).find(x=>x.id===id);if(!n)return;
  const text=`# ${n.student||"Meeting geral"}\n**Data:** ${dateBR(n.date||n.week)}\n**Aula:** ${n.title||"Sem título"}\n\n## Resumo\n${n.summary||"—"}\n\n## Transcrição\n${n.transcript||"(no Notion)"}\n\n## Observações da professora\n${n.teacherNotes||"—"}`;
  navigator.clipboard.writeText(text).then(()=>alert("Texto copiado!")).catch(()=>prompt("Copie o texto abaixo:",text));
}
function deleteMeetingNote(id){
  if(!confirm("Excluir este registro? Ele também será arquivado no Notion e os links de relatório deixam de funcionar."))return;
  const gone=(DB.meetingNotes||[]).find(x=>x.id===id); Object.values(gone?.reports||{}).forEach(r=>{ if(r.public?.pageId) Cloud.notion("unpublishReport",{pageId:r.public.pageId}).catch(()=>{}); });
  DB.meetingNotes=(DB.meetingNotes||[]).filter(x=>x.id!==id);save();renderMeetingNotes();
  Cloud.enqueue("deleteMeeting",{id});
}

/* ================= Sincronização com o Notion (via funções seguras da Vercel) ================= */
var Cloud = {
  pw: localStorage.getItem("ewd_cloud_pw")||"",
  state:"off", msg:"", lastPing:null,
  queue: (()=>{ try{return JSON.parse(localStorage.getItem("ewd_cloud_queue")||"[]")}catch(e){return []} })(),
  dropped: [],
  pushTimer:null, pushing:false, pushAgain:false, processing:false,
  enabled(){ return !!this.pw; },
  async call(path, body){
    let r;
    try{
      r = await fetch("/api/"+path,{method:"POST",headers:{"Content-Type":"application/json","x-ewd-password":this.pw},body:JSON.stringify(body)});
    }catch(e){ throw new Error("Sem conexão com a internet."); }
    let data=null; try{ data=await r.json(); }catch(e){}
    if(!data){
      if(r.status===404) throw new Error("Funções da Vercel não encontradas. Publique a pasta “api” junto com o index.html.");
      if(r.status===413) throw new Error("Arquivo grande demais para a Vercel.");
      throw new Error("Resposta inválida do servidor ("+r.status+").");
    }
    if(!r.ok) throw new Error(data.error||("Erro "+r.status));
    return data;
  },
  notion(action,payload={}){ return this.call("notion",{action,...payload}); },
  setState(state,msg){
    this.state=state; this.msg=msg||"";
    const c=document.getElementById("cloudChip"); if(!c) return;
    c.classList.remove("ok","busy","err");
    if(state!=="off") c.classList.add(state);
    const label = state==="ok"?"☁️ Notion ✓":state==="busy"?"☁️ Salvando…":state==="err"?"⚠️ Notion: erro":"☁️ Notion: configurar";
    c.textContent=label; c.title=this.msg;
  },
  snapshot(){
    const d=deepClone(DB);
    (d.meetingNotes||[]).forEach(n=>{ if(n.notionUrl && n.transcript){ n.transcript=""; n.transcriptInNotion=true; } });
    if(DB.site) d.sitePublic=sitePublicData(); // versão pronta (links do WhatsApp/Instagram montados) para a página pública
    return d;
  },
  schedulePush(){
    if(!this.enabled()) return;
    clearTimeout(this.pushTimer);
    this.setState("busy","Alterações pendentes…");
    this.pushTimer=setTimeout(()=>this.push(),2500);
  },
  async push(){
    if(!this.enabled()) return;
    if(this.pushing){ this.pushAgain=true; return; }
    this.pushing=true; this.setState("busy","Salvando no Notion…");
    try{
      await this.notion("save",{data:this.snapshot()});
      this.setState(this.queue.length?"busy":"ok","Salvo no Notion às "+new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}));
    }catch(e){ this.setState("err",e.message); }
    this.pushing=false;
    if(this.pushAgain){ this.pushAgain=false; this.push(); }
  },
  async pull(force){
    const r=await this.notion("load");
    if(!r.data) return "empty";
    const remoteTs=Number(r.data.updatedAt||0), localTs=Number(DB.updatedAt||0);
    if(!force && remoteTs<=localTs) return remoteTs<localTs?"local-newer":"same";
    const localNotes=new Map((DB.meetingNotes||[]).map(n=>[n.id,n]));
    (r.data.meetingNotes||[]).forEach(n=>{ const l=localNotes.get(n.id); if(l && !n.transcript && l.transcript) n.transcript=l.transcript; });
    const data=applyCurriculum(ensureGroupData(r.data));
    data.weeklyPlanning=data.weeklyPlanning||{}; data.meetingNotes=data.meetingNotes||[]; data.ideas=data.ideas||[];
    data.updatedAt=remoteTs;
    DB=data; save(DB,{touch:false}); renderAll();
    return "pulled";
  },
  async init(){
    if(!this.enabled()){ this.setState("off","Clique para conectar ao Notion"); return; }
    this.setState("busy","Conectando ao Notion…");
    try{
      const res=await this.pull(false);
      if(res==="empty" && DB._fromInitial){ this.setState("err","O Notion ainda está vazio e este navegador só tem a base inicial. Importe seu backup JSON (⬆️ Importar)."); this.processQueue(); return; }
      if(res==="empty"||res==="local-newer") await this.push();
      else this.setState("ok", res==="pulled"?"Dados atualizados a partir do Notion":"Sincronizado com o Notion");
      this.processQueue();
    }catch(e){ this.setState("err",e.message); }
  },
  enqueue(action,payload){
    if(!this.enabled()) return;
    this.queue.push({action,payload:deepClone(payload),tries:0});
    this.persistQueue(); this.processQueue();
  },
  persistQueue(){ try{ localStorage.setItem("ewd_cloud_queue",JSON.stringify(this.queue)); }catch(e){} },
  async processQueue(){
    if(this.processing||!this.enabled()||!this.queue.length) return;
    this.processing=true;
    while(this.queue.length){
      const item=this.queue[0];
      this.setState("busy",`Enviando ao Notion (${this.queue.length} pendente(s))…`);
      try{
        const out=await this.notion(item.action,item.payload);
        this.queue.shift(); this.persistQueue();
        this.afterAction(item,out);
      }catch(e){
        item.tries=(item.tries||0)+1;
        if(item.tries>=5 || /desconhecida|sem ID|sem dados/i.test(e.message)){ this.dropped.push({...item,error:e.message}); this.queue.shift(); }
        this.persistQueue(); this.setState("err","Fila do Notion: "+e.message);
        break;
      }
    }
    this.processing=false;
    if(!this.queue.length && this.state!=="err" && !this.pushing) this.setState("ok","Tudo salvo no Notion");
  },
  afterAction(item,out){
    if(item.action==="saveMeeting" && out?.url){
      const n=(DB.meetingNotes||[]).find(x=>x.id===item.payload.meeting.id);
      if(n){ n.notionUrl=out.url; save(); if(document.getElementById("meeting")?.classList.contains("active")) renderMeetingNotes(); }
    }
  },
  syncAll(){
    if(!this.enabled()){ openCloudSettings(); return; }
    DB.students.forEach(s=>this.queue.push({action:"upsertStudent",payload:deepClone({student:s,key:studentKey(s)}),tries:0}));
    (DB.inactiveStudents||[]).forEach(s=>this.queue.push({action:"upsertStudent",payload:deepClone({student:s,key:s.day?studentKey(s):`${s.name}||`,active:false}),tries:0}));
    (DB.records||[]).forEach(r=>this.queue.push({action:"upsertRecord",payload:deepClone({record:r}),tries:0}));
    (DB.meetingNotes||[]).filter(n=>!n.notionUrl).forEach(n=>this.queue.push({action:"saveMeeting",payload:deepClone({meeting:n}),tries:0}));
    (DB.projects||[]).forEach(p=>this.queue.push({action:"upsertProject",payload:deepClone({project:p}),tries:0}));
    (DB.ideas||[]).forEach(i=>this.queue.push({action:"upsertPost",payload:deepClone({post:i}),tries:0}));
    this.persistQueue(); this.push(); this.processQueue();
    alert(`${this.queue.length} item(ns) na fila para o Notion. Pode continuar usando o painel enquanto envia.`);
  }
};
setInterval(()=>Cloud.processQueue(),60*1000);

  showModal(`<div class="modalhead"><div><h2>☁️ Conexão com o Notion</h2><div class="muted">Tudo o que você registra no painel é salvo no Notion: turmas, aulas, reposições, planning e meeting notes com transcrição.</div></div><button class="btn" onclick="closeModal()">Fechar</button></div>

      ${Cloud.queue.length?`<br><span class="small">${Cloud.queue.length} item(ns) aguardando envio.</span>`:""}
      ${Cloud.dropped.length?`<br><span class="small">${Cloud.dropped.length} item(ns) não puderam ser enviados: ${esc(Cloud.dropped[Cloud.dropped.length-1].error)}</span>`:""}</div>
    <label>Senha do painel <span class="muted">(a mesma da variável EWD_PASSWORD na Vercel)</span></label>

      ${Cloud.enabled()?`<button class="btn" onclick="cloudPullNow()">⬇️ Puxar dados do Notion</button>
      <button class="btn" onclick="Cloud.syncAll()">⬆️ Enviar tudo para o Notion</button>
      <button class="btn danger" onclick="cloudDisconnect()">Desconectar este navegador</button>`:""}
    </div>
    <div id="cloudTest" class="small muted" style="margin-top:12px"></div>`);

async function cloudConnect(){
  const pw=document.getElementById("cloudPw").value.trim();
  const out=document.getElementById("cloudTest");
  if(!pw){ out.textContent="Digite a senha."; return; }
  Cloud.pw=pw; out.textContent="Testando…";
  try{
    const r=await Cloud.notion("ping");
    localStorage.setItem("ewd_cloud_pw",pw);
    out.innerHTML=`✅ Conectado ao Notion. ${r.transcription?"IA de feedback ativa.":"⚠️ Falta a variável OPENAI_API_KEY na Vercel para gerar os feedbacks."}`;
    await Cloud.init();
  }catch(e){
    out.innerHTML="❌ "+esc(e.message);
    Cloud.pw=localStorage.getItem("ewd_cloud_pw")||"";
  }
}
async function cloudPullNow(){
  if(!confirm("Substituir os dados deste navegador pela cópia salva no Notion?")) return;
  try{ const r=await Cloud.pull(true); alert(r==="empty"?"Ainda não há cópia no Notion.":"Dados carregados do Notion."); Cloud.setState("ok","Dados carregados do Notion"); closeModal(); }
  catch(e){ alert("Erro: "+e.message); }
}
function cloudDisconnect(){
  if(!confirm("Desconectar este navegador do Notion? Os dados continuam salvos no Notion.")) return;
  localStorage.removeItem("ewd_cloud_pw"); Cloud.pw=""; Cloud.setState("off"); closeModal();
}

  const s=DB.students[index]; if(!s)return;
  const reason=(document.getElementById("inactiveReason")?.value||"").trim();

function reactivateStudent(index){
  const s=(DB.inactiveStudents||[])[index]; if(!s)return;
  const oldKey=s.day?studentKey(s):`${s.name}||`;
  const day=document.getElementById("raDay")?.value||s.day, time=(document.getElementById("raTime")?.value||s.time||"").trim();
  if(!time){alert("Informe o horário.");return;}
  const note=(document.getElementById("raNote")?.value||"").trim();
  const restored={...s,day,time,level:document.getElementById("raLevel")?.value||s.level,group:s.group||"Individual",progress:s.progress||0,
    statusLog:[...(s.statusLog||[]),{action:"reativado",date:todayISO(),reason:note}]};
  restored.members=groupMembers(restored);

  DB.inactiveStudents.splice(index,1);
  save();closeModal();renderAll();

}

function saveRecord(key){
  const s=DB.students.find(x=>studentKey(x)===key); if(!s)return;
  const prog=Number(document.querySelector("#progGroup .selected")?.dataset.prog||100);
  let lesson="";
  const custom=(rCustom.value||"").trim();
  if(custom) lesson=custom;
  else {
    const [level,code]=(rLesson.value||"||").split("||");
    const l=allLessons().find(x=>x.level===level&&x.code===code);
    lesson=l?`${l.code} — ${l.title}`:"";
  }
  const [selectedLevel,selectedCode]=(rLesson.value||"||").split("||");
  const members=groupMembers(s);
  let attendance=[];
  if(members.length>1){
    attendance=members.map(name=>{
      const box=[...document.querySelectorAll(".member-statuses")].find(x=>x.dataset.member===name);
      return {name,status:box?.querySelector(".selected")?.dataset.status||"✅ Presente"};
    });
  }else{
    const st=document.querySelector("#statusGroup .selected")?.dataset.status||"✅ Presente";
    attendance=[{name:members[0]||s.name,status:st}];
  }
  const st=attendance.every(a=>a.status===attendance[0].status) ? attendance[0].status : "👥 Presenças individuais";
  const rec={id:Date.now(),date:rDate.value,student:s.name,schedule:key,status:st,attendance,warmup:rWarm.value,lesson,lessonCode:selectedCode||"",lessonLevel:selectedLevel||"",progress:prog,stoppedAt:rStop.value,homeworkDone:rHwDone.value,note:rNote.value,
    skills:[...document.querySelectorAll("#rSkills .skillchip.on")].map(x=>x.dataset.skill),participation:document.getElementById("rPart")?.value||""};
  DB.records.push(rec);
  if(rWarm.value) DB.warmupUsage.push({date:rDate.value,student:s.name,warmup:rWarm.value,recordId:rec.id});
  s.last=lesson||s.last; s.progress=prog;
  save(); closeModal(); renderAll();
  Cloud.enqueue("upsertRecord",{record:rec});
  Cloud.enqueue("upsertStudent",{student:s,key:studentKey(s)});
}
function suggestWarmups(name){
  const hist=warmHistory(name);
  const lastMap={}; hist.forEach((x,i)=>{if(lastMap[x.warmup]===undefined)lastMap[x.warmup]=x.date});
  return [...DB.warmups].sort((a,b)=>{
    const ad=lastMap[a],bd=lastMap[b];
    if(!ad&&!bd)return a.localeCompare(b);
    if(!ad)return -1;if(!bd)return 1;
    return ad.localeCompare(bd);
  });
}

function addStudent(){
  const type=document.getElementById("aGroup").value;
  const members=[...document.querySelectorAll(".aMember")].map(x=>x.value.trim()).filter(Boolean);
  const required=type==="Individual"?1:type==="Dupla"?2:type==="Trio"?3:2;
  if(members.length<required){
    alert(`Adicione ${required} nome(s) para cadastrar esta ${type.toLowerCase()}.`);
    return;
  }
  const name=members.join(" + ");
  const exists=DB.students.some(s=>s.name===name && s.day===aDay.value && s.time===aTime.value.trim());
  if(exists){alert("Essa turma já está cadastrada nesse dia e horário.");return;}

  if(meet===null){alert("O link do Meet parece inválido. Use o formato https://meet.google.com/abc-defg-hij");return;}
  const ns={

    members,
    level:aLevel.value,
    day:aDay.value,
    time:aTime.value.trim(),
    group:type,
    last:aLast.value.trim(),
    progress:0,
    notes:aNotes.value.trim(),
    meet
  };

/* ================= Posts & Ideias: Banco de ideias · Instagram · Calendário (mesmos dados) ================= */
const POST_STAGES=["Ideia","Roteiro","Gravado","Editado","Postado"];
const POST_FORMATS=["Reels","Carrossel","Foto","Story","Live","TikTok","YouTube"];
const POST_PILLARS=["📚 Inglês & aprendizagem","🌍 Cultura & curiosidades","🗣️ Conversation","🎓 Método & aulas","👩‍🎓 Alunos & resultados","💼 Negócio"];
const POST_OBJECTIVES=["Atrair","Engajar","Converter","Fidelizar"];
const STAGE_COLORS={Ideia:"#f7f1ea",Roteiro:"#fbe9dc",Gravado:"#fdf1d8",Editado:"#f3ece4",Postado:"#edf3ee"};
const MONTHS_PT=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
var IDEAS_UI={view:(()=>{try{return localStorage.getItem("ewd_ideas_view")||"instagram"}catch(e){return "instagram"}})(),format:"",month:todayISO().slice(0,7),objective:""};

function normalizePost(i){
  const stageMap={"Produção":"Gravado","Agendado":"Editado"};
  const fmtMap={"Stories":"Story","Post":"Foto"};
  i.stage=stageMap[i.stage]||i.stage||"Ideia"; if(!POST_STAGES.includes(i.stage)) i.stage="Ideia";
  i.format=fmtMap[i.format]||i.format||"Reels";
  i.metrics=i.metrics||{};
  return i;
}
function postEngagement(i){
  const m=i.metrics||{}, reach=Number(m.reach)||0;
  if(!reach) return null;
  const inter=["likes","comments","saves","shares"].reduce((a,k)=>a+(Number(m[k])||0),0);
  return inter/reach*100;
}
function fmtDateShort(iso){ if(!iso) return ""; const d=new Date(iso+"T12:00:00"); return d.toLocaleDateString("pt-BR",{day:"numeric",month:"short"}).replace(".",""); }
function projectById(id){ return (DB.projects||[]).find(p=>p.id===id); }
function setIdeasView(v){ IDEAS_UI.view=v; try{localStorage.setItem("ewd_ideas_view",v)}catch(e){} renderIdeas(); }
function syncPost(i){ Cloud.enqueue("upsertPost",{post:i}); }

function renderIdeas(){
  const box=document.getElementById("ideas"); if(!box) return;
  DB.ideas=(DB.ideas||[]).map(normalizePost);
  const tabs=[["ideias","💡 Banco de ideias"],["instagram","📸 Instagram"],["calendario","🗓️ Calendário"]];
  let body="";
  if(IDEAS_UI.view==="ideias") body=ideasBankHTML();
  else if(IDEAS_UI.view==="calendario") body=ideasCalendarHTML();
  else body=ideasInstagramHTML();
  box.innerHTML=`
    <div class="toolbar" style="justify-content:space-between;align-items:flex-end;margin-bottom:16px">
      <div><div class="muted">Do insight ao post publicado — tudo conectado: o que muda no Instagram aparece no Calendário e no Banco de ideias.</div></div>
      <button class="btn primary" onclick="openIdeaModal()">+ Novo post / ideia</button>
    </div>
    <div class="subtabs">${tabs.map(([k,l])=>`<button class="pill ${IDEAS_UI.view===k?"on":""}" onclick="setIdeasView('${k}')">${l}</button>`).join("")}</div>
    ${body}`;
  if(IDEAS_UI.view==="ideias") filterIdeaList();
}

/* ---------- Instagram (kanban) ---------- */
function ideasInstagramHTML(){
  const list=DB.ideas.filter(i=>!IDEAS_UI.format||i.format===IDEAS_UI.format);
  const cols=POST_STAGES.map(st=>{

    return `<div class="kcol" style="background:${STAGE_COLORS[st]}" ondragover="event.preventDefault();this.classList.add('over')" ondragleave="this.classList.remove('over')" ondrop="dropPostStage(event,'${st}');this.classList.remove('over')">

        ${top.map(i=>{const m=i.metrics,e=postEngagement(i);return `<tr style="cursor:pointer" onclick="openIdeaModal('${i.id}')"><td><b>${esc(i.title)}</b> <span class="fmt fmt-${esc(i.format)}">${esc(i.format)}</span></td><td>${fmtDateShort(i.date)}</td><td style="text-align:right">${esc(m.reach||0)}</td><td style="text-align:right">${esc(m.likes||0)}</td><td style="text-align:right">${esc(m.comments||0)}</td><td style="text-align:right">${esc(m.saves||0)}</td><td style="text-align:right">${esc(m.shares||0)}</td><td style="text-align:right">${e===null?"—":e.toFixed(1)+"%"}</td></tr>`}).join("")}
      </tbody></table></div>`:`<div class="muted">Quando um post estiver em <b>Postado</b>, abra o card e anote alcance, curtidas, comentários, salvos e compartilhamentos — o ranking aparece aqui.</div>`}
    </div>`;
}
function postCardHTML(i){
  const pr=i.projectId?projectById(i.projectId):null;
  return `<div class="kcard" draggable="true" ondragstart="event.dataTransfer.setData('text/plain','${i.id}')" onclick="openIdeaModal('${i.id}')">

function dropPostStage(ev,stage){
  ev.preventDefault();
  const id=ev.dataTransfer.getData("text/plain"); const i=DB.ideas.find(x=>x.id===id); if(!i||i.stage===stage) return;
  i.stage=stage; save(); renderIdeas(); syncPost(i);
  if(stage==="Postado" && !Number(i.metrics?.reach)) setTimeout(()=>openIdeaModal(i.id,{focusMetrics:true}),50);

  const [y,m]=IDEAS_UI.month.split("-").map(Number);

    const iso=`${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;

            <button class="btn small" onclick="calMove(-1)">‹</button>
            <h2 style="margin:0;min-width:190px;text-align:center">${MONTHS_PT[m-1]} ${y}</h2>

        </div>
        <div class="cal-grid">${["Seg","Ter","Qua","Qui","Sex","Sáb","Dom"].map(d=>`<div class="cwd">${d}</div>`).join("")}${cells}</div>
        <div class="cal-legend">${POST_STAGES.map(s=>`<span><i class="st-${s}"></i>${s}</span>`).join("")}</div>

          ${POST_OBJECTIVES.map(o=>`<div class="bal"><span>${o}</span><b>${byObj[o]}</b></div>`).join("")}

          <div class="muted small" style="margin-bottom:8px">Arraste para um dia do calendário.</div>
          ${unscheduled.map(i=>`<div class="cchip st-${esc(i.stage)}" draggable="true" ondragstart="event.dataTransfer.setData('text/plain','${i.id}')" onclick="openIdeaModal('${i.id}')">${esc(i.format)} · ${esc(i.title)}</div>`).join("")||`<div class="muted small">Tudo agendado ✨</div>`}
        </div>
      </div>

function calMove(delta){ const [y,m]=IDEAS_UI.month.split("-").map(Number); const d=new Date(y,m-1+delta,1); IDEAS_UI.month=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`; renderIdeas(); }
function dropPostDate(ev,iso){

/* ---------- Modal do post (usado pelas 3 visões e pelos Projetos) ---------- */
function openIdeaModal(id=null,preset={}){

    <div><label>Etapa</label><select id="ideaStage">${opts(POST_STAGES,i.stage)}</select></div>
    <div><label>Formato</label><select id="ideaFormat">${opts(POST_FORMATS,i.format)}</select></div>
    <div><label>Data de postagem</label><input id="ideaDate" type="date" value="${esc(i.date||'')}"></div>
    <div><label>Horário</label><input id="ideaTime" type="time" value="${esc(i.time||'')}"></div>
    <div><label>Pilar</label><select id="ideaPillar">${opts(POST_PILLARS,i.pillar)}</select></div>
    <div><label>Objetivo</label><select id="ideaObjective">${opts(POST_OBJECTIVES,i.objective)}</select></div>
    <div><label>Nível</label><select id="ideaLevel">${opts(["Todos","A1","A2","B1","B2","C1"],i.level||'Todos')}</select></div>
    <div><label>Projeto ligado</label><select id="ideaProject">${projOpts}</select></div>
    <div class="full"><label>Notas / roteiro / CTA</label><textarea id="ideaNotes">${esc(i.notes||'')}</textarea></div>
    <div class="full" id="metricsBox"><label>📊 Métricas (depois de postar)</label>
      <div class="metrics-grid">
        ${[["reach","Alcance"],["likes","Curtidas"],["comments","Comentários"],["saves","Salvos"],["shares","Compart."]].map(([k,l])=>`<div><span class="muted small">${l}</span><input type="number" min="0" id="m_${k}" value="${esc(m[k]??'')}"></div>`).join("")}
      </div></div>
  </div>

    ${id?`<button class="btn danger" onclick="deleteIdea('${id}')">Excluir</button>`:"<span></span>"}
    <button class="btn primary" onclick="saveIdea('${id||''}')">Salvar</button>
  </div>`);
  if(preset.focusMetrics) setTimeout(()=>{document.getElementById("metricsBox")?.scrollIntoView({block:"center"});document.getElementById("m_reach")?.focus()},50);
}
function saveIdea(id){
  const val=x=>document.getElementById(x).value;
  const prev=id?DB.ideas.find(x=>x.id===id):null;
  const metrics={}; ["reach","likes","comments","saves","shares"].forEach(k=>{const v=val("m_"+k); if(v!=="") metrics[k]=Number(v);});
  const item={...(prev||{}),id:id||('idea_'+Date.now()),title:val("ideaTitle").trim(),stage:val("ideaStage"),format:val("ideaFormat"),date:val("ideaDate"),time:val("ideaTime"),pillar:val("ideaPillar"),objective:val("ideaObjective"),level:val("ideaLevel"),projectId:val("ideaProject"),notes:val("ideaNotes").trim(),metrics};
  if(!item.title){alert('Digite um título para a ideia.');return}
  if(prev) Object.assign(prev,item); else DB.ideas.unshift(item);
  save(); closeModal(); renderIdeas(); renderProjects(); syncPost(prev||item);
}
function editIdea(id){openIdeaModal(id)}
function deleteIdea(id){
  if(!confirm('Excluir este post/ideia?')) return;
  DB.ideas=DB.ideas.filter(i=>i.id!==id); save(); closeModal(); renderIdeas(); renderProjects();
  Cloud.enqueue("deleteItem",{kind:"post",id});
}

function ensureSite(){
  if(DB.site && !DB.site.popupMigrated){
    const g=(DB.site.products||[]).find(p=>p.id==="p_guided");
    if(g && !g.mode){ g.mode="popup"; g.popupTitle=g.popupTitle||"Guided Immersion in English"; g.popupText=g.popupText||"Primeiro descubra a série ideal para você e depois escolha o seu material 💛";
      g.popupLinks=[{label:"🔎 Descobrir minha série",url:g.url||""},{label:"",url:""},{label:"",url:""},{label:"",url:""},{label:"",url:""},{label:"",url:""}]; }
    DB.site.popupMigrated=true; save();
  }
  if(DB.site && !Array.isArray(DB.site.sections)){ DB.site.sections=SITE_DEFAULT_SECTIONS.map(x=>({...x})); DB.site.contactTop=false; save(); }
  if(DB.site && DB.site.productsVersion!==2){ DB.site.products=SITE_PRODUCTS.map(p=>({...p})); DB.site.productsVersion=2; save(); }
  if(DB.site){
    // Preenche os depoimentos se a página já existia com os campos vazios.
    if(!(DB.site.testimonials||[]).some(t=>t.url)){ DB.site.testimonials=SITE_TESTIMONIALS.map(t=>({...t})); save(); }
    return;
  }
  const prod=(title,tag,emoji,color,desc)=>({id:"p_"+title.toLowerCase().replace(/[^a-z0-9]+/g,"_").slice(0,30),title,tag,color,desc,details:"",price:"",cta:"Quero participar",url:"",visible:true});
  DB.site={
    published:true, font:"nunito", name:"English with Denise", kicker:"Teacher Denise", accent:"#aa7d5b", buttonColor:"#f2c94c", highlightFirst:true,
    bio:"Aulas de inglês online, leves e personalizadas — do A1 ao B2.",
    photo:"", footer:"English with Denise",
    productsTitle:"Meus produtos", productsSub:"Escolha o caminho que combina com você.",
    testimonialsTitle:"O que meus alunos dizem", testimonialsSub:"",
    links:[
      {id:"l_whats",type:"whatsapp",label:"Fale comigo no WhatsApp",url:"",visible:true},
      {id:"l_insta",type:"instagram",label:"Instagram",url:"",visible:true},
      {id:"l_mail",type:"email",label:"E-mail",url:"",visible:true}
    ],
    products:SITE_PRODUCTS.map(p=>({...p})), productsVersion:2,
    sections:SITE_DEFAULT_SECTIONS.map(x=>({...x})), contactTop:false,
    testimonials:SITE_TESTIMONIALS.map(t=>({...t}))
  };
  save(DB,{touch:false});
}
function siteChanged(rerender){ save(); sitePreview(); if(rerender) renderSite(); }
function siteSet(field,value){ DB.site[field]=value; siteChanged(false); }
function siteListSet(list,id,field,value){ const it=DB.site[list].find(x=>x.id===id); if(it){ it[field]=value; siteChanged(false); } }
function siteMove(list,id,dir){ const a=DB.site[list]; const i=a.findIndex(x=>x.id===id), j=i+dir; if(i<0||j<0||j>=a.length) return; [a[i],a[j]]=[a[j],a[i]]; siteChanged(true); }

function siteAddVideo(){ DB.site.testimonials.push({id:"t_"+Date.now(),url:"",name:"",quote:""}); siteChanged(true); }
function siteLinkUrl(l){
  const v=String(l.url||"").trim();
  if(l.type==="whatsapp" && /^[\d\s()+-]{8,}$/.test(v)){ let n=v.replace(/\D/g,""); if(n.length<=11) n="55"+n; return "https://wa.me/"+n+(l.message?"?text="+encodeURIComponent(l.message):""); }
  if(l.type==="instagram" && /^@?[\w.]+$/.test(v) && !v.includes(".com")) return "https://instagram.com/"+v.replace(/^@/,"");
  if(l.type==="email" && /^[\w.+-]+@[\w-]+\.[\w.]+$/.test(v)) return "mailto:"+v;
  if(l.type==="telegram" && /^@?[\w]+$/.test(v)) return "https://t.me/"+v.replace(/^@/,"");
  return v;
}
function sitePublicData(){
  const s=deepClone(DB.site);
  s.links=s.links.map(l=>({...l,url:siteLinkUrl(l),display:(l.type==="instagram"&&l.url&&!/^https?:/.test(l.url))?"@"+String(l.url).replace(/^@/,""):((["whatsapp","email","telegram"].includes(l.type)&&!/^https?:/.test(l.url||""))?l.url:"")}));
  const fixWa=u=>String(u||"").replace(/(wa\.me\/)(\d{10,11})(?=\D|$)/,(m,a,n)=>a+"55"+n);
  s.links.forEach(l=>l.url=fixWa(l.url));
  s.products.forEach(p=>{ p.url=fixWa(p.url); (p.popupLinks||[]).forEach(x=>x.url=fixWa(x.url)); });
  const w=DB.site.links.find(l=>l.type==="whatsapp"&&l.url&&l.visible!==false);
  if(w){ const base=siteLinkUrl({...w,message:""}).split("?")[0];
    s.products.forEach(p=>{ if(!p.url) p.url=base+"?text="+encodeURIComponent(`Oi Denise! Quero saber mais sobre: ${p.title}`); }); }
  return s;
}
function sitePreview(){
  const f=document.getElementById("sitePreview");
  if(f && f.contentWindow) f.contentWindow.postMessage({type:"ewd-site",site:sitePublicData()},"*");
}
window.addEventListener("message",e=>{ if(e.data&&e.data.type==="ewd-site-ready") sitePreview(); });
function siteUrl(){ return location.origin.startsWith("http") ? location.origin+"/links" : "(publique na Vercel para ter o link)"; }
function copySiteUrl(){ const u=siteUrl(); navigator.clipboard.writeText(u).then(()=>alert("Link copiado: "+u)).catch(()=>prompt("Copie o link:",u)); }
async function sitePublishNow(){
  if(!Cloud.enabled()){ alert("Conecte o Notion (☁️ no topo) para publicar a página."); openCloudSettings(); return; }
  clearTimeout(Cloud.pushTimer); await Cloud.push();
  alert(Cloud.state==="err" ? "Não foi possível publicar: "+Cloud.msg : "Publicado! A página atualiza em até 1 minuto.");
}

// Imagens: reduz no navegador para não pesar (capa 600px, foto 320px).
function siteImage(input,target,id,maxW){
  const file=input.files&&input.files[0]; if(!file) return;
  const fr=new FileReader();
  fr.onload=()=>{ const img=new Image(); img.onload=()=>{
      const scale=Math.min(1,maxW/img.width), c=document.createElement("canvas");
      c.width=Math.round(img.width*scale); c.height=Math.round(img.height*scale);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      const data=c.toDataURL("image/jpeg",.78);
      if(target==="photo") siteSet("photo",data); else siteListSet("products",id,"image",data);
      if(target==="photo") renderSite(); else openSiteProduct(id);
    }; img.src=fr.result; };
  fr.readAsDataURL(file);
}

function siteAddSection(kind){
  const base={id:"sec_"+Date.now(),kind,visible:true};
  if(kind==="text") Object.assign(base,{title:"Novo texto",sub:"",body:"",align:"left"});
  if(kind==="links") Object.assign(base,{title:"Links úteis",sub:"",items:[{id:"i"+Date.now(),label:"",url:""}]});
  if(kind==="message") Object.assign(base,{emoji:"📣",title:"Inscrições abertas!",body:"",tone:"lilas",btnLabel:"",btnUrl:""});
  const cIdx=DB.site.sections.findIndex(x=>x.kind==="contact");
  if(cIdx>=0) DB.site.sections.splice(cIdx,0,base); else DB.site.sections.push(base);
  siteChanged(true); openSiteSection(base.id);
}
function secSet(id,field,value){ siteListSet("sections",id,field,value); }
function secItem(id,iid,field,value){
  const x=DB.site.sections.find(y=>y.id===id); if(!x) return; x.items=x.items||[];
  if(field==="add"){ x.items.push({id:"i"+Date.now(),label:"",url:""}); siteChanged(false); openSiteSection(id); return; }
  if(field==="del"){ x.items=x.items.filter(i=>i.id!==iid); siteChanged(false); openSiteSection(id); return; }
  const it=x.items.find(i=>i.id===iid); if(it){ it[field]=value; siteChanged(false); }
}

function siteProdPopup(id){
  const p=DB.site.products.find(x=>x.id===id); if(!p) return;

function siteProdPopupLink(id,k,field,value){

function siteProdWhats(id){

const SKILLS=["Speaking","Listening","Reading","Writing","Grammar","Vocabulary","Pronunciation"];

const LEAD_STAGES=["Novo","Contato feito","Aula experimental","Placement test","Proposta enviada","Matriculado","Perdido"];
const LEAD_ORIGINS=["Instagram","Indicação","WhatsApp","Página de links","Site","Ex-aluno","Outro"];
function fmtBRL(n){ return (Number(n)||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"}); }
function monthISO(d=new Date()){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`; }
function monthLabel(m){ const [y,mm]=m.split("-").map(Number); const t=new Date(y,mm-1,1).toLocaleDateString("pt-BR",{month:"long",year:"numeric"}); return t.charAt(0).toUpperCase()+t.slice(1); }
function addMonths(m,k){ const [y,mm]=m.split("-").map(Number); return monthISO(new Date(y,mm-1+k,1)); }
function hubInit(){
  DB.payments=DB.payments||{}; DB.finance=DB.finance||[]; DB.leads=DB.leads||[]; DB.avisos=DB.avisos||[]; DB.diary=DB.diary||[];
  if(!DB.financeStart){ DB.financeStart=monthISO(); save(DB,{touch:false}); }
}
function memberInfo(s,name){ s.memberInfo=s.memberInfo||{}; s.memberInfo[name]=s.memberInfo[name]||{}; return s.memberInfo[name]; }
function memberField(s,name,f,def){ const mi=(s.memberInfo||{})[name]||{}; const v=mi[f]; return v!==undefined&&v!==""&&v!==null?v:(s[f]!==undefined&&s[f]!==""?s[f]:def); }
function memberDue(s,name){ return Number(memberField(s,name,"dueDay",10))||10; }
function memberStart(s,name){ return memberField(s,name,"startDate",""); }
function memberFee(s,name){ const mi=(s.memberInfo||{})[name]||{}; const v=mi.fee!==undefined&&mi.fee!==""?mi.fee:s.fee; return v===undefined||v===""?null:Number(v); }
function participationScore(r){ return ({Excelente:1,Boa:1,"Média":0,Baixa:0})[r.participation]; }

function fichaResumo(s,hist){
  const recs=hist.filter(r=>!/não tivemos aula/i.test(r.lesson||""));
  const pr=recs.filter(r=>r.participation); const part=pr.length?Math.round(pr.filter(r=>participationScore(r)).length/pr.length*100):null;
  const att=hist.filter(r=>r.status); const pres=att.length?Math.round(att.filter(r=>["✅ Presente","✔️ Rep. Feita","👥 Presenças individuais"].includes(r.status)).length/att.length*100):null;
  const hw=hist.filter(r=>r.homeworkDone); const hwp=hw.length?Math.round(hw.filter(r=>/Sim/.test(r.homeworkDone)).length/hw.length*100):null;
  const sk=recs.filter(r=>Array.isArray(r.skills)&&r.skills.length);
  const pend=hist.filter(r=>r.status==="🔄 Rep. Pendente").length;
  const pct=v=>v===null?`<span style="font-size:18px">—</span>`:`${v}<small>%</small>`;
  return `
    <div class="kpis">
      <div class="kpic hl"><div class="k">Participação</div><div class="v">${pct(part)}</div><div class="d">aulas com participação boa ou excelente</div></div>
      <div class="kpic"><div class="k">Frequência</div><div class="v">${pct(pres)}</div><div class="d">aulas com presença</div></div>
      <div class="kpic"><div class="k">Homework em dia</div><div class="v">${pct(hwp)}</div><div class="d">quando havia homework</div></div>
      <div class="kpic"><div class="k">Aulas registradas</div><div class="v">${hist.length}</div><div class="d">${pend?`${pend} reposição(ões) pendente(s)`:"nenhuma reposição pendente"}</div></div>
    </div>
    <div class="grid">
      <div class="card span6"><h3 style="font-family:Georgia,serif;font-size:19px;font-weight:500">Skills trabalhadas</h3><div class="muted small">em % das aulas registradas com skills</div>
        <div class="bars">${SKILLS.map(k=>{const v=sk.length?Math.round(sk.filter(r=>r.skills.includes(k)).length/sk.length*100):0;return `<div class="bar"><span>${k}</span><div class="track"><div class="fill" style="width:${v}%"></div></div><span class="pct">${v}%</span></div>`}).join("")}</div>
        ${sk.length?"":`<div class="notice small" style="margin-top:10px">Marque as skills ao registrar cada aula e este gráfico se preenche sozinho.</div>`}
      </div>
      <div class="card span6"><h3 style="font-family:Georgia,serif;font-size:19px;font-weight:500">Últimas aulas</h3>
        ${hist.slice(0,5).map(r=>`<div class="tl-item"><div class="tl-date">${dateBR(r.date).slice(0,5)}</div><div>
          <div class="chips" style="margin:0 0 4px">${r.status?`<span class="chip ${/Presente|Feita/.test(r.status)?"ok":/Falta/.test(r.status)?"bad":"warn"}">${esc(r.status)}</span>`:""}${r.participation?`<span class="chip ${participationScore(r)?"ok":"warn"}">Participação ${esc(r.participation.toLowerCase())}</span>`:""}${(r.skills||[]).map(k=>`<span class="chip">${k}</span>`).join("")}</div>
          <div class="small"><b>${esc(r.lesson||"—")}</b>${r.progress&&r.progress<100?` · ${r.progress}%`:""}</div>${r.note?`<div class="muted small">${esc(r.note)}</div>`:""}</div></div>`).join("")||`<div class="muted">Nenhuma aula registrada ainda.</div>`}
      </div>
    </div>`;
}

  const finFields=(get,cls,n,ph)=>`

var FIN_UI={month:monthISO()};
function payKey(m,name,key){ return `${m}|${key}|${name}`; }
function payStatus(s,name,m){
  const p=DB.payments[payKey(m,name,studentKey(s))];
  if(p&&p.paid) return {cls:"ok",label:"✓ Pago",paid:true};
  const start=memberStart(s,name);
  if(start && m<start.slice(0,7)) return {cls:"",label:"—",paid:false,na:true};
  const due=`${m}-${String(Math.min(memberDue(s,name),28)).padStart(2,"0")}`;
  if(m<(DB.financeStart||m)) return {cls:"",label:"—",paid:false,na:true};
  if(todayISO()>due) return {cls:"bad",label:"Atrasado",paid:false,late:true};
  return {cls:"warn",label:"Pendente",paid:false};
}
function togglePaid(m,name,key){
  const k=payKey(m,name,key); const p=DB.payments[k];

}
/* ---------- Desconto de aniversário (presente) ---------- */
function bdayCfg(){ const c=DB.bdayDiscount=DB.bdayDiscount||{on:false,pct:10}; c.mode="fixed"; c.amount=25; c.startMonth="2027-01"; c.startYear=2027; c.given=c.given||{}; return c; }
function bdayDiscValue(gross){ const c=bdayCfg(); if(gross===null||gross===undefined) return 0; return c.mode==="fixed"?Math.min(Number(c.amount)||0,gross):Math.round(gross*c.pct)/100; }
function bdayLabel(){ const c=bdayCfg(); return c.mode==="fixed"?fmtBRL(c.amount):`${c.pct}%`; }
var BDAY_UI={year:Math.max(new Date().getFullYear(),2027)};
// Regra: aniversário até o dia do vencimento → desconto na mensalidade daquele mês; depois do vencimento → no mês seguinte.
function bdayDiscMonth(s,n,year){
  const b=String(memberField(s,n,"birthday","")||""); const mm=+b.slice(5,7), dd=+b.slice(8,10); if(!mm||!dd) return "";
  const due=memberDue(s,n); let y=year, m=mm; if(dd>due){ m++; if(m>12){ m=1; y++; } }
  return `${y}-${String(m).padStart(2,"0")}`;
}
function bdayDiscFor(s,n,month){
  if(month<bdayCfg().startMonth) return false; const y=+month.slice(0,4); return [y,y-1].some(by=>bdayDiscMonth(s,n,by)===month);
}
function finRows(m){
  const rows=[], cfg=bdayCfg();
  DB.students.forEach(s=>groupMembers(s).forEach(n=>{ const gross=memberFee(s,n); let st=payStatus(s,n,m); if(gross===null&&!st.paid) st={cls:"",label:"Sem valor",paid:false,nofee:true};
    let fee=gross, disc=0; if(cfg.on&&gross!==null&&bdayDiscFor(s,n,m)){ disc=bdayDiscValue(gross); fee=+(gross-disc).toFixed(2); }
    rows.push({s,n,fee,gross,disc,st}); }));
  return rows;
}
function bdayYearRows(y){
  const out=[], seen=new Set();
  [...DB.students.map(s=>[s,true]),...(DB.inactiveStudents||[]).map(s=>[s,false])].forEach(([s,act])=>groupMembers(s).filter(n=>!/^a adicionar$/i.test(n)).forEach(n=>{
    if(seen.has(n)) return; seen.add(n);
    const gross=memberFee(s,n), b=memberField(s,n,"birthday",""), key=`${y}|${n}`, g=bdayCfg().given[key];
    if(!act&&!g) return;
    const m=b?([bdayDiscMonth(s,n,y-1),bdayDiscMonth(s,n,y)].find(x=>x&&x.startsWith(String(y))&&x>=bdayCfg().startMonth)||""):"";
    let auto=false; if(!g&&bdayCfg().on&&m&&act){ const r=finRows(m).find(x=>x.n===n&&x.s===s); auto=!!(r&&r.disc&&r.st.paid); }
    out.push({n,s,act,b,m,gross,value:g?Number(g.amount):bdayDiscValue(gross),given:g||null,auto,key});
  }));
  return out.sort((a,b)=>(a.m||"9999").localeCompare(b.m||"9999")||a.n.localeCompare(b.n));
}
function toggleBdayGiven(key,amount,month){
  const c=bdayCfg(); if(c.given[key]) delete c.given[key]; else c.given[key]={date:todayISO(),amount:Number(amount)||0,month};
  save(); renderFinance();
}

    .sort((a,b)=>(!!b.pinned-!!a.pinned)||((b.kind==="⭐ Importante")-(a.kind==="⭐ Importante"))||(a.date||"9999").localeCompare(b.date||"9999"));
}
function avisoRow(a,compact){
  const imp=a.kind==="⭐ Importante"||a.pinned;
  return `<div class="av-item ${imp?"imp":""}">
    <div class="av-ic">${esc((a.kind||"📣").split(" ")[0])}</div>
    <div class="main"><div class="av-t">${a.pinned?"📌 ":""}${esc(a.title)}</div>
      <div class="muted small">${a.date?`${a.date<todayISO()?"desde ":""}${dateBR(a.date)}`:""}${a.until?` · até ${dateBR(a.until)}`:""}${!compact&&a.kind?` · ${esc(a.kind.replace(/^\S+\s/,""))}`:""}</div>
      ${a.text&&!compact?`<div class="small" style="margin-top:4px;white-space:pre-wrap">${esc(a.text)}</div>`:""}</div>
    <div class="av-act">${compact?"":`<button class="btn small" onclick="openAviso(${a.id})" title="Editar">✏️</button>`}<button class="btn small" title="${a.done?"Reativar":"Arquivar"}" onclick="toggleAviso(${a.id})">${a.done?"↩︎":"✓"}</button></div>
  </div>`;
}
function renderAvisos(){
  const box=document.getElementById("avisos"); if(!box||!box.classList.contains("active")) return;

      ${bdays.map(b=>`<div class="tl-item"><div class="tl-date">${String(b.date.getDate()).padStart(2,"0")}/${String(b.date.getMonth()+1).padStart(2,"0")}</div><div><div class="small"><b>${esc(b.name)}</b>${b.age?` · ${b.age} anos`:""}<div class="muted">${b.diff===0?"hoje 🎉":b.diff===1?"amanhã":`em ${b.diff} dias`}</div></div>${b.diff<=7?`<div style="margin-top:4px">${bdayButtons(b)}</div>`:""}</div></div>`).join("")||`<div class="muted small">Nenhum aniversário nos próximos 60 dias.</div>`}
